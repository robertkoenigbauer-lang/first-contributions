<title>Majas Lernapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: Glas-Dashboard in Rosé und Flieder mit Seitenleiste; Fächer behalten ihre Heftfarbe, Mathe auf Karopapier. */
:root{
  --bg:#fbf0f6; --surface:rgba(255,255,255,.62); --solid:#fffafd; --fg:#2e2035; --muted:#7a6585; --line:#efd9ea; --glass:rgba(255,255,255,.8);
  --rose:#e0518f; --flieder:#8b6fd6; --pfirsich:#ffb38a;
  --page:radial-gradient(1200px 700px at 0% 0%,#ffd6e8 0%,transparent 60%),radial-gradient(900px 700px at 100% 10%,#e3d7ff 0%,transparent 60%),radial-gradient(900px 600px at 50% 100%,#ffe6d6 0%,transparent 60%),#fbf0f6;
  --paper:#fffef9; --paper-line:#cfdcef; --paper-margin:#f1a8a8;
  --ok:#1f8a4c; --ok-bg:#e3f5ea; --bad:#c23b3b; --bad-bg:#fbe7e7;
  --mathe:#2f6fd6; --deutsch:#d64545; --englisch:#f0c000; --nt:#2e9e5b; --gpg:#8b5a2b; --musik:#ffffff; --wib:#ec4899; --info:#a64fd9;
  --star:#f2b705; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a1d33; --surface:rgba(58,40,72,.58); --solid:#2e2238; --fg:#f7ecf4; --muted:#c9b5d3; --line:#4d3a5d; --glass:rgba(255,255,255,.12);
  --rose:#f27fb2; --flieder:#b29cf0; --pfirsich:#ffb38a;
  --page:radial-gradient(1200px 700px at 0% 0%,#5b2449 0%,transparent 60%),radial-gradient(900px 700px at 100% 10%,#37285e 0%,transparent 60%),#1d1424;
  --paper:#1f2434; --paper-line:#2f3a55; --paper-margin:#6e3a44;
  --ok:#5fd394; --ok-bg:#173527; --bad:#ff8a8a; --bad-bg:#3b1d22;
  --mathe:#6c9ef0; --deutsch:#f07777; --englisch:#f5cd3d; --nt:#5cc98a; --gpg:#c99263; --musik:#ffffff; --wib:#f472b6; --info:#d39af5;
  --star:#f7c948; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1d33; --surface:rgba(58,40,72,.58); --solid:#2e2238; --fg:#f7ecf4; --muted:#c9b5d3; --line:#4d3a5d; --glass:rgba(255,255,255,.12);
  --rose:#f27fb2; --flieder:#b29cf0; --pfirsich:#ffb38a;
  --page:radial-gradient(1200px 700px at 0% 0%,#5b2449 0%,transparent 60%),radial-gradient(900px 700px at 100% 10%,#37285e 0%,transparent 60%),#1d1424;
  --paper:#1f2434; --paper-line:#2f3a55; --paper-margin:#6e3a44;
  --ok:#5fd394; --ok-bg:#173527; --bad:#ff8a8a; --bad-bg:#3b1d22;
  --mathe:#6c9ef0; --deutsch:#f07777; --englisch:#f5cd3d; --nt:#5cc98a; --gpg:#c99263; --musik:#ffffff; --wib:#f472b6; --info:#d39af5;
  --star:#f7c948; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);background-attachment:fixed;min-height:100vh;color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1800px;margin:0 auto}
.inhalt{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px;width:100%;min-width:0}
.inhalt.weit{max-width:none}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--fach,var(--mathe));outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--fach,var(--mathe));color:#fff;font-size:1rem;min-height:48px}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.small{padding:8px 14px;min-height:40px;font-size:.95rem}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;align-self:flex-start}
/* Kopf */
.kopf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:96px}
.stat b{font-family:var(--f-display);font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* Heute dran */
.heute{--fach:var(--mathe);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:3px solid var(--fach)}
.heute .zahl{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--fach);font-variant-numeric:tabular-nums}
.heute .t{display:flex;gap:16px;align-items:center;min-width:0;flex:1 1 260px}
.proben{display:flex;flex-direction:column;gap:8px}
.probe-zeile{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);border-left:6px solid var(--fach)}
.probe-zeile .tage{font-family:var(--f-display);font-weight:800;font-size:1.2rem;min-width:5.5em;font-variant-numeric:tabular-nums}
/* Hefte */
.hefte{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.heft{position:relative;text-align:left;border:0;background:var(--surface);border-radius:6px 14px 14px 6px;padding:18px 16px 16px 30px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:140px;overflow:hidden}
.heft::before{content:"";position:absolute;inset:0 auto 0 0;width:16px;background:var(--fach)}
.heft .kurz{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--fach);line-height:1}
.heft .name{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.heft .info{font-size:.9rem;color:var(--muted);margin-top:auto}
.heft.leer{opacity:.75}
.balken{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.balken i{display:block;height:100%;background:var(--fach,var(--mathe));border-radius:99px;transition:width .3s}
/* Fachseite */
.fachkopf{border-left:10px solid var(--fach);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.themen{display:flex;flex-direction:column;gap:10px}
.thema{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.thema .t{min-width:0;flex:1 1 220px;display:flex;flex-direction:column;gap:4px}
.badge{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.badge.heft-q{border-color:var(--fach);color:var(--fach)}
.leerhinweis{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow);border:2px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.probe{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border:2px dashed var(--fach)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:700;cursor:pointer;user-select:none}
.chip:has(input:checked){border-color:var(--fach);background:color-mix(in srgb,var(--fach) 12%,transparent)}
.chip input{accent-color:var(--fach);margin:0}
/* Hefteintrag */
.papier{background:var(--paper);border-radius:4px;box-shadow:var(--shadow);padding:22px 20px 26px 44px;position:relative;line-height:32px;
  background-image:linear-gradient(var(--paper-line) 1px,transparent 1px);background-size:100% 32px;background-position:0 21px}
.papier::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--paper-margin)}
.papier.karo{background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:16px 16px;background-position:0 0}
.papier h2{color:var(--fach);line-height:32px}
.papier h3{line-height:32px;margin-top:8px}
.papier ul{margin:0;padding-left:22px}
.papier .merk{border:2px solid var(--fach);border-radius:8px;padding:0 12px;background:color-mix(in srgb,var(--paper) 85%,var(--fach));margin:8px 0;line-height:32px}
.papier table{border-collapse:collapse;margin:6px 0;font-size:.95rem;line-height:1.4}
.papier td,.papier th{border:1px solid var(--paper-line);padding:4px 8px;text-align:left;background:var(--paper)}
.tabwrap{overflow-x:auto}
/* Bruch */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 3px;font-variant-numeric:tabular-nums;font-weight:800}
.frac>span:first-child{border-bottom:2px solid currentColor}
.frac>span{padding:0 3px}
/* Quiz */
.quizkopf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.karte{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:18px;border-top:8px solid var(--fach)}
.karte .fachzeile{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--fach)}
.frage{font-size:1.3rem;font-weight:700;line-height:1.55}
.frage .lueck{display:inline-block;min-width:60px;border-bottom:3px solid var(--fach)}
.optionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;font-size:1.05rem;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--fach)}
.opt.richtig{border-color:var(--ok);background:var(--ok-bg)}
.opt.falsch{border-color:var(--bad);background:var(--bad-bg)}
.eingabe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eingabe input{font:inherit;font-size:1.3rem;font-weight:800;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);flex:1 1 180px;min-width:0}
.eingabe .einheit{font-weight:800;font-size:1.2rem}
.tipp{font-size:.88rem;color:var(--muted)}
.antwortkarte{background:var(--bg);border-radius:12px;padding:14px;border-left:6px solid var(--fach);font-weight:600}
.rueck{border-radius:12px;padding:12px 14px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.rueck.ok{background:var(--ok-bg);border-left:6px solid var(--ok)}
.rueck.no{background:var(--bad-bg);border-left:6px solid var(--bad)}
.rueck strong{font-family:var(--f-display);font-size:1.15rem}
/* Ergebnis */
.ergebnis{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;border-top:8px solid var(--fach)}
.note{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--fach)}
.notenblock{display:flex;flex-direction:column;align-items:center;min-width:120px;padding:10px 16px;border-radius:18px;background:color-mix(in srgb,var(--nf) 16%,var(--surface));border:3px solid var(--nf)}
.notenblock .note{font-size:4rem;color:var(--nf)}
.nb-label{font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem}
.nb-wort{font-weight:800;font-size:.95rem}
.n1,.n2{--nf:var(--ok)}.n3,.n4{--nf:#d48a00}.n5,.n6{--nf:var(--bad)}
.schluessel{width:100%;display:flex;flex-direction:column;gap:6px}
.schluessel table{border-collapse:collapse;width:100%;max-width:420px;font-variant-numeric:tabular-nums}
.schluessel th,.schluessel td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line)}
.schluessel tr.treffer{background:color-mix(in srgb,var(--rose) 18%,transparent);font-weight:800}
.liste{display:flex;flex-direction:column;gap:10px;width:100%}
.liste .eintrag{border-left:5px solid var(--bad);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.liste .eintrag.ok{border-left-color:var(--ok)}
/* Bilder */
.bild{display:flex;justify-content:center;align-items:center;min-height:110px;background:var(--bg);border-radius:14px;padding:10px;margin-top:10px}
.bild svg{max-width:100%;height:auto}
.bild2{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.bild2 figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 180px;min-width:0}
.bild2 figcaption{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--fach)}
.emo{font-size:3.6rem;line-height:1.1;letter-spacing:4px}
.mini{display:inline-flex;width:64px;justify-content:center;vertical-align:middle}
.mini .emo{font-size:1.15rem;letter-spacing:0;white-space:nowrap}
.vokabeln .satz{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.mini svg{width:64px;height:auto}
.vokabeln td{vertical-align:middle}
/* Zuordnen */
.paare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paare .spalte{display:flex;flex-direction:column;gap:8px;min-width:0}
.pk{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:700;text-align:left;min-height:48px;overflow-wrap:anywhere}
.pk.sel{border-color:var(--fach);background:color-mix(in srgb,var(--fach) 18%,transparent)}
.pk.done{border-color:var(--ok);background:var(--ok-bg);opacity:.7}
.pk.err{border-color:var(--bad);background:var(--bad-bg)}
/* Satzbau */
.bau{min-height:60px;border:2px dashed var(--fach);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bau:empty::before{content:"Tippe die Wörter in der richtigen Reihenfolge an";color:var(--muted);font-size:.9rem;padding:4px}
.woerter{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:800;font-size:1.05rem}
.bau .wchip{border-color:var(--fach)}
/* Lernplan & Probenplan */
.lernplan{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;border:3px solid var(--fach)}
.lp-kopf{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.lp-kopf>div:first-child{min-width:0}
.eyebrow{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--fach)}
.lp-tage{display:flex;flex-direction:column;align-items:center;background:var(--fach);color:#fff;border-radius:14px;padding:8px 14px;min-width:84px}
.lp-tage .gross{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.lp-tage span:last-child{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.lp-hinweis{font-weight:700}
.lp-gruppen{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.lp-spalte{background:var(--bg);border-radius:12px;padding:12px;border-top:5px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.lp-spalte h3{font-size:1rem}
.lp-spalte ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lp-spalte li{display:flex;flex-direction:column;font-size:.92rem}
.lp-spalte li span{color:var(--muted);font-size:.82rem}
.lp-schwer{border-top-color:var(--bad)}.lp-gut{border-top-color:var(--ok)}.lp-neu{border-top-color:var(--fach)}.lp-mittel{border-top-color:var(--star)}
.lp-fehler{background:var(--bad-bg);border-radius:12px;padding:12px}
.lp-fehler h3{font-size:1rem}
.lp-fehler ul{margin:6px 0 0;padding-left:18px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.probenplan{display:flex;flex-direction:column;gap:8px}
.pp-zeile{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);border-left:6px solid var(--fach)}
.pp-zeile.vorbei{opacity:.75}
.pp-datum{display:flex;flex-direction:column;align-items:center;min-width:3.2em;font-variant-numeric:tabular-nums;line-height:1.2}
.pp-datum b{font-family:var(--f-display);font-size:1.1rem;color:var(--fach)}
.pp-datum span{font-size:.85rem;color:var(--muted)}
.pp-text{flex:1;min-width:0;font-size:.95rem}
.pp-warn{color:var(--bad);font-weight:700;font-size:.88rem}
.pp-tage{font-weight:800;font-size:.9rem;text-align:right;white-space:nowrap}
.pp-tage.knapp{color:var(--bad)}
/* Lernhilfe (Eule Ella) */
.tutor-bg{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tutor{background:var(--surface);color:var(--fg);border-radius:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.3);border-top:6px solid var(--fach);animation:hoch .3s ease-out}
@keyframes hoch{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.tutor-kopf{display:flex;gap:12px;align-items:center}
.tutor-ava{font-size:2.4rem;line-height:1;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--fach) 18%,var(--surface))}
.tutor-text ol{margin:6px 0 0;padding-left:22px}
.tutor .bild2 figure{margin:0;display:flex;flex-direction:column;align-items:center;font-weight:800}
/* Rechenweg */
.weg{display:flex;flex-direction:column;gap:10px}
.wegzeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700;background:var(--bg);border-radius:12px;padding:8px 12px}
.wegzeile span{flex:1 1 200px;min-width:0}
.wegzeile input{font:inherit;font-size:1.2rem;font-weight:800;width:110px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.wegzeile input.ok{border-color:var(--ok);background:var(--ok-bg)}.wegzeile input.no{border-color:var(--bad);background:var(--bad-bg)}
.lehrer{background:var(--bg);border-radius:12px;padding:12px 14px;border-left:6px solid var(--fach);font-family:"Segoe Print","Comic Sans MS",var(--f-body)}
.punkte{align-self:flex-end;font-weight:800;color:var(--fach)}
/* Wochenend-Plan */
.wplan{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;border:2px solid color-mix(in srgb,var(--rose) 55%,transparent);--fach:var(--ok)}
.wtag{display:flex;flex-direction:column;gap:8px}
.wtag.heute-tag h3{color:var(--ok)}
.waufg{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;border-left:6px solid var(--fach)}
.waufg .t{flex:1;min-width:0;display:flex;flex-direction:column}
.waufg .t span{font-size:.85rem}
.haken{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--fach);display:grid;place-items:center;font-weight:800;flex:none;color:#fff}
.waufg.erledigt .haken{background:var(--ok);border-color:var(--ok)}
.waufg.erledigt b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.7}

.seitenkopf{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
/* Notizblock */
.nform{display:flex;gap:8px;flex-wrap:wrap}

  U2.forEach(w=>k.push(hoer(text(`Setze ein:<br>${w.satz.replace("___",L)}<div class="tipp">(${w.de})</div>`,[w.form],`${w.satz.replace("___","<b>"+w.form+"</b>")}${w.warum?"<br>"+w.warum:""}`),w.satz.replace("___",w.form))));

function balkenSVG(z,n){const w=Math.min(320,n*40),h=44,st=w/n;let r="";for(let i=0;i<n;i++)r+=`<rect x="${i*st+1}" y="1" width="${st-2}" height="${h-2}" rx="4" fill="${i<z?"var(--fach)":"var(--surface)"}" stroke="var(--fg)" stroke-width="1.5"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Streifen">${r}</svg>`}
function kreisSVG(z,n,gr=120){const r=gr/2-4,c=gr/2;let t="";for(let i=0;i<n;i++){const a1=-Math.PI/2+i*2*Math.PI/n,a2=a1+2*Math.PI/n;
  t+=`<path d="M${c} ${c} L${c+r*Math.cos(a1)} ${c+r*Math.sin(a1)} A${r} ${r} 0 0 1 ${c+r*Math.cos(a2)} ${c+r*Math.sin(a2)} Z" fill="${i<z?"var(--fach)":"var(--surface)"}" stroke="var(--fg)" stroke-width="1.5"/>`}
  return `<svg viewBox="0 0 ${gr} ${gr}" width="${gr}" height="${gr}" role="img" aria-label="Kreis">${t}</svg>`}
function strahlSVG(z,n){const w=300,x0=20,e=(w-40)/2,step=e/n;let t=`<line x1="${x0}" y1="50" x2="${w-6}" y2="50" stroke="var(--fg)" stroke-width="2"/><path d="M${w-12} 44 L${w-4} 50 L${w-12} 56" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
  for(let i=0;i<=2*n;i++){const x=x0+i*step,gross=i%n===0;t+=`<line x1="${x}" y1="${gross?40:44}" x2="${x}" y2="${gross?60:56}" stroke="var(--fg)" stroke-width="${gross?2.5:1.5}"/>`;if(gross)t+=`<text x="${x}" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="var(--fg)">${i/n}</text>`}
  const xp=x0+z*step;t+=`<path d="M${xp} 34 L${xp} 14 M${xp-6} 26 L${xp} 34 L${xp+6} 26" stroke="var(--bad)" stroke-width="3" fill="none"/>`;
  return `<svg viewBox="0 0 ${w} 86" width="${w}" height="86" role="img" aria-label="Zahlenstrahl">${t}</svg>`}
function feldSVG(){let t="";for(let r=0;r<6;r++)for(let c=0;c<10;c++){const f=r===0?"#d64545":(r<=3&&c<2)?"#2e9e5b":(r<=3&&c<6)?"#2f6fd6":"var(--surface)";t+=`<rect x="${4+c*24}" y="${4+r*20}" width="24" height="20" fill="${f}" stroke="var(--fg)" stroke-width="1"/>`}
  return `<svg viewBox="0 0 248 128" width="248" height="128" role="img" aria-label="Erdbeerfeld">${t}</svg>`}

{id:"d-tornado",fach:"deutsch",titel:"Sachtext: Tornados",quelle:"Heft 14.10. / 16.10.",probe:null,
 merke:`<h2>Tornados 🌪️</h2>
 <h3>Was ist ein Tornado?</h3><p>Ein Tornado ist ein großer <b>Wirbelsturm</b>. Man nennt ihn auch <b>„Windhose“</b>.</p>
 <h3>Wo gibt es Tornados?</h3><p>Auf dem <b>Festland</b>, am häufigsten im <b>Landesinneren der USA</b> (Texas, Oklahoma, Kansas, Nebraska – die <b>Tornado-Allee</b>): jährlich etwa <b>1 200</b> Tornados. Es gibt sie auch in <b>Deutschland</b>, aber sie sind nicht so groß.</p>
 <h3>Wie entstehen Tornados?</h3><p>Unter einer großen <b>Gewitterwolke</b> steigt <b>Warmluft spiralförmig</b> nach oben. Die Drehbewegungen werden immer schneller – wie bei der <b>Pirouette eines Eiskunstläufers</b>. An der Unterseite der Wolke wird durch <b>Wasserdampf</b> ein Schlauch sichtbar, der zur Erde führt. Es entsteht ein <b>Sog</b>.</p>
 <h3>Wie gefährlich sind Tornados?</h3><p>Berührt der Luftschlauch den Boden, reißt er alles in die Höhe, was ihm in den Weg kommt. Schwächt sich der Tornado ab, stürzt alles wieder zu Boden.</p>
 <h3>Wichtige Begriffe</h3>
 <ul><li><b>Tornado-Allee:</b> Gebiet in den USA mit besonders vielen Tornados</li><li><b>Festland:</b> Land (nicht Meer)</li><li><b>500 Stundenkilometer:</b> so schnell kann der Wind in einem Tornado werden</li><li><b>Fujita-Skala (F0, F1 …):</b> damit teilt man die Stärke von Tornados ein – je höher die Zahl, desto stärker</li></ul>`,
 karten:[
  karte("Was ist ein Tornado?","Ein großer <b>Wirbelsturm</b>. Man nennt ihn auch <b>„Windhose“</b>."),
  mc("Wie nennt man einen Tornado noch?","Windhose",["Windjacke","Sturmflut","Hagelsturm"],"Tornado = Windhose"),
  mc("Wo gibt es die meisten Tornados?","im Landesinneren der USA",["auf dem Meer","in Deutschland","am Nordpol"],"z. B. Texas, Oklahoma, Kansas, Nebraska"),
  zahl("Wie viele Tornados gibt es dort ungefähr jedes Jahr?",1200,"etwa 1 200 Tornados im Jahr"),
  mc("Gibt es Tornados auch in Deutschland?","Ja, aber sie sind nicht so groß.",["Nein, nie.","Ja, und sie sind größer als in den USA."],"Auch in Deutschland gibt es Tornados, aber kleinere."),
  mc("Wo entstehen Tornados?","über dem Festland",["über dem Meer","im Weltall","unter der Erde"],"Tornados entstehen über dem Festland."),
  mc("Unter was entstehen Tornados?","unter einer großen Gewitterwolke",["unter einer Brücke","unter dem Meer","unter einem Regenbogen"],"unter einer großen Gewitterwolke"),
  mc("Was steigt beim Entstehen spiralförmig nach oben?","Warmluft",["Kaltluft","Wasser","Sand"],"Warmluft steigt spiralförmig nach oben."),
  mc("Womit vergleicht der Text die schneller werdenden Drehbewegungen?","mit der Pirouette eines Eiskunstläufers",["mit einem Karussell","mit einem Ventilator","mit einem fallenden Blatt"],"wie bei der Pirouette eines Eiskunstläufers"),
  mc("Wodurch wird der Schlauch an der Wolke sichtbar?","durch Wasserdampf",["durch Rauch","durch Staub","durch Licht"],"Durch Wasserdampf wird der Schlauch sichtbar."),
  mc("Was passiert, wenn der Luftschlauch den Boden berührt?","Er reißt alles in die Höhe, was ihm in den Weg kommt.",["Er verschwindet sofort.","Es fängt an zu schneien.","Er wird ganz langsam."],"Er reißt alles in die Höhe."),
  mc("Was passiert, wenn sich der Tornado abschwächt?","Alles stürzt wieder zu Boden.",["Alles bleibt in der Luft.","Er wird stärker.","Es entsteht ein neuer Tornado."],"Alles stürzt wieder zu Boden."),
  mc("Was ist die Tornado-Allee?","ein Gebiet in den USA mit besonders vielen Tornados",["eine Straße mit Bäumen","ein Tornado-Museum","ein langer Weg"],"Hier ist „Allee“ der Name für das Gebiet mit vielen Tornados."),
  mc("Was bedeutet „Festland“?","Land, nicht Meer",["viele Dörfer","eine Insel","ein Fest im Freien"],"Festland = das Land (im Gegensatz zum Meer)"),
  mc("Was ist die Fujita-Skala?","eine Einteilung der Stärke von Tornados",["eine Tonleiter","ein Thermometer","ein Land in Asien"],"Je höher die F-Zahl, desto stärker der Tornado."),
  zahl("Wie viele Stundenkilometer werden im Text genannt?",500,"500 Stundenkilometer – so schnell kann der Wind werden.","km/h"),
  karte("Erkläre in eigenen Worten, wie ein Tornado entsteht.","Unter einer großen Gewitterwolke steigt Warmluft spiralförmig nach oben. Die Drehung wird immer schneller. Durch Wasserdampf wird ein Schlauch sichtbar, der zum Boden reicht. Es entsteht ein Sog."),
 ]},

{id:"e-past-aussagen",fach:"englisch",titel:"Simple past: Aussagen",quelle:"Heft 28.09.",probe:null,
 merke:`<h2>Die einfache Vergangenheit – simple past</h2><h3>Aussagen</h3>
 <p>Um über Dinge zu sprechen, die in der Vergangenheit passiert und vorbei sind, verwendest du das <b>simple past</b>.</p>
 <div class="merk">Bei den meisten Verben hängst du <b>-ed</b> an: play → play<b>ed</b>, visit → visit<b>ed</b></div>
 <p>I played cricket yesterday. – Ich spielte gestern Kricket.<br>Jay visited his uncle last week. – Jay besuchte letzte Woche seinen Onkel.</p>
 <p>Im Deutschen gibt es zwei Möglichkeiten: He played football. = Er <b>spielte</b> Fußball. / Er <b>hat</b> Fußball <b>gespielt</b>.</p>
 <h3>Achtung Schreibweise</h3><p>worry → worr<b>ied</b>, tidy → tid<b>ied</b> (y wird zu ie) · love → love<b>d</b> (nur -d)</p>
 <h3>Unregelmäßige Verben</h3>
 <div class="tabwrap"><table><tr><td>go</td><td><b>went</b></td><td>buy</td><td><b>bought</b></td></tr><tr><td>do</td><td><b>did</b></td><td>take</td><td><b>took</b></td></tr><tr><td>have</td><td><b>had</b></td><td></td><td></td></tr></table></div>
 <h3>be: was / were</h3>
 <div class="tabwrap"><table><tr><th>Langform</th><th>verneint</th><th>Kurzform</th></tr>
 ${[["I","was"],["you","were"],["he","was"],["she","was"],["it","was"],["we","were"],["you","were"],["they","were"]].map(([p,v])=>`<tr><td>${p} ${v}</td><td>${p} ${v} not</td><td>${p} ${v}n't</td></tr>`).join("")}</table></div>
 <p>Signalwörter: <b>yesterday, last week, last Saturday, ago</b></p>`,
 karten:[
  karte("Wann verwendest du das simple past?","Für Dinge, die in der <b>Vergangenheit</b> passiert und <b>vorbei</b> sind. Signalwörter: yesterday, last week …"),
  karte("Wie bildest du das simple past bei den meisten Verben?","Du hängst <b>-ed</b> an das Verb: play → played, visit → visited"),
  ...[["I ___ cricket yesterday.","play","played"],["Jay ___ his uncle last week.","visit","visited"],["She ___ about the test.","worry","worried","y wird zu ie: worried"],
   ["We ___ a film yesterday.","watch","watched"],["Luke ___ his bedroom last Saturday.","tidy","tidied","y wird zu ie: tidied"],["My dad ___ the car yesterday.","clean","cleaned"],
   ["I ___ the living room last week.","hoover","hoovered"],["Holly ___ the dishwasher after school.","empty","emptied","y wird zu ie: emptied"],["Mum ___ dinner for us yesterday.","cook","cooked"],
   ["They ___ the film.","love","loved","Endet schon auf e → nur -d: loved"],
   ["Yesterday we ___ to the park.","go","went","unregelmäßig: go → went"],["I ___ a new pen last week.","buy","bought","unregelmäßig: buy → bought"],
   ["She ___ her homework yesterday.","do","did","unregelmäßig: do → did"],["He ___ out the rubbish yesterday.","take","took","unregelmäßig: take → took"],
   ["We ___ a party last Saturday.","have","had","unregelmäßig: have → had"]]
   .map(([s,v,r,e])=>text(`${s.replace("___",L)} <span class="muted">(${v})</span>`,[r],e||`${v} + ed → ${r}`,"Setze das Verb ins simple past")),
  mc("go → simple past?","went",["goed","gone","wented"],"go → went"),mc("buy → simple past?","bought",["buyed","brought","buied"],"buy → bought (nicht brought, das kommt von bring!)"),
  mc("take → simple past?","took",["taked","tooked","taken"],"take → took"),mc("have → simple past?","had",["haved","has","hadded"],"have → had"),mc("do → simple past?","did",["doed","done","dids"],"do → did"),
  paare("Ordne zu: unregelmäßige Verben",[["go","went"],["buy","bought"],["do","did"],["take","took"],["have","had"]]),
  ...[["I ___ at home yesterday.","was","I → was"],["You ___ late.","were","you → were"],["Holly ___ in the park.","was","Holly = she → was"],["We ___ tired.","were","we → were"],
   ["They ___ at school.","were","they → were"],["It ___ cold yesterday.","was","it → was"]].map(([s,r,e])=>mc(s.replace("___",L),r,[r==="was"?"were":"was"],e)),
  karte("Welche Formen hat <b>be</b> in der Vergangenheit?","<b>was</b>: I, he, she, it<br><b>were</b>: you, we, they<br>verneint: wasn't, weren't"),
  ...[["she was not","she wasn't"],["they were not","they weren't"],["I was not","I wasn't"],["you were not","you weren't"]].map(([l,k])=>text(`Wie heißt die <b>Kurzform</b> von „${l}“?`,[k],`${l} = ${k}`,"mit Apostroph: '")),
  mc("He played football. – Wie kann man das übersetzen?","beide: „Er spielte Fußball.“ und „Er hat Fußball gespielt.“",["nur „Er spielt Fußball.“","nur „Er wird Fußball spielen.“"],"Im Deutschen gibt es zwei Möglichkeiten, Vergangenes auszudrücken."),
 ]},
{id:"e-past-fragen",fach:"englisch",titel:"Simple past: Verneinung, Fragen & Kurzantworten",quelle:"Heft 06.10.",probe:null,
 merke:`<h2>Simple past: Verneinung, Fragen und Kurzantwort</h2>
 <h3>Verneinung</h3>
 <p>Um zu sagen, was in der Vergangenheit <b>nicht</b> passiert ist, setzt du <b>didn't</b> (= did not) vor das Verb.</p>
 <div class="merk">didn't + Grundform: Olivia didn't <b>win</b> (nicht: won!)</div>
 <p>Olivia didn't win the game. – Olivia hat das Spiel nicht gewonnen.<br>They didn't buy a new book. – Sie haben kein neues Buch gekauft.</p>
 <p>Verneinungen mit be bildest du mit <b>wasn't</b> und <b>weren't</b>:<br>Holly wasn't at school. – Holly war nicht in der Schule.<br>We weren't late. – Wir sind nicht zu spät gekommen.</p>
 <h3>Ja/Nein-Fragen</h3>
 <div class="merk"><b>Did</b> steht am Satzanfang – <b>außer bei be</b> (Was …? Were …?)</div>
 <p>Did you lose your pen? – Hast du deinen Stift verloren?<br>Did Olivia ask Gwen? – Hat Olivia Gwen gefragt?<br>Did Luke play football? – Hat Luke Fußball gespielt?<br>Did they have a party? – Haben sie eine Party gefeiert?</p>
 <h3>Kurzantworten</h3><p>Yes, I did. / No, I didn't. &nbsp;·&nbsp; Yes, she was. / No, she wasn't.</p>
 <h3>Fragen mit Fragewort</h3><p>Das Fragewort steht am <b>Satzanfang</b>.<br>What did you do with the scarf? – Was hast du mit dem Schal gemacht?<br>When were they in the classroom? – Wann waren sie im Klassenzimmer?</p>`,
 karten:[
  karte("Wie sagst du, dass etwas in der Vergangenheit <b>nicht</b> passiert ist?","Du setzt <b>didn't</b> (= did not) vor das Verb. Das Verb steht in der Grundform: Olivia didn't <b>win</b> the game."),
  mc(`Olivia ${L} the game. <span class="muted">(hat nicht gewonnen)</span>`,"didn't win",["didn't won","wasn't win","not won"],"didn't + Grundform: didn't win"),
  mc(`They ${L} a new book. <span class="muted">(haben nicht gekauft)</span>`,"didn't buy",["didn't bought","weren't buy","don't buy"],"didn't + Grundform: didn't buy"),
  mc(`Holly ${L} at school. <span class="muted">(war nicht)</span>`,"wasn't",["weren't","didn't","isn't"],"Holly = she → wasn't"),
  mc(`We ${L} late. <span class="muted">(waren nicht)</span>`,"weren't",["wasn't","didn't","aren't"],"we → weren't"),
  ...[["Olivia hat das Spiel nicht gewonnen.","Olivia didn't win the game."],["Sie haben kein neues Buch gekauft.","They didn't buy a new book."],["Holly war nicht in der Schule.","Holly wasn't at school."],
   ["Wir sind nicht zu spät gekommen.","We weren't late."],["Hast du deinen Stift verloren?","Did you lose your pen?"],["Hat Olivia Gwen gefragt?","Did Olivia ask Gwen?"],
   ["Hat Luke Fußball gespielt?","Did Luke play football?"],["Haben sie eine Party gefeiert?","Did they have a party?"],["Was hast du mit dem Schal gemacht?","What did you do with the scarf?"],
   ["Wann waren sie im Klassenzimmer?","When were they in the classroom?"]].map(([de,en])=>satz(`Bau den englischen Satz:<br>„${de}“`,en)),
  karte("Wie stellst du im simple past eine Ja/Nein-Frage?","<b>Did</b> kommt an den Satzanfang, das Verb steht in der Grundform: <b>Did</b> Luke <b>play</b> football?<br>Außer bei be: <b>Was</b> Holly at school? <b>Were</b> they late?"),
  mc(`${L} Luke play football?`,"Did",["Was","Does"],"Frage im simple past → Did"),
  mc(`${L} Holly at school yesterday?`,"Was",["Did","Were"],"Bei be gibt es keine did-Frage: Holly → Was"),
  mc(`${L} they in the classroom?`,"Were",["Did","Was"],"Bei be: they → Were"),
  mc(`${L} you lose your pen?`,"Did",["Were","Was"],"lose ist kein be → Did"),
  mc("Welche Frage ist richtig?","Did Luke play football?",["Did Luke played football?","Played Luke football?","Does Luke played football?"],"Nach did kommt die Grundform: play"),
  mc("Did you lose your pen? – Yes, …","I did.",["I lost.","I was.","I do."],"Kurzantwort mit did: Yes, I did."),
  mc("Did Olivia ask Gwen? – No, …","she didn't.",["she wasn't.","she doesn't.","she didn't ask."],"Kurzantwort: No, she didn't."),
  mc("Was Holly at school? – No, …","she wasn't.",["she didn't.","she weren't.","she isn't."],"Frage mit was → Antwort mit wasn't"),
  mc("Were they late? – Yes, …","they were.",["they did.","they was.","they are."],"Frage mit were → Antwort mit were"),
  karte("Wo steht das Fragewort bei Fragen im simple past?","Am <b>Satzanfang</b>: <b>What</b> did you do with the scarf? <b>When</b> were they in the classroom?"),
  mc(`${L} did you do with the scarf? <span class="muted">(Was …?)</span>`,"What",["When","Where","Who"],"Was = What"),
  mc(`${L} were they in the classroom? <span class="muted">(Wann …?)</span>`,"When",["What","Where","Why"],"Wann = When"),
 ]},

{id:"e-haeufigkeit",fach:"englisch",titel:"Häufigkeitsadverbien",quelle:"Heft 11.11. / Buch S. 142",probe:null,
 merke:`<h2>Häufigkeitsadverbien</h2>
 <p>Wenn du ausdrücken willst, wie <b>häufig</b> etwas passiert, verwendest du <b>never, sometimes, often, usually</b> und <b>always</b>.</p>
 <div class="tabwrap"><table class="vokabeln">${HAEUFIG.map(([en,de,n])=>`<tr><td><span class="mini">${oftSVG(n)}</span></td><td><b>${en}</b></td><td>${de}</td></tr>`).join("")}</table></div>
 <div class="merk">Diese Wörter stehen <b>vor dem Verb</b>:<br>I <b>always</b> load · Holly <b>sometimes</b> load<b>s</b> · Amber <b>often</b> load<b>s</b> · They <b>never</b> load the dishwasher.</div>
 <div class="merk">Bei <b>am, is, are</b> (Formen von <b>be</b>) stehen sie <b>nach</b> dem Verb:<br>I am <b>usually</b> tired after sports. · The Richardsons are <b>often</b> happy at home.</div>
 <p class="muted">Vergiss nicht: he/she/it → <b>s</b> am Verb: Holly usually make<b>s</b> her bed. Jay always hoover<b>s</b> the living room.</p>`,
 karten:[
  karte("Wo stehen Häufigkeitsadverbien (always, often …) im Satz?","<b>Vor dem Verb</b>: Holly <b>often</b> loads the dishwasher.<br>Aber bei <b>am / is / are</b>: <b>nach</b> dem Verb: I am <b>usually</b> tired."),
  paare("Ordne zu",HAEUFIG.map(([en,de])=>[en,de])),
  ...HAEUFIG.map(([en,de,n],i)=>mc(`Welches Wort passt zum Bild?<div class="bild">${oftSVG(n)}</div>`,en,HAEUFIG.filter(h=>h[0]!==en).map(h=>h[0]).slice(i%2,i%2+3),`${en} = ${de}`)),
  ...[["Holly ___ her bed in the morning. (usually / make)","usually makes"],["Jay ___ the living room. (always / hoover)","always hoovers"],["Olivia ___ the rubbish. (sometimes / take out)","sometimes takes out"],
   ["Amber ___ the dishwasher. (often / load)","often loads"],["Luke ___ the living room. (never / tidy)","never tidies"],["Holly ___ her guinea pigs chocolate. (never / feed)","never feeds"],
   ["Amber ___ her friend on Saturdays. (often / visit)","often visits"],["They ___ the dishwasher. (never / empty)","never empty"]]
   .map(([s,r])=>text(s.replace("___",L),[r],r.split(" ")[0]==="never"&&s.startsWith("They")?`They → kein s: <b>${r}</b>`:`Adverb vor das Verb, he/she → s: <b>${r}</b>`,"z. B. often loads")),
  ...[["Mr Richardson ___ happy. (usually)","is usually",["usually is","usually be"]],["Gwen ___ worried about her friend. (never)","is never",["never is","never be"]],
   ["The students ___ very funny. (sometimes)","are sometimes",["sometimes are","sometimes be"]],["I ___ tired after sports. (usually)","am usually",["usually am","usually be"]]]
   .map(([s,r,f])=>mc(s.replace("___",L),r,f,`Bei am/is/are steht das Adverb <b>nach</b> dem Verb: ${r}`)),
  mc("Welcher Satz ist richtig?","Holly usually makes her bed in the morning.",["Holly usually make her bed in the morning.","Holly makes usually her bed in the morning.","Usually Holly make her bed in the morning."],"Adverb vor das Verb – und Holly = she → makes"),
  mc("Welcher Satz ist richtig?","Mr Richardson is usually happy.",["Mr Richardson usually be happy.","Mr Richardson usually is happy.","Mr Richardson is happy usually."],"Bei is steht usually danach."),
  satz("Bau den Satz:","Dave always hoovers the living room on Saturdays."),
  satz("Bau den Satz:","The Richardsons are often happy at home."),
  satz("Bau den Satz:","Luke never tidies the living room."),
  mc("„Amber often loads the dishwasher.“ – Was heißt das?","Amber räumt oft die Spülmaschine ein.",["Amber räumt oft die Spülmaschine aus.","Amber räumt nie die Spülmaschine ein.","Amber hat die Spülmaschine eingeräumt."],"load = einräumen · empty = ausräumen"),
  mc("„Dave sometimes takes out the rubbish.“ – Was heißt das?","Dave bringt manchmal den Müll raus.",["Dave bringt immer den Müll raus.","Dave bringt nie den Müll raus.","Dave hat den Müll rausgebracht."],"sometimes = manchmal"),
 ]},

{id:"nt-reibung",fach:"nt",titel:"Reibungskräfte",quelle:"Arbeitsblatt 12.11.",probe:null,
 merke:`<h2>Reibungskräfte</h2>
 <div class="merk"><b>Merke:</b><br>• Bei der Bewegung von Körpern entstehen <b>Reibungskräfte</b>.<br>• Je <b>rauer</b> der Untergrund ist und je <b>größer</b> die Gewichtskraft, desto <b>größer</b> ist die Reibungskraft.</div>
 <h3>1. Oberflächenbeschaffenheit</h3>
 <div class="bild bild2"><figure><figcaption>glatt</figcaption>${reibSVG("glatt")}</figure><figure><figcaption>rau</figcaption>${reibSVG("rau")}</figure></div>
 <p>Die Reibung ist von der <b>Oberflächenbeschaffenheit</b> abhängig. Je <b>rauer</b> die Oberfläche, desto <b>größer</b> ist die Reibungskraft.</p>
 <h3>2. Anpresskraft</h3>
 <div class="bild bild2"><figure><figcaption>leicht</figcaption>${reibSVG("glatt")}</figure><figure><figcaption>mit Gewicht</figcaption>${reibSVG("gewicht")}</figure></div>
 <p>Die Reibung ist von der <b>Anpresskraft</b> abhängig. Je <b>größer</b> die Anpresskraft, desto <b>größer</b> ist die Reibungskraft.</p>
 <p class="muted">Achtung Schreibweise: An<b>press</b>kraft – von „anpressen“ (der Klotz wird auf den Boden gedrückt).</p>
 <h3>3. Rollen</h3>
 <div class="bild bild2"><figure><figcaption>ohne Rollen</figcaption>${reibSVG("glatt")}</figure><figure><figcaption>mit Rollen</figcaption>${reibSVG("rollen")}</figure></div>
 <p>Verwendet man <b>Rollen</b>, ist die Reibung besonders <b>klein</b>.</p>
 <h3>4. Der schwere Schrank</h3>
 <div class="bild bild2"><figure>${schrankSVG(false)}</figure><figure>${schrankSVG(true)}</figure></div>
 <p>Um die <b>Reibung</b> zu verringern, kann man ein Gestell mit <b>Rollen</b> unter den Schrank legen. Die <b>Rollreibung</b> ist nämlich besonders klein.</p>
 <p class="muted">Der rote Balken am Kraftmesser zeigt: So viel Kraft braucht man zum Ziehen.</p>`,
 karten:[
  karte("Wann entstehen Reibungskräfte?","Bei der <b>Bewegung von Körpern</b> entstehen Reibungskräfte."),
  karte("Sag den Merksatz auf: Je rauer der Untergrund ist und …","… je größer die <b>Gewichtskraft</b>, desto <b>größer</b> ist die <b>Reibungskraft</b>."),
  karte("Von welchen Dingen hängt die Reibungskraft ab? (Arbeitsblatt Nr. 1)","1. von der <b>Oberflächenbeschaffenheit</b> (rau oder glatt)<br>2. von der <b>Anpresskraft</b> (wie schwer der Körper ist)<br>3. ob man <b>Rollen</b> verwendet (dann ist sie besonders klein)"),
  text(`Die Reibung ist von der ${L} abhängig.${zweiBilder(reibSVG("glatt"),reibSVG("rau"))}`,["Oberflächenbeschaffenheit"],"Glatter oder rauer Boden → die <b>Oberflächenbeschaffenheit</b> ist anders.","Ein langes Wort mit „Oberfläche…“"),
  mc(`Je ${L} die Oberfläche, desto größer ist die Reibungskraft.`,"rauer",["glatter","kleiner","nasser"],"Je rauer die Oberfläche, desto größer die Reibungskraft."),
  mc(`Je rauer die Oberfläche, desto ${L} ist die Reibungskraft.`,"größer",["kleiner","gleich groß"],"Rau = mehr Reibung."),
  text(`Die Reibung ist von der ${L} abhängig.${zweiBilder(reibSVG("glatt"),reibSVG("gewicht"))}`,["Anpresskraft"],"Mit Gewicht wird der Klotz stärker auf den Boden gedrückt: <b>Anpresskraft</b> (von anpressen – nicht „Anpasskraft“).","Mit dem Gewicht wird der Klotz auf den Boden ge…"),
  mc(`Je größer die Anpresskraft, desto ${L} ist die Reibungskraft.`,"größer",["kleiner","gleich groß"],"Mehr Gewicht = mehr Reibung."),
  mc("Wie schreibt man das Wort richtig?","Anpresskraft",["Anpasskraft","Anpreskraft","Anbresskraft"],"An<b>press</b>kraft kommt von „anpressen“ – der Klotz wird an den Boden gepresst."),
  text(`Verwendet man ${L}, ist die Reibung besonders klein.${bild("reib_rollen")}`,["Rollen","Räder"],"Mit <b>Rollen</b> ist die Reibung besonders klein."),
  mc(`Verwendet man Rollen, ist die Reibung besonders ${L}.`,"klein",["groß","rau"],"Rollen machen die Reibung besonders klein."),
  text("Wie heißt die Reibung bei Rollen und Rädern?",["Rollreibung"],"Das ist die <b>Rollreibung</b>. Sie ist besonders klein."),
  mc(`Wie könnte man dem Mann helfen, den schweren Schrank zu verschieben?${bild("schrank")}`,"ein Gestell mit Rollen unter den Schrank legen",["noch ein Gewicht auf den Schrank stellen","den Schrank über einen rauen Teppich schieben","den Schrank mit Kleidung füllen"],"Um die Reibung zu verringern, legt man ein Gestell mit Rollen unter den Schrank. Die Rollreibung ist nämlich besonders klein."),
  text(`Um die ${L} zu verringern, kann man ein Gestell mit Rollen unter den Schrank legen.`,["Reibung","Reibungskraft"],"Um die <b>Reibung</b> zu verringern …"),
  mc(`Bei welchem Bild braucht man <b>mehr</b> Kraft zum Ziehen?${zweiBilder(reibSVG("glatt"),reibSVG("rau"))}`,"B",["A"],"B: Der Untergrund ist rau → größere Reibungskraft."),
  mc(`Bei welchem Bild braucht man <b>mehr</b> Kraft zum Ziehen?${zweiBilder(reibSVG("gewicht"),reibSVG("glatt"))}`,"A",["B"],"A: Das Gewicht drückt den Klotz stärker an → größere Anpresskraft → größere Reibung."),
  mc(`Bei welchem Bild braucht man <b>weniger</b> Kraft zum Ziehen?${zweiBilder(reibSVG("glatt"),reibSVG("rollen"))}`,"B",["A"],"B: Mit Rollen ist die Reibung besonders klein."),
  mc("Auf welchem Untergrund ist die Reibung am größten?","Schmirgelpapier",["Eis","glatter Tisch"],"Schmirgelpapier ist sehr rau → große Reibung. Auf Eis ist die Reibung sehr klein."),
  mc("Wann ist die Reibung am kleinsten?","Wagen mit Rollen auf glattem Boden",["schwerer Klotz auf rauem Boden","leichter Klotz auf rauem Boden","Klotz mit Gewicht auf glattem Boden"],"Rollen + glatter Boden = am wenigsten Reibung."),
  mc("Im Merksatz steht „Gewichtskraft“. Welches Wort vom Arbeitsblatt hängt damit zusammen?","Anpresskraft",["Rollreibung","Oberflächenbeschaffenheit"],"Je schwerer der Körper (Gewichtskraft), desto stärker wird er auf den Boden gedrückt (Anpresskraft)."),
  paare("Ordne zu",[["Oberflächenbeschaffenheit","wie rau oder glatt der Untergrund ist"],["Anpresskraft","wie stark der Körper auf den Boden drückt"],["Rollreibung","Reibung bei Rollen – besonders klein"],["Reibungskraft","entsteht bei der Bewegung von Körpern"]]),
 ]},

{id:"g-europa",fach:"gpg",titel:"Europa: Sage, Lage & Grenzen",quelle:"Heft 15.10.",probe:null,
 merke:`<h2>Europa begegnet uns täglich</h2>
 <div class="bild"><span class="emo">👸 🐂 🌊 🏝️</span></div>
 <p>Der Sage nach verliebte sich der Göttervater <b>Zeus</b> in <b>Europa</b>, die Tochter eines Königs in <b>Asien</b>. Er verwandelte sich in einen <b>Stier</b>, nahm sie auf seinen Rücken und schwamm mit ihr bis zur Insel <b>Kreta</b>. Zu Ehren Europas sollte der Kontinent, zu dem Kreta gehört, ihren Namen tragen.</p>
 <p>Woher der Name wirklich stammt, ist nicht genau geklärt: vielleicht vom griechischen „euris“ (weit) oder von „erobos“ (dunkel), was für das <b>Abendland</b>, also den <b>Westen</b>, steht. <b>Asien</b> bedeutet dagegen <b>Morgenland</b> und meint die Länder im <b>Osten</b>.</p>
 <h2>Lage und Grenzen Europas</h2>
 <div class="bild">${grenzSVG(null)}</div>
 <p>Europa liegt auf der <b>Nordhalbkugel</b> und ist im Osten mit <b>Asien</b> verbunden.</p>
 <div class="merk">Norden: <b>Europäisches Nordmeer</b><br>Westen: <b>Atlantischer Ozean</b><br>Süden: <b>Mittelmeer</b><br>Osten: <b>Uralgebirge</b> und <b>Fluss Ural</b> (Grenze zu Asien)</div>
 <p>Das europäische Festland erstreckt sich von Norden nach Süden über etwa <b>3 800 km</b> und von Westen nach Osten über etwa <b>6 000 km</b>.</p>`,
 karten:[
  karte("Erzähle die Sage von Europa.","Zeus verliebte sich in Europa, die Tochter eines Königs in Asien. Er verwandelte sich in einen <b>Stier</b> und schwamm mit ihr auf dem Rücken bis nach <b>Kreta</b>. Der Kontinent, zu dem Kreta gehört, sollte ihren Namen tragen."),
  mc("In wen verliebte sich der Göttervater Zeus?","in Europa, die Tochter eines Königs in Asien",["in eine Göttin aus Rom","in eine Bäuerin aus Kreta","in die Königin von Ägypten"],"Europa war die Tochter eines Königs in Asien."),
  mc("In welches Tier verwandelte sich Zeus?","in einen Stier",["in einen Adler","in ein Pferd","in einen Delfin"],"Zeus wurde zum Stier und nahm Europa auf seinen Rücken."),
  mc("Bis zu welcher Insel schwamm Zeus mit Europa?","Kreta",["Sizilien","Island","Korsika"],"Er schwamm bis zur Insel Kreta."),
  mc("Warum heißt unser Kontinent „Europa“? (laut Sage)","Zu Ehren Europas sollte der Kontinent, zu dem Kreta gehört, ihren Namen tragen.",["Weil Zeus dort geboren wurde.","Weil Europa eine Stadt gegründet hat.","Weil ein Stier so hieß."],"Zu Ehren Europas bekam der Kontinent ihren Namen."),
  karte("Woher kommt der Name Europa wirklich?","Das ist <b>nicht genau geklärt</b>: vielleicht vom griechischen „euris“ (weit) oder von „erobos“ (dunkel) – das steht für das <b>Abendland</b>, also den Westen."),
  mc("Was bedeutet „Abendland“?","der Westen",["der Osten","der Norden","der Süden"],"Abendland = Westen (dort geht die Sonne am Abend unter)."),
  mc("Was bedeutet „Asien“?","Morgenland – die Länder im Osten",["Abendland – die Länder im Westen","das Land im Süden","das kalte Land"],"Asien = Morgenland = Länder im Osten."),
  mc("Auf welcher Erdhalbkugel liegt Europa?","Nordhalbkugel",["Südhalbkugel"],"Europa liegt auf der Nordhalbkugel."),
  mc("Mit welchem Kontinent ist Europa im Osten verbunden?","Asien",["Afrika","Amerika","Australien"],"Im Osten hängt Europa mit Asien zusammen."),
  mc(`Was begrenzt Europa im <b>Norden</b>?${bild("grenze_n")}`,"das Europäische Nordmeer",["das Mittelmeer","der Atlantische Ozean","das Schwarze Meer"],"Norden: Europäisches Nordmeer"),
  mc(`Was begrenzt Europa im <b>Westen</b>?${bild("grenze_w")}`,"der Atlantische Ozean",["das Mittelmeer","das Europäische Nordmeer","die Ostsee"],"Westen: Atlantischer Ozean"),
  mc(`Was begrenzt Europa im <b>Süden</b>?${bild("grenze_s")}`,"das Mittelmeer",["die Nordsee","der Atlantische Ozean","das Europäische Nordmeer"],"Süden: Mittelmeer"),
  mc(`Was bildet im <b>Osten</b> die Grenze zu Asien?${bild("grenze_o")}`,"das Uralgebirge und der Fluss Ural",["die Alpen und der Rhein","die Donau","das Mittelmeer"],"Osten: Uralgebirge und Fluss Ural"),
  text("Wie heißt das Gebirge, das im Osten die Grenze zwischen Europa und Asien bildet?",["Ural","Uralgebirge"],"Das <b>Uralgebirge</b> (und der Fluss Ural)."),
  paare("Ordne die Grenzen zu",[["Norden","Europäisches Nordmeer"],["Westen","Atlantischer Ozean"],["Süden","Mittelmeer"],["Osten","Uralgebirge und Fluss Ural"]]),
  mc("Wie weit ist das europäische Festland von Norden nach Süden?","etwa 3 800 km",["etwa 380 km","etwa 38 000 km","etwa 6 000 km"],"Norden → Süden: etwa 3 800 km"),
  mc("Wie weit ist das europäische Festland von Westen nach Osten?","etwa 6 000 km",["etwa 600 km","etwa 3 800 km","etwa 60 000 km"],"Westen → Osten: etwa 6 000 km"),
 ]},
{id:"g-inseln",fach:"gpg",titel:"Inseln, Halbinseln & Meere",quelle:"Heft 13.10.",probe:null,
 merke:`<h2>Inseln und Halbinseln</h2>
 <p>Typisch für Europa sind die vielen <b>Inseln</b> und <b>Halbinseln</b>. Zu den großen Halbinseln gehören <b>Skandinavien</b>, <b>Italien</b> und die <b>Iberische Halbinsel</b> mit Spanien und Portugal.</p>
 <div class="merk"><b>Insel:</b> rundherum von Wasser umgeben<br><b>Halbinsel:</b> an drei Seiten von Wasser umgeben, an einer Seite mit dem Festland verbunden</div>
 <div class="tabwrap"><table><tr><th>Halbinseln</th><th>Inseln</th></tr>
 <tr><td>Skandinavische Halbinsel (Norwegen, Schweden)</td><td>Island</td></tr>
 <tr><td>Iberische Halbinsel (Spanien, Portugal)</td><td>Irland, Britische Inseln</td></tr>
 <tr><td>Apenninen-Halbinsel (Italien)</td><td>Korsika, Sardinien, Sizilien</td></tr>
 <tr><td>Krim (im Schwarzen Meer)</td><td>Kreta</td></tr></table></div>
 <h3>Meere und Meerengen</h3>
 <p>Atlantischer Ozean · Europäisches Nordmeer · Nordsee · Ostsee · <b>Straße von Gibraltar</b> (zwischen Spanien und Afrika)</p>`,
 karten:[
  karte("Was ist typisch für Europa?","Die vielen <b>Inseln</b> und <b>Halbinseln</b>."),
  karte("Nenne die drei großen Halbinseln Europas aus dem Heft.","<b>Skandinavien</b>, <b>Italien</b> und die <b>Iberische Halbinsel</b> mit Spanien und Portugal."),
  mc("Was ist eine Halbinsel?","Land, das an drei Seiten von Wasser umgeben ist",["Land, das rundherum von Wasser umgeben ist","eine halb so große Insel","ein Land ohne Meer"],"Halbinsel: drei Seiten Wasser, eine Seite Festland."),
  mc("Was ist eine Insel?","Land, das rundherum von Wasser umgeben ist",["Land, das an drei Seiten von Wasser umgeben ist","ein Berg im Meer ohne Land","ein großer See"],"Insel: ringsum Wasser."),
  mc("Welche Länder liegen auf der Iberischen Halbinsel?","Spanien und Portugal",["Italien und Griechenland","Norwegen und Schweden","Frankreich und Spanien"],"Iberische Halbinsel = Spanien und Portugal."),
  text(`Die Halbinsel mit Spanien und Portugal heißt ${L} Halbinsel.`,["Iberische"],"<b>Iberische</b> Halbinsel"),
  mc("Welches Land liegt auf der Apenninen-Halbinsel?","Italien",["Spanien","Griechenland","Dänemark"],"Apenninen-Halbinsel = Italien (sieht aus wie ein Stiefel)."),
  mc("Wie heißt die große Halbinsel im Norden Europas mit Norwegen und Schweden?","Skandinavische Halbinsel",["Iberische Halbinsel","Apenninen-Halbinsel","Krim"],"Skandinavien liegt im Norden."),
  mc("Welche Insel liegt ganz im Nordwesten Europas, nahe am Polarkreis?","Island",["Irland","Sizilien","Kreta"],"Island liegt im Nordatlantik."),
  mc("Die Krim ist eine Halbinsel im …","Schwarzen Meer",["Mittelmeer","Atlantischen Ozean","Nordmeer"],"Die Krim liegt im Schwarzen Meer."),
  mc("Auf welche Insel brachte Zeus die Europa?","Kreta",["Korsika","Sardinien","Irland"],"Kreta – siehe Sage von Europa."),
  text("Welche Meerenge trennt Spanien von Afrika? Straße von …",["Gibraltar","Straße von Gibraltar"],"Die <b>Straße von Gibraltar</b>. (Otranto ist eine andere Meerenge zwischen Italien und Albanien.)"),
  mc("Welches Meer liegt zwischen Großbritannien und Dänemark/Deutschland?","Nordsee",["Ostsee","Mittelmeer","Schwarzes Meer"],"Die Nordsee."),
  mc("Welches Meer liegt zwischen Deutschland, Polen, Schweden und Finnland?","Ostsee",["Nordsee","Europäisches Nordmeer","Mittelmeer"],"Die Ostsee."),
  paare("Ordne zu",[["Island","Insel im Nordatlantik"],["Sizilien","Insel vor Italien"],["Iberische Halbinsel","Spanien und Portugal"],["Skandinavische Halbinsel","Norwegen und Schweden"],["Krim","Halbinsel im Schwarzen Meer"]]),
 ]},
{id:"g-klima",fach:"gpg",titel:"Klimazonen Europas",quelle:"Arbeitsblatt",probe:null,
 merke:`<h2>Die Klimazonen Europas</h2>
 <div class="bild">${klimaSVG()}</div>
 <div class="tabwrap"><table><tr><th>Zone</th><th>Klima</th><th>Merkmale</th></tr>
 <tr><td>kalte Zone</td><td>Schnee- und Eisklima</td><td>feucht, Sommer kühl, Winter kalt</td></tr>
 <tr><td rowspan="4">gemäßigte Zone</td><td>Seeklima</td><td>feucht, Sommer kühl, Winter mild</td></tr>
 <tr><td>Übergangsklima</td><td>zwischen See- und Landklima</td></tr>
 <tr><td>kühles Landklima</td><td>trocken, Sommer heiß, Winter kalt</td></tr>
 <tr><td>sommerheißes Landklima</td><td>Sommer sehr heiß</td></tr>
 <tr><td>warme Zone</td><td>subtropisches Klima</td><td>Sommer heiß und trocken, Winter feucht und warm</td></tr></table></div>
 <div class="merk">Je weiter man nach <b>Osten</b> kommt (weg vom Meer), desto <b>trockener</b>, die Sommer <b>heißer</b> und die Winter <b>kälter</b>.</div>
 <p>Der <b>Golfstrom</b> (warme Meeresströmung, auf der Karte als Pfeil) bringt Wärme an die Westküste Europas.</p>`,
 karten:[
  mc("Welche drei Klimazonen gibt es in Europa?","kalte, gemäßigte und warme Zone",["heiße, nasse und trockene Zone","Nord-, Mittel- und Südzone","Eis-, Wald- und Wüstenzone"],"kalte Zone – gemäßigte Zone – warme Zone"),
  mc("In welcher Klimazone liegt Deutschland?","gemäßigte Zone",["kalte Zone","warme Zone"],"Deutschland liegt in der gemäßigten Zone."),
  mc("Welches Klima ist <b>feucht</b>, hat <b>kühle Sommer</b> und <b>milde Winter</b>?","Seeklima",["kühles Landklima","subtropisches Klima","Schnee- und Eisklima"],"Seeklima: feucht, Sommer kühl, Winter mild."),
  mc("Welches Klima ist <b>trocken</b>, hat <b>heiße Sommer</b> und <b>kalte Winter</b>?","kühles Landklima",["Seeklima","subtropisches Klima","Übergangsklima"],"Kühles Landklima: trocken, Sommer heiß, Winter kalt."),
  mc("Welches Klima hat <b>heiße, trockene Sommer</b> und <b>feuchte, warme Winter</b>?","subtropisches Klima",["Seeklima","kühles Landklima","Schnee- und Eisklima"],"Subtropisches Klima (warme Zone)."),

  ...[["Madrid","subtropisches Klima"],["Rom","subtropisches Klima"],["Paris","Seeklima"],["Dublin","Seeklima"],["Berlin","Übergangsklima"],["Warschau","Übergangsklima"],["Moskau","kühles Landklima"],["Archangelsk","kühles Landklima"],["Wolgograd","sommerheißes Landklima"]]

  ...[["Moskau liegt in der gemäßigten Zone mit Übergangsklima.",false,"Moskau hat kühles Landklima."],["Berlin hat Seeklima.",false,"Berlin hat Übergangsklima."],
   ["Madrid liegt in der warmen Zone mit subtropischem Klima.",true,"Richtig."],["In Paris sind die Sommer kühl und die Winter mild.",true,"Paris hat Seeklima – Sommer kühl, Winter mild. (Auf deinem Blatt fehlt hier das Kreuz!)"],
   ["Dublin hat kühles Landklima.",false,"Dublin hat Seeklima."],["Oslo liegt in der gemäßigten Zone mit sommerheißem Landklima.",false,"Sommerheißes Landklima gibt es ganz im Südosten, z. B. Wolgograd."],

   ["Warschau liegt in der gemäßigten Zone mit Übergangsklima.",true,"Richtig."],["Porto liegt in der kalten Zone.",false,"Porto liegt in der warmen Zone."],["Rom hat subtropisches Klima.",true,"Richtig."],
   ["Reykjavik liegt in der kalten Zone.",true,"Richtig."],["Archangelsk hat kühles Landklima.",true,"Richtig."]]

 ]},
{id:"g-vegetation",fach:"gpg",titel:"Vegetationszonen Europas",quelle:"Arbeitsblatt",probe:null,
 merke:`<h2>Die Vegetationszonen Europas</h2>
 <p>Von Norden nach Süden:</p>
 <div class="tabwrap"><table class="vokabeln">
 <tr><td><span class="mini"><span class="emo">🧊</span></span></td><td><b>polare Kältewüste</b></td><td>fast keine Pflanzen</td></tr>
 <tr><td><span class="mini"><span class="emo">🌿</span></span></td><td><b>Tundra</b></td><td>Moose, Flechten, niedrige Sträucher</td></tr>
 <tr><td><span class="mini"><span class="emo">🌲</span></span></td><td><b>nördlicher Nadelwald (Taiga)</b></td><td>fast nur Nadelbäume</td></tr>
 <tr><td><span class="mini"><span class="emo">🌳🌲</span></span></td><td><b>sommergrüner Laub- und Mischwald</b></td><td>Laub- und Nadelbäume (z. B. Deutschland)</td></tr>
 <tr><td><span class="mini"><span class="emo">🌾</span></span></td><td><b>Steppe</b></td><td>Grasland, wenig Regen</td></tr>
 <tr><td><span class="mini"><span class="emo">🫒</span></span></td><td><b>Hartlaubgehölze</b></td><td>Mittelmeerpflanzen, Blätter mit Wachsschicht</td></tr>
 <tr><td><span class="mini"><span class="emo">🏜️</span></span></td><td><b>Wüste</b></td><td>sehr trocken</td></tr></table></div>
 <div class="merk">In der <b>kalten</b> Zone gibt es nur wenige Pflanzenarten: fast nur <b>Nadelbäume</b>, niedrige <b>Sträucher</b>, Flechten, <b>Moose</b> und Gras.<br>
 In der <b>gemäßigten</b> Zone wachsen <b>Laub</b>- und Nadelbäume. In niederschlagsärmeren Regionen haben sich <b>Grasländer</b> (Steppen) gebildet.<br>
 In der <b>warmen</b> Zone gibt es vor allem <b>Hartlaub</b>gewächse. Ihre Blätter sind oft mit einer <b>Wachsschicht</b> überzogen. Sie verhindert ein <b>Austrocknen</b> der Pflanzen.</div>`,
 karten:[
  ...[[`In der ${L} Zone gibt es insgesamt nur wenige Pflanzenarten.`,["kalten"]],[`Hier (kalte Zone) gedeihen fast nur ${L}, niedrige Sträucher, Flechten, Moose und Gras.`,["Nadelbäume"]],
   [`Hier gedeihen fast nur Nadelbäume, niedrige ${L}, Flechten, Moose und Gras.`,["Sträucher"]],[`Hier gedeihen fast nur Nadelbäume, niedrige Sträucher, Flechten, ${L} und Gras.`,["Moose"]],
   [`In der ${L} Zone wachsen Laub- und Nadelbäume.`,["gemäßigten"]],[`In der gemäßigten Zone wachsen ${L}- und Nadelbäume.`,["Laub"]],
   [`In den niederschlagsärmeren Regionen haben sich ${L} (Steppen) gebildet.`,["Grasländer"]],[`In der ${L} Zone gibt es vor allem Hartlaubgewächse.`,["warmen"]],
   [`In der warmen Zone gibt es vor allem ${L}-gewächse.`,["Hartlaub"]],[`Hartlaubgewächse haben oft Blätter, die mit einer ${L} überzogen sind.`,["Wachsschicht"]],
   [`Die Wachsschicht verhindert ein ${L} der Pflanzen.`,["Austrocknen"]]].map(([s,a])=>text(`Ergänze den Lückentext:<br>${s}`,a,`Richtig: <b>${a[0]}</b>`)),
  mc("Was ist die Taiga?","der nördliche Nadelwald",["eine Wüste","ein Grasland","ein Laubwald am Mittelmeer"],"Taiga = nördlicher Nadelwald"),
  mc("Was ist eine Steppe?","ein Grasland in Gebieten mit wenig Regen",["ein dichter Nadelwald","eine Eiswüste","ein Wald mit Olivenbäumen"],"Steppe = Grasland, wo es wenig regnet."),
  mc("Wozu haben Hartlaubgewächse eine Wachsschicht auf den Blättern?","Sie verhindert das Austrocknen.",["Damit sie schöner glänzen.","Damit Tiere sie nicht fressen.","Damit sie im Winter nicht frieren."],"Die Wachsschicht schützt vor dem Austrocknen im heißen, trockenen Sommer."),
  mc("Welche Vegetationszone gibt es rund ums Mittelmeer?","Hartlaubgehölze (Mittelmeerpflanzen)",["Taiga","Tundra","polare Kältewüste"],"Am Mittelmeer: Hartlaubgehölze."),
  mc("Welche Vegetationszone gibt es in Deutschland?","sommergrüner Laub- und Mischwald",["Taiga","Steppe","Hartlaubgehölze"],"Deutschland: sommergrüner Laub- und Mischwald."),
  mc("Welche Vegetationszone liegt am weitesten im Norden?","polare Kältewüste",["Taiga","Steppe","Laub- und Mischwald"],"Ganz im Norden: polare Kältewüste, dann Tundra, dann Taiga."),
  mc(`Welche Vegetationszone passt zum Bild?<div class="bild"><span class="emo">🌲🌲🌲</span></div>`,"nördlicher Nadelwald (Taiga)",["Steppe","Hartlaubgehölze","Tundra"],"Fast nur Nadelbäume → Taiga"),
  mc(`Welche Vegetationszone passt zum Bild?<div class="bild"><span class="emo">🌾🌾🌾</span></div>`,"Steppe",["Taiga","Hartlaubgehölze","polare Kältewüste"],"Grasland → Steppe"),
  mc(`Welche Vegetationszone passt zum Bild?<div class="bild"><span class="emo">🫒☀️</span></div>`,"Hartlaubgehölze",["Tundra","Taiga","Steppe"],"Oliven und Sonne → Mittelmeer → Hartlaubgehölze"),
  paare("Ordne zu: Was wächst wo?",[["Tundra","Moose, Flechten, niedrige Sträucher"],["Taiga","fast nur Nadelbäume"],["Laub- und Mischwald","Laub- und Nadelbäume"],["Steppe","Gras"],["Hartlaubgehölze","Blätter mit Wachsschicht"]]),
 ]},

{id:"mu-klaviatur",fach:"musik",titel:"Die Klaviatur",quelle:"Heft 1.1",probe:null,
 merke:`<h2>1.1 Die Klaviatur</h2>
 <div class="bild" style="overflow-x:auto">${klavierSVG(null,true)}</div>
 <ul><li>Die Klaviatur ist die <b>Anordnung der Tasten</b> bei einem Klavier oder Keyboard.</li>
 <li>Die weißen Töne heißen <b>C, D, E, F, G, A</b> und <b>H</b>.</li>
 <li>Die schwarzen Tasten sind die <b>Zwischentöne</b>.</li>
 <li>Das Muster der schwarzen Tasten wiederholt sich immer: <b>2 schwarze</b> Tasten, <b>3 schwarze</b> Tasten.</li>
 <li>Der Ton <b>C</b> befindet sich immer <b>direkt links</b> von der Gruppe aus <b>zwei schwarzen</b> Tasten.</li>
 <li>Die Klaviatur ist nach dem Prinzip <b>Tonleiter</b> aufgebaut: von <b>tiefen</b> (links) zu <b>hohen</b> Tönen (rechts).</li></ul>
 <div class="merk">Schwarze Tasten haben zwei Namen: cis/des · dis/es · fis/ges · gis/as · ais/b</div>`,
 karten:[
  karte("Was ist die Klaviatur?","Die <b>Anordnung der Tasten</b> bei einem Klavier oder Keyboard."),
  mc("Wie heißen die weißen Töne?","C, D, E, F, G, A, H",["C, D, E, F, G, A, B","A, B, C, D, E, F, G","Do, Re, Mi, Fa, So"],"Die weißen Töne: C D E F G A H"),
  mc("Was sind die schwarzen Tasten?","die Zwischentöne",["die lauten Töne","die tiefen Töne","Tasten ohne Ton"],"Schwarze Tasten = Zwischentöne"),
  mc("Wie wiederholt sich das Muster der schwarzen Tasten?","immer 2 schwarze, dann 3 schwarze Tasten",["immer 3 schwarze Tasten","immer 1 schwarze, dann 2 schwarze","immer 4 schwarze Tasten"],"Muster: 2 – 3 – 2 – 3 …"),
  mc("Wo befindet sich der Ton C?","immer direkt links von der Gruppe aus zwei schwarzen Tasten",["immer direkt rechts von drei schwarzen Tasten","ganz rechts auf der Klaviatur","zwischen zwei schwarzen Tasten"],"C liegt direkt links von den zwei schwarzen Tasten."),
  mc("Wo sind auf der Klaviatur die tiefen Töne?","links",["rechts","in der Mitte","oben"],"Von tief (links) nach hoch (rechts) – wie eine Tonleiter."),
  ...[0,1,2,3,4,5,6].map(i=>{const n=["c","d","e","f","g","a","h"][i],w=i%2?i+7:i;return text(`Welcher Ton ist markiert?<div class="bild" style="overflow-x:auto">${klavierSVG(["w",w])}</div>`,[n],`Das ist <b>${n.toUpperCase()}</b>.${n==="c"?" C liegt direkt links von den zwei schwarzen Tasten.":""}`,"Buchstabe eintippen, z. B. g")}),
  ...[0,1,2,3,4].map(i=>text(`Wie heißt die markierte schwarze Taste?<div class="bild" style="overflow-x:auto">${klavierSVG(["s",i+(i%2?5:0)])}</div>`,SCHWARZ_NAMEN[i],`Diese Taste heißt <b>${SCHWARZ_NAMEN[i][0]}</b> oder <b>${SCHWARZ_NAMEN[i][1]}</b>.`,"Ein Name reicht, z. B. fis")),
  paare("Ordne die beiden Namen der schwarzen Tasten zu",[["cis","des"],["dis","es"],["fis","ges"],["gis","as"],["ais","b"]]),
 ]},
{id:"mu-notensystem",fach:"musik",titel:"Das Notensystem",quelle:"Heft",probe:null,
 merke:`<h2>Das Notensystem</h2>
 <h3>Der Violinschlüssel (G-Schlüssel)</h3>

 <h3>Der Aufbau der Note</h3>

 <ul><li><b>Notenkopf</b>: der runde Teil</li><li><b>Notenhals</b>: der senkrechte Strich</li><li><b>Notenfähnchen</b>: das Fähnchen oben am Hals</li></ul>`,

{id:"mu-takt",fach:"musik",titel:"Schläge, Takte & Notenwerte",quelle:"Heft 1.4 / 1.5",probe:null,
 merke:`<h2>1.4 Schläge und Takte</h2>
 <p><b>Schläge:</b> Ein Schlag ist ein gleichmäßiger <b>Grundpuls</b> in der Musik. Man kann die Schläge zum Beispiel mitklatschen oder mit dem Fuß mitwippen.</p>
 <p><b>Takte:</b> Ein Takt fasst <b>mehrere Schläge</b> zusammen. Die einzelnen Takte werden durch <b>Taktstriche</b> voneinander getrennt.</p>
 <h2>1.5 Notenwerte</h2>
 <div class="bild bild2">${["ganze","halbe","viertel","achtel","16tel","32tel"].map(a=>`<figure><figcaption style="font-size:.9rem">${a==="16tel"||a==="32tel"?a:a[0].toUpperCase()+a.slice(1)}</figcaption>${noteSVG(a)}</figure>`).join("")}</div>
 <div class="merk">Ganze Note = <b>4</b> Schläge<br>Halbe Note = <b>2</b> Schläge<br>Viertelnote = <b>1</b> Schlag</div>
 <p>Wie eine Pizza: 1 Ganze = 2 Halbe = 4 Viertel = 8 Achtel 🍕</p>`,
 karten:[
  karte("Was ist ein Schlag?","Ein gleichmäßiger <b>Grundpuls</b> in der Musik. Man kann ihn mitklatschen oder mit dem Fuß mitwippen."),
  text(`Ein Schlag ist ein gleichmäßiger ${L} in der Musik.`,["Grundpuls"],"Grund<b>puls</b> (nicht „Grundplus“) – wie der Puls am Handgelenk."),
  mc("Was fasst ein Takt zusammen?","mehrere Schläge",["mehrere Lieder","nur einen Ton","alle Instrumente"],"Ein Takt fasst mehrere Schläge zusammen."),
  mc("Wodurch werden die einzelnen Takte voneinander getrennt?","durch Taktstriche",["durch Notenköpfe","durch Pausen","durch den Violinschlüssel"],"Taktstriche trennen die Takte."),

{id:"mu-rhythmus",fach:"musik",titel:"Rhythmus rechnen",quelle:"Arbeitsblatt „This little piggy has rhythm“",probe:null,
 merke:`<h2>Rhythmus rechnen</h2>
 <p>Zähle die Schläge der Noten zusammen:</p>
 <div class="merk">${noteSVG("ganze",1)} = 4 &nbsp;&nbsp; ${noteSVG("halbe",1)} = 2 &nbsp;&nbsp; ${noteSVG("viertel",1)} = 1</div>
 <p>Beispiel: ${noteSVG("halbe",1)} + ${noteSVG("viertel",1)} = 2 + 1 = <b>3</b></p>`,
 slots:8,
 gen(){const W={ganze:4,halbe:2,viertel:1},arten=Object.keys(W),n=R(2,4),ns=Array.from({length:n},()=>pick(arten));
  const summe=ns.reduce((s,a)=>s+W[a],0);
  return zahl(`Wie viele Schläge sind das zusammen?<div class="bild" style="font-size:1.6rem;font-weight:800;gap:6px">${ns.map(a=>noteSVG(a)).join(" + ")}</div>`,summe,`${ns.map(a=>W[a]).join(" + ")} = ${summe}`)}},

{id:"m-bruchteile",fach:"mathe",titel:"Bruchteile bestimmen",quelle:"Buch „Brüche“ S. 12–13, 24–29",probe:null,
 merke:`<h2>Bruchteile bestimmen</h2>
 <p>${F(3,4)} &nbsp; oben: <b>Zähler</b> (so viele Teile sind gefärbt) – unten: <b>Nenner</b> (in so viele <b>gleich große</b> Teile ist das Ganze geteilt)</p>
 <div class="bild bild2"><figure><figcaption>${F(3,8)}</figcaption>${kreisSVG(3,8)}</figure><figure><figcaption>${F(2,5)}</figcaption>${balkenSVG(2,5)}</figure></div>
 <div class="merk">Zähle zuerst <b>alle</b> gleich großen Teile (Nenner), dann die <b>gefärbten</b> Teile (Zähler).</div>
 <p>Gleich viel wert: ${F(1,2)} = ${F(2,4)} = ${F(3,6)} = ${F(12,24)} &nbsp; (kürzen und erweitern)</p>
 <p>Fünftel → Zehntel: jedes Fünftel noch einmal <b>halbieren</b> (falten).</p>`,
 slots:8,
 gen(){const art=R(0,3);
  if(art===0){const n=pick([3,4,5,6,8,10,12]),z=R(1,n-1);return bruch(`Welcher Bruchteil ist gefärbt?<div class="bild">${kreisSVG(z,n)}</div>`,z,n,"gleich",`${n} gleiche Teile, ${z} davon gefärbt → ${F(z,n)}`)}
  if(art===1){const n=R(2,10),z=R(1,n-1);return bruch(`Welcher Bruchteil ist gefärbt?<div class="bild">${balkenSVG(z,n)}</div>`,z,n,"gleich",`${n} gleiche Teile, ${z} gefärbt → ${F(z,n)}`)}
  if(art===2){const [z,n]=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[1,6],[5,6],[1,8],[3,8],[1,12],[7,12]]);return zahl(`Ein Streifen hat <b>24 Kästchen</b>. Wie viele Kästchen musst du färben für ${F(z,n)}?`,24/n*z,`24 : ${n} = ${24/n}, mal ${z} = ${24/n*z} Kästchen`)}
  const ps=shuffle([[1,2],[1,3],[5,6],[3,8],[7,12],[13,24],[2,3],[1,4]]).slice(0,2);const [a,b]=ps[0][0]/ps[0][1]>ps[1][0]/ps[1][1]?ps:[ps[1],ps[0]];
  return mc(`Welcher Bruch ist größer?<br>Tipp: Denk an ein Rechteck mit 24 Kästchen.`,F(a[0],a[1]),[F(b[0],b[1])],`${F(a[0],a[1])} = ${24/a[1]*a[0]} von 24 Kästchen, ${F(b[0],b[1])} = ${24/b[1]*b[0]} von 24 → ${F(a[0],a[1])} ist größer.`)}},
{id:"m-anzahlen",fach:"mathe",titel:"Bruchteile von Anzahlen",quelle:"Buch S. 14–15",probe:null,
 merke:`<h2>Bruchteile von Anzahlen (Mengen)</h2>
 <div class="merk"><b>${F(3,8)} von 48</b>: erst durch den <b>Nenner</b> teilen, dann mal den <b>Zähler</b>.<br>48 : 8 = 6 &nbsp;→&nbsp; 6 · 3 = <b>18</b></div>
 <h3>Anteil bestimmen</h3>
 <p>2 von 9 Äpfeln sind rot → ${F(2,9)} · 35 von 140 Seiten → ${F(35,140)} = ${F(1,4)} · 75 von 100 Teilen → ${F(75,100)} = ${F(3,4)}</p>
 <p>Der <b>Teil</b> kommt nach oben, das <b>Ganze</b> nach unten. Dann kürzen, wenn es geht.</p>`,
 slots:8,
 gen(){const art=R(0,2);
  if(art<2){const n=pick([2,3,4,5,6,8,10,12]),z=R(1,n-1),k=R(2,12),x=n*k,ding=pick(["Orangen","Äpfel","Schüler","Batterien","Bonbons","Murmeln"]);
   return M(zahl(`Wie viel sind ${F(z,n)} von ${x} ${ding}?`,k*z,`${x} : ${n} = ${k} → ${k} · ${z} = <b>${k*z}</b>`),{art:"von",z,n,x})}
  const n=pick([4,5,6,8,9,10,12,20]),z=R(1,n-1),k=pick([1,1,2,3,5]),[ding,ganz]=pick([["Seiten gelesen","ein Buch hat"],["Plätze besetzt","ein Bus hat"],["Teile gelegt","ein Puzzle hat"],["Kinder haben ein Haustier","eine Klasse hat"]]);
  const g=ggT(z,n);return bruch(`${z*k} ${ding} – ${ganz} insgesamt ${n*k}. Welcher Bruchteil ist das?`,z*k,n*k,"gleich",`Teil durch Ganzes: ${F(z*k,n*k)}${k>1||g>1?` = ${F(z/g,n/g)} (gekürzt)`:""}`)}},
{id:"m-groessen",fach:"mathe",titel:"Bruchteile von Größen & Einheiten",quelle:"Buch S. 16–17, 24, 29",probe:null,
 merke:`<h2>Bruchteile von Größen</h2>
 <div class="tabwrap"><table><tr><td>1 h = 60 min</td><td>${F(1,4)} h = 15 min</td><td>${F(1,3)} h = 20 min</td><td>${F(1,2)} h = 30 min</td><td>${F(3,4)} h = 45 min</td></tr>
 <tr><td>1 kg = 1000 g</td><td>${F(1,4)} kg = 250 g</td><td>${F(1,2)} kg = 500 g</td><td>${F(3,4)} kg = 750 g</td><td>${F(1,8)} kg = 125 g</td></tr>
 <tr><td>1 l = 1000 ml</td><td>${F(1,4)} l = 250 ml</td><td>${F(1,2)} l = 500 ml</td><td>${F(1,10)} l = 100 ml</td><td></td></tr>
 <tr><td>1 Tag = 24 h</td><td>${F(1,2)} Tag = 12 h</td><td>${F(1,4)} Tag = 6 h</td><td></td><td></td></tr></table></div>
 <div class="merk">Rechne in die <b>kleinere Einheit</b> um, dann wie bei Anzahlen:<br>${F(2,3)} h = ${F(2,3)} von 60 min → 60 : 3 = 20 → 20 · 2 = <b>40 min</b></div>`,
 slots:8,
 gen(){const E=[["h","min",60,[2,3,4,5,6,10,12]],["Tag","h",24,[2,3,4,6,8,12]],["kg","g",1000,[2,4,5,8,10]],["l","ml",1000,[2,4,5,8,10]],["km","m",1000,[2,4,5,10]]];
  const art=R(0,1);
  if(art===0){const [g,k,f,ns]=pick(E),n=pick(ns),z=R(1,n+ (n>3?1:0)),wert=f/n*z;
   return M(zahl(`Wandle um: ${F(z,n)} ${g} = ? ${k}`,wert,`1 ${g} = ${f} ${k} → ${f} : ${n} = ${f/n} → ${f/n} · ${z} = <b>${wert} ${k}</b>`,k),{art:"groesse",z,n,x:f,g,k})}
  const [x,e,n,z]=pick([[12,"min",3,2],[36,"min",6,5],[60,"min",3,2],[60,"min",4,3],[8,"kg",4,3],[20,"kg",5,4],[75,"km",3,2],[100,"km",5,3],[45,"min",3,2],[90,"min",6,5],[900,"l",5,2],[1200,"l",8,5],[60,"kg",5,3],[75,"kg",5,3]]);
  return M(zahl(`Berechne: ${F(z,n)} von ${x} ${e}`,x/n*z,`${x} : ${n} = ${x/n} → ${x/n} · ${z} = <b>${x/n*z} ${e}</b>`,e),{art:"von",z,n,x})}},
{id:"m-ganzes",fach:"mathe",titel:"Das Ganze berechnen",quelle:"Buch S. 15, 25, 29",probe:null,
 merke:`<h2>Das Ganze berechnen</h2>
 <p>120 Kinder haben ein Handy. Das sind ${F(5,6)} der Klasse. Wie viele Kinder sind es insgesamt?</p>
 <div class="merk">Rückwärts rechnen: erst durch den <b>Zähler</b> teilen (= ein Teil), dann mal den <b>Nenner</b> (= alle Teile).<br>120 : 5 = 24 &nbsp;→&nbsp; 24 · 6 = <b>144 Kinder</b></div>`,
 slots:6,
 gen(){if(Math.random()<.2)return zahl(`Von allen Kindern in Klasse 6 haben 120 ein Handy. Das sind ${F(5,6)}. Wie viele Kinder sind insgesamt in Klasse 6?`,144,`120 : 5 = 24 → 24 · 6 = <b>144</b>`);
  const n=pick([3,4,5,6,8,10]),z=R(1,n-1),k=R(2,15),[ding,satz]=pick([["Kinder","fahren mit dem Bus"],["€","sind schon gespart"],["Seiten","sind gelesen"],["Hühner","legen weiße Eier"]]);
  return M(zahl(`${z*k} ${ding} ${satz}. Das sind ${F(z,n)} vom Ganzen. Wie viel ist das Ganze?`,n*k,`${z*k} : ${z} = ${k} (ein Teil) → ${k} · ${n} = <b>${n*k}</b>`),{art:"ganzes",z,n,teil:z*k})}},
{id:"m-gemischt",fach:"mathe",titel:"Gemischte Zahlen",quelle:"Buch S. 18–19",probe:null,
 merke:`<h2>Gemischte Zahlen</h2>
 <p>Ein Bruch, bei dem der Zähler größer ist als der Nenner, ist <b>größer als 1 Ganzes</b>. Man kann ihn als <b>gemischte Zahl</b> schreiben.</p>
 <div class="bild bild2"><figure><figcaption>2${F(3,4)} = ${F(11,4)}</figcaption><div>${kreisSVG(4,4,46)}${kreisSVG(4,4,46)}${kreisSVG(3,4,46)}</div></figure></div>
 <div class="merk"><b>Bruch → gemischte Zahl:</b> ${F(17,5)}: 17 : 5 = 3 Rest 2 → <b>3${F(2,5)}</b><br><b>Gemischte Zahl → Bruch:</b> 2${F(5,9)}: 2 · 9 + 5 = 23 → <b>${F(23,9)}</b></div>
 <p class="muted">So gibst du sie ein: gemischte Zahl mit Leerzeichen, z. B. <b>3 2/5</b></p>`,
 slots:8,
 gen(){const n=pick([2,3,4,5,6,7,8,9,10,12]),g=R(1,6),r=R(1,n-1),z=g*n+r,art=R(0,2);
  if(art===0)return M(bruch(`Schreibe als <b>gemischte Zahl</b>: ${F(z,n)}`,z,n,"gemischt",`${z} : ${n} = ${g} Rest ${r} → <b>${g} ${r}/${n}</b>`),{art:"gemischt",z,n});
  if(art===1)return M(bruch(`Schreibe als <b>Bruch</b>: ${g}${F(r,n)}`,z,n,"genau",`${n} · ${g} + ${r} = ${z} → ${F(z,n)}`),{art:"bruch",g,r,n});
  const nn=pick([3,4]),gg=R(1,3),rr=R(1,nn-1);return bruch(`Schreibe als <b>gemischte Zahl</b>.<div class="bild">${Array.from({length:gg},()=>kreisSVG(nn,nn,56)).join("")}${kreisSVG(rr,nn,56)}</div>`,gg*nn+rr,nn,"gemischt",`${gg} ganze Kreise und ${rr} von ${nn} Teilen → <b>${gg} ${rr}/${nn}</b> = ${F(gg*nn+rr,nn)}`)}},
{id:"m-zahlenstrahl",fach:"mathe",titel:"Brüche am Zahlenstrahl",quelle:"Buch S. 20–21",probe:null,
 merke:`<h2>Brüche am Zahlenstrahl</h2>
 <div class="bild">${strahlSVG(3,4)}</div>
 <div class="merk">1. Zähle, in wie viele Teile die Strecke von <b>0 bis 1</b> geteilt ist → <b>Nenner</b>.<br>2. Zähle die Schritte von 0 bis zum Pfeil → <b>Zähler</b>.</div>
 <p>Hinter der 1 geht es weiter: ${F(5,4)} = 1${F(1,4)}</p>`,
 slots:6,
 gen(){const n=pick([2,3,4,5,6,8,10]),z=R(1,2*n-1);return bruch(`Auf welchen Bruch zeigt der Pfeil?<div class="bild">${strahlSVG(z,n)}</div>`,z,n,"gleich",`Von 0 bis 1 sind es ${n} Teile, der Pfeil steht beim ${z}. Strich → ${F(z,n)}${z>n?` = 1 ${z-n}/${n}`:""}`)}},
{id:"m-sachaufgaben",fach:"mathe",titel:"Sachaufgaben mit Brüchen",quelle:"Buch S. 24–25",probe:null,

 karten:[

  bruch(`Welcher Anteil wird am <b>Dienstag</b> (grün) geerntet?<div class="bild">${feldSVG()}</div>`,6,60,"gleich","6 von 60 Teilen → <b>1/10</b>"),

  zahl("Montag 10, Dienstag 6, Mittwoch 12, Donnerstag 8, Freitag 20 Teile. Wie viele der 60 Teile bleiben für Samstag?",4,"60 − 10 − 6 − 12 − 8 − 20 = <b>4 Teile</b> (= 1/15)"),
  zahl("Herr Wurzer kauft eine Packung Käse mit <b>8 Käseecken</b>, insgesamt 360 g. Wie schwer ist eine Käseecke?",45,"360 g : 8 = <b>45 g</b>","g"),
  zahl(`Der Käse besteht zu ${F(2,5)} aus Fett. Wie viel Gramm Fett hat die ganze Packung (360 g)?`,144,"360 : 5 = 72 → 72 · 2 = <b>144 g</b>","g"),
  zahl(`Wie viel Gramm Fett hat eine Käseecke (45 g), wenn der Käse zu ${F(2,5)} aus Fett besteht?`,18,"45 : 5 = 9 → 9 · 2 = <b>18 g</b>","g"),
  zahl(`Ein Fenster kostet 1200 €. Familie Reuter zahlt ${F(1,3)} an. Wie viel Euro sind das?`,400,"1200 : 3 = <b>400 €</b>","€"),
  zahl(`Das Fenster kostet 1200 €, ${F(1,3)} (400 €) ist angezahlt. Wie viel muss bei Lieferung noch bezahlt werden?`,800,"1200 − 400 = <b>800 €</b> (das sind 2/3)","€"),
  zahl(`Familie Reuter zahlt ${F(2,5)} von 1200 € an. Wie viel Euro sind das?`,480,"1200 : 5 = 240 → 240 · 2 = <b>480 €</b>","€"),
  zahl(`Familie Reuter zahlt ${F(3,10)} von 1200 € an. Wie viel ist dann bei Lieferung noch zu zahlen?`,840,"1200 : 10 = 120 → 120 · 3 = 360 € angezahlt → 1200 − 360 = <b>840 €</b>","€"),
  zahl(`In einen vollen Tank passen 120 l. Die Tankuhr zeigt ${F(1,2)}. Wie viele Liter sind noch im Tank?`,60,"120 : 2 = <b>60 l</b>","l"),
  zahl(`In einen vollen Tank passen 120 l. Die Tankuhr zeigt ${F(3,4)}. Wie viele Liter sind noch im Tank?`,90,"120 : 4 = 30 → 30 · 3 = <b>90 l</b>","l"),
  zahl(`Der Mensch besteht zu etwa ${F(3,5)} aus Wasser. Frau Heitmann wiegt 60 kg. Wie viel kg davon sind Wasser?`,36,"60 : 5 = 12 → 12 · 3 = <b>36 kg</b>","kg"),
  zahl(`Herr Heitmann wiegt 75 kg. Wie viel kg sind Wasser (${F(3,5)})?`,45,"75 : 5 = 15 → 15 · 3 = <b>45 kg</b>","kg"),
  zahl(`${F(3,4)} der 72 Batterien sind leer. Wie viele sind leer?`,54,"72 : 4 = 18 → 18 · 3 = <b>54</b>"),
  zahl(`Von 96 Hühnern legen ${F(5,12)} weiße Eier. Wie viele Hühner sind das?`,40,"96 : 12 = 8 → 8 · 5 = <b>40</b>"),

 ]},

function klimadiagSVG(markiere){
  const T=[-1,0,4,8,13,16,18,17,13,9,4,0],N=[50,45,50,55,80,100,95,80,60,50,60,55],x0=46,y0=172,M="JFMAMJJASOND";
  const ty=t=>y0-t*4,ny=n=>y0-n*1.2;
  const bars=N.map((n,i)=>`<rect x="${x0+i*20+2}" y="${ny(n)}" width="16" height="${y0-ny(n)}" fill="color-mix(in srgb, #2f6fd6 ${markiere==="n"?60:35}%, var(--surface))" stroke="none"/>`).join("");
  const kurve=`<polyline points="${T.map((t,i)=>`${x0+i*20+10},${ty(t)}`).join(" ")}" stroke="#d64545" stroke-width="${markiere==="t"?5:3}" fill="none"/>`;
  const achsT=[-10,0,10,20,30].map(t=>`<text x="${x0-6}" y="${ty(t)+4}" text-anchor="end" font-size="10" fill="#d64545" stroke="none">${t}</text>`).join("");
  const achsN=[0,20,40,60,80,100].map(n=>`<text x="${x0+246}" y="${ny(n)+4}" font-size="10" fill="#2f6fd6" stroke="none">${n}</text>`).join("");
  return sv(320,230,`<rect x="${x0}" y="40" width="240" height="${y0-40+40}" fill="var(--surface)" stroke-width="1.5"/>${bars}<line x1="${x0}" y1="${y0}" x2="${x0+240}" y2="${y0}" stroke-width="2"/>${kurve}${achsT}${achsN}
   <text x="${x0-6}" y="34" text-anchor="end" font-size="11" font-weight="800" fill="#d64545" stroke="none">°C</text><text x="${x0+246}" y="34" font-size="11" font-weight="800" fill="#2f6fd6" stroke="none">mm</text>
   <text x="${x0+6}" y="56" font-size="12" font-weight="800" fill="var(--fg)" stroke="none">Landshut</text><text x="${x0+234}" y="56" text-anchor="end" font-size="11" fill="var(--fg)" stroke="none">48°N/12°O</text>
   <text x="${x0+6}" y="70" font-size="10" fill="var(--fg)" stroke="none">393 m ü. M.</text>
   <text x="${x0+6}" y="205" font-size="12" font-weight="800" fill="#d64545" stroke="none">8,5 °C</text><text x="${x0+234}" y="205" text-anchor="end" font-size="12" font-weight="800" fill="#2f6fd6" stroke="none">824 mm</text>
   ${[...M].map((m,i)=>`<text x="${x0+i*20+10}" y="226" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)" stroke="none">${m}</text>`).join("")}`,"Klimadiagramm Landshut (vereinfacht)")}
const KINDER=[["Anna","Kazan (Russland)","Winter sehr kalt und lang, oft unter −20 °C; kurzer Sommer bis 20 °C, im Sommer regnet es oft","④ 55°N/50°O · 3,7 °C · 542 mm"],
 ["Gunar","Vardø (Norwegen)","Polarnacht von November bis Januar, Polartag von Mai bis Ende Juli; Winter −3 bis −5 °C, Juli/August etwa 10 °C","② 70°N/31°O · 2,7 °C · 624 mm"],
 ["Pierre","Brest (Frankreich, am Atlantik)","Klima vom Atlantik bestimmt: Winter selten unter 0 °C, kein Schnee, Sommer nicht zu heiß, viel Wind und Regen","③ 48°N/4°W · 10,8 °C · 1126 mm"],
