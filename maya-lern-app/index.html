{id:"g-gliederung",fach:"gpg",titel:"Gliederung Europas",quelle:"Buch S. 10–12",probe:null,
 merke:`<h2>Die Gliederung Europas</h2>
 <p>Europa ist ein relativ kleiner Kontinent, besteht aber aus <b>48 Staaten</b> mit etwa <b>740 Millionen Einwohnern</b>. Es gibt <b>über 100</b> verschiedene Sprachen.</p>
 <h3>Sechs Großräume</h3>
 <div class="tabwrap"><table><tr><td><b>Nordeuropa</b></td><td>z. B. Island, Norwegen, Schweden, Finnland, Dänemark</td></tr><tr><td><b>Westeuropa</b></td><td>z. B. Großbritannien, Irland, Frankreich, Niederlande, Belgien</td></tr>
 <tr><td><b>Mitteleuropa</b></td><td>z. B. Deutschland, Polen, Tschechien, Österreich, Schweiz</td></tr><tr><td><b>Südeuropa</b></td><td>z. B. Spanien, Portugal, Italien</td></tr>
 <tr><td><b>Südosteuropa</b></td><td>z. B. Rumänien, Bulgarien, Serbien</td></tr><tr><td><b>Osteuropa</b></td><td>z. B. Russland, Ukraine, Belarus</td></tr></table></div>
 <p>Die Bezeichnungen orientieren sich an den <b>Himmelsrichtungen</b>.</p>
 <div class="merk"><b>Staat:</b> ein Gebiet mit klaren Grenzen. Er hat einen Namen, eine Nationalhymne und eine Flagge. Er regelt das Leben der Menschen mithilfe von Gesetzen. In einem Staat leben Staatsangehörige, das Volk.</div>
 <div class="merk"><b>Skandinavien:</b> die Länder Nordeuropas (ohne Island) auf der Skandinavischen Halbinsel (Norwegen, Schweden, Finnland) sowie Dänemark. „Skandinavien“ bedeutet in einer alten Sprache „gefährliche Halbinsel“.</div>
 <h3>Wie erkennt man Europa?</h3><p>Das Festland Europas hat die Form eines <b>Keils</b>, der nach Asien hin breiter wird. Typisch sind die Formen der großen Halbinseln Italien (wie ein <b>Stiefel</b>), Skandinavien und Spanien/Portugal.</p>
 <p>Halbinseln und Inseln nehmen etwa <b>ein Drittel</b> der Landfläche Europas ein. Europa lässt sich nur an <b>drei Seiten</b> klar abgrenzen, weil es im Osten mit Asien verbunden ist.</p>`,
 karten:[
  zahl("Aus wie vielen Staaten besteht Europa?",48,"Europa besteht aus 48 Staaten."),
  mc("Wie viele Einwohner hat Europa ungefähr?","etwa 740 Millionen",["etwa 74 Millionen","etwa 7 Milliarden","etwa 7 400"],"etwa 740 Millionen Einwohner"),
  mc("Wie viele Sprachen gibt es in Europa?","über 100",["genau 48","etwa 10","nur 6"],"Es gibt über 100 verschiedene Sprachen."),
  zahl("In wie viele Großräume wird Europa gegliedert?",6,"6 Großräume: Nord-, West-, Mittel-, Süd-, Südost- und Osteuropa"),
  karte("Nenne die sechs Großräume Europas.","Nordeuropa, Westeuropa, Mitteleuropa, Südeuropa, Südosteuropa, Osteuropa"),
  mc("Woran orientieren sich die Namen der Großräume?","an den Himmelsrichtungen",["an den Sprachen","an den Flüssen","an den Hauptstädten"],"Nord-, West-, Süd-, Osteuropa …"),
  ...[["Deutschland","Mitteleuropa"],["Frankreich","Westeuropa"],["Norwegen","Nordeuropa"],["Spanien","Südeuropa"],["Italien","Südeuropa"],["Russland","Osteuropa"],["Polen","Mitteleuropa"],["Schweden","Nordeuropa"],["Rumänien","Südosteuropa"],["Großbritannien","Westeuropa"]]
   .map(([l,r],i)=>mc(`Zu welchem Großraum gehört <b>${l}</b>?`,r,["Nordeuropa","Westeuropa","Mitteleuropa","Südeuropa","Südosteuropa","Osteuropa"].filter(x=>x!==r).slice(i%3,i%3+3),`${l} → ${r}`)),
  karte("Was ist ein Staat? (Fachbegriff)","Ein Gebiet mit <b>klaren Grenzen</b>. Er hat einen <b>Namen</b>, eine <b>Nationalhymne</b> und eine <b>Flagge</b>. Er regelt das Leben mit <b>Gesetzen</b>. Die Staatsangehörigen sind das <b>Volk</b>."),
  mc("Was gehört <b>nicht</b> zu einem Staat?","ein eigener Kontinent",["klare Grenzen","eine Flagge","eine Nationalhymne"],"Ein Staat hat Grenzen, Namen, Nationalhymne, Flagge und Gesetze."),
  mc("Welche Länder gehören zu Skandinavien?","Norwegen, Schweden, Finnland und Dänemark",["Island, Irland und Großbritannien","Spanien und Portugal","Deutschland, Polen und Tschechien"],"Skandinavien: Norwegen, Schweden, Finnland sowie Dänemark (ohne Island)."),
  mc("Was bedeutet „Skandinavien“ in einer alten Sprache?","gefährliche Halbinsel",["kalte Insel","Land der Wikinger","nördliches Meer"],"„gefährliche Halbinsel“"),
  mc("Welche Form hat das Festland Europas?","die Form eines Keils, der nach Asien hin breiter wird",["die Form eines Kreises","die Form eines Sterns","die Form eines Stiefels"],"Keilform – nach Osten (Asien) wird es breiter."),
  mc("Welche Halbinsel sieht aus wie ein Stiefel?","Italien",["Skandinavien","die Iberische Halbinsel","die Krim"],"Italien hat die Form eines Stiefels."),
  mc("Wie viel der Landfläche Europas nehmen Halbinseln und Inseln ein?","etwa ein Drittel",["etwa die Hälfte","fast alles","etwa ein Zehntel"],"etwa ein Drittel"),
  mc("Warum lässt sich Europa nur an drei Seiten klar abgrenzen?","Weil es im Osten mit Asien verbunden ist.",["Weil es eine Insel ist.","Weil es keine Meere gibt.","Weil es auf der Südhalbkugel liegt."],"Im Osten hängt Europa mit Asien zusammen."),

{id:"g-klimadiagramm",fach:"gpg",titel:"Klimadiagramm & Klima der Kinder",quelle:"Buch S. 14–15",probe:null,
 merke:`<h2>Ein Klimadiagramm lesen</h2>
 <p>Im Klimadiagramm werden <b>Temperatur</b> und <b>Niederschlag</b> eines Ortes dargestellt. Forscher brauchen dafür die Wetterdaten von <b>30 Jahren</b> und rechnen für jeden Monat Durchschnittswerte aus.</p>
 <div class="bild">${klimadiagSVG()}</div><p class="muted" style="text-align:center">vereinfacht nach Buch S. 14</p>
 <ul><li><b>rote Kurve</b> = Temperatur (Skala links in °C)</li><li><b>blaue Säulen</b> = Niederschlag (Skala rechts in mm)</li><li>oben: Name, Lage (48°N/12°O) und Höhe über dem Meeresspiegel (393 m ü. M.)</li>
 <li>unten links: <b>Jahresmitteltemperatur</b> (8,5 °C) · unten rechts: <b>Jahresniederschlag</b> = Summe aller Monate (824 mm)</li><li>unten: Anfangsbuchstaben der Monate J F M A M J J A S O N D</li></ul>
 <div class="merk"><b>Schritt 1:</b> Lage bestimmen (Längen- und Breitengrad, Küste oder Landesinneres, Höhe).<br><b>Schritt 2:</b> Informationen erfassen: Temperaturkurve beschreiben, kältesten und wärmsten Monat nennen; wann fällt viel, wann wenig Niederschlag?</div>
 <p><b>Mitteltemperaturen:</b> Tagesmittel = jede Stunde messen, addieren, durch 24 teilen · Monatsmittel = Tagesmittel addieren, durch die Anzahl der Tage teilen · Jahresmittel = Durchschnitt der 12 Monatsmittel.</p>
 <h3>Menschen leben in allen Klimazonen</h3>
 <div class="tabwrap"><table>${KINDER.map(([n,o,k,d])=>`<tr><td><b>${n}</b><br>${o}</td><td>${k}</td><td>${d}</td></tr>`).join("")}</table></div>
 <p><b>Polarnacht:</b> Die Sonne geht nicht auf, es bleibt dunkel. <b>Polartag:</b> Es bleibt auch nachts hell.</p>`,
 karten:[
  mc(`Was zeigt die <b>rote Linie</b> im Klimadiagramm?${bild("kd_t")}`,"die Temperatur",["den Niederschlag","die Höhe","die Windstärke"],"Rote Kurve = Temperatur in °C"),
  mc(`Was zeigen die <b>blauen Säulen</b>?${bild("kd_n")}`,"den Niederschlag",["die Temperatur","die Sonnenstunden","die Einwohner"],"Blaue Säulen = Niederschlag in mm"),

  mc("Was ist der Jahresniederschlag?","die Summe der Niederschläge aller 12 Monate",["der Niederschlag im regenreichsten Monat","der Durchschnitt der Temperaturen","der Regen an einem Tag"],"Summe der monatlichen Niederschläge"),
  mc("Wie wird die Jahresmitteltemperatur berechnet?","Durchschnitt der zwölf Monatsmitteltemperaturen",["wärmster Monat minus kältester Monat","Temperatur am 1. Januar","Summe aller Temperaturen"],"Durchschnitt der 12 Monatsmittel"),
  mc("Wie wird die Tagesmitteltemperatur ermittelt?","jede Stunde messen, addieren und durch 24 teilen",["mittags einmal messen","nur nachts messen","höchste und niedrigste Temperatur addieren"],"jede Stunde messen, addieren, durch 24"),
  mc("Was machst du bei Schritt 1 „Die Lage bestimmen“?","Längen- und Breitengrad, Küste oder Landesinneres und Höhe ermitteln",["den wärmsten Monat suchen","die Säulen zählen","das Diagramm abmalen"],"Schritt 1: Lage bestimmen"),
  mc(`Welche Jahresmitteltemperatur hat Landshut?${bild("kd")}`,"8,5 °C",["824 °C","393 °C","12 °C"],"unten links: 8,5 °C"),
  zahl("Wie viel Niederschlag fällt in Landshut im Jahr? (mm)",824,"824 mm im Jahr","mm"),
  mc("In welchem Monat ist es in Landshut am wärmsten?","Juli",["Januar","April","Oktober"],"Die rote Kurve ist im Juli am höchsten."),
  ...KINDER.map(([n,o,k],i)=>mc(`Wer erzählt das?<br>„${k}“`,`${n} aus ${o}`,KINDER.filter(x=>x[0]!==n).map(x=>`${x[0]} aus ${x[1]}`),`${n} aus ${o}`)),
  ...KINDER.map(([n,o,k,d])=>mc(`Welches Klimadiagramm gehört zu <b>${n}</b> aus ${o}?`,d,KINDER.filter(x=>x[0]!==n).map(x=>x[3]),`${n}: ${d}`)),
  mc("Was ist die Polarnacht?","Die Sonne geht nicht auf, es bleibt dunkel.",["Es bleibt auch nachts hell.","Eine besonders warme Nacht.","Eine Nacht mit Nordlicht."],"Polarnacht: Es bleibt dunkel (in Vardø von November bis Januar)."),
  mc("Was ist der Polartag?","Es bleibt auch in der Nacht hell.",["Es ist den ganzen Tag dunkel.","Der kälteste Tag des Jahres.","Ein Feiertag in Norwegen."],"Polartag: auch nachts hell (in Vardø Mai bis Ende Juli)."),
  mc("Warum sinken in Brest die Temperaturen im Winter selten unter 0 °C?","weil das Klima vom Atlantischen Ozean bestimmt wird",["weil Brest in der Wüste liegt","weil Brest auf einem Berg liegt","weil es dort nie Wind gibt"],"Der Atlantik macht die Winter mild (Seeklima)."),
 ]});
(()=>{const t=THEMEN.find(x=>x.id==="g-europa");

 <p>„euris“ heißt <b>weit</b>. „erebos“ heißt <b>dunkel</b> – das steht für das <b>Abendland</b>, also den Ort, wo die Sonne <b>untergeht</b> (Westen). <b>Asien</b> bedeutet <b>Morgenland</b> oder <b>Sonnenaufgang</b> (Osten).</p>`;

  mc("Was heißt das griechische Wort „euris“?","weit",["dunkel","Westen","Stier"],"euris = weit"),
  mc("Was heißt „erebos“?","dunkel",["weit","hell","Insel"],"erebos = dunkel → Abendland, wo die Sonne untergeht"),

(()=>{const t=THEMEN.find(x=>x.id==="g-klima");
 t.merke+=`<h3>Aus dem Buch (S. 16)</h3>
 <p><b>Kalte Zone:</b> im Norden; kurze kühle Sommer, sehr lange kalte Winter; Niederschlag oft als Schnee, der lange liegen bleibt.</p>
 <p><b>Gemäßigte Zone:</b> weder besonders heiß noch besonders kalt; das Wetter wird durch die Jahreszeiten bestimmt; Niederschlag das ganze Jahr. Im Westen und Nordwesten mildes <b>Seeklima</b> durch den Atlantischen Ozean: geringe Temperaturunterschiede zwischen Sommer und Winter. Der Osten hat <b>Landklima</b>: große Temperaturunterschiede.</p>
 <p><b>Warme Zone:</b> im Süden; Sommer trocken mit hohen Temperaturen, im Winter regnet es häufiger.</p>
 <div class="merk"><b>Klimazone:</b> Gebiete mit gleichen oder ähnlichen klimatischen Bedingungen. Sie verlaufen gürtelartig um die Erde.<br><b>Golfstrom:</b> eine warme Meeresströmung, wirkt wie eine <b>Warmwasserheizung</b>. Dadurch ist es in Westeuropa wärmer als in anderen Regionen gleicher Breitenlage. Am Nordkap hat das Wasser noch 5 °C, die Häfen Norwegens frieren im Winter nicht zu.</div>`;
 t.karten.push(
  karte("Was ist eine Klimazone? (Fachbegriff)","Gebiete mit <b>gleichen oder ähnlichen klimatischen Bedingungen</b>. Sie verlaufen <b>gürtelartig</b> um die Erde. Die Vegetation ist in jeder Klimazone anders."),
  karte("Was ist der Golfstrom? (Fachbegriff)","Eine <b>warme Meeresströmung</b>. Sie wirkt wie eine <b>Warmwasserheizung</b>: Westeuropa ist dadurch wärmer als andere Regionen mit gleicher Breitenlage."),
  mc("Womit vergleicht das Buch den Golfstrom?","mit einer Warmwasserheizung",["mit einem Kühlschrank","mit einem Ventilator","mit einem Staudamm"],"Golfstrom = Warmwasserheizung Europas"),
  mc("Warum frieren die Häfen an der Küste Norwegens im Winter nicht zu?","dank des warmen Golfstroms",["weil dort Salz gestreut wird","weil Norwegen in der warmen Zone liegt","weil es dort nie Winter gibt"],"Der Golfstrom hält das Wasser warm (am Nordkap noch 5 °C)."),
  mc("Was würde passieren, wenn es den Golfstrom nicht mehr gäbe?","Westeuropa würde deutlich kälter werden.",["Westeuropa würde heißer werden.","Es würde sich nichts ändern.","Das Mittelmeer würde zufrieren."],"Ohne die „Warmwasserheizung“ würde es im Westen Europas kälter."),
  mc("Was ist typisch für die <b>kalte Zone</b>?","kurze kühle Sommer und sehr lange kalte Winter",["heiße trockene Sommer","milde Winter mit viel Regen","das ganze Jahr warm"],"Niederschlag fällt oft als Schnee, der lange liegen bleibt."),
  mc("Was ist typisch für die <b>gemäßigte Zone</b>?","weder besonders heiß noch besonders kalt, Niederschlag das ganze Jahr",["immer Schnee und Eis","sehr heiße, trockene Sommer","kein Regen im ganzen Jahr"],"Das Wetter wird durch die Jahreszeiten bestimmt."),
  mc("Woher kommt das milde Seeklima im Westen Europas?","vom Einfluss des Atlantischen Ozeans",["vom Uralgebirge","von der Sahara","vom Schwarzen Meer"],"Der Atlantik bestimmt das Seeklima."),
  mc("Wie sind die Temperaturunterschiede zwischen Sommer und Winter beim <b>Landklima</b> im Osten?","groß",["gering","gar nicht vorhanden"],"Im Landklima: große Unterschiede. Im Seeklima: geringe Unterschiede."),
  mc("In welcher Klimazone liegt Deutschland?","in der gemäßigten Zone",["in der kalten Zone","in der warmen Zone"],"Deutschland: gemäßigte Zone"));})();
(()=>{const t=THEMEN.find(x=>x.id==="g-vegetation");
 t.merke+=`<h3>Aus dem Buch (S. 17)</h3><ul><li>Kalte Zone: Die Anzahl der Nadelbäume <b>nimmt nach Norden hin ab</b>.</li>
 <li>Gemäßigte Zone: <b>Laubbäume</b> werfen ihre Blätter im Winter ab, denn diese vertragen keinen Frost. Die meisten <b>Nadelbäume</b> tragen ihre Nadeln ganzjährig, sie vertragen tiefe Temperaturen.</li>
 <li>Warme Zone: Die Wachsschicht verhindert das Austrocknen, denn es ist lange heiß und trocken. Andere Pflanzen <b>speichern Wasser</b> im Stamm oder in den Wurzeln.</li></ul>
 <p><b>Deutschland</b> liegt in der gemäßigten Zone im Bereich des sommergrünen Laub- und Mischwalds.</p>`;

  mc("Warum werfen Laubbäume im Winter ihre Blätter ab?","weil die Blätter keinen Frost vertragen",["weil sie zu schwer werden","weil Tiere sie fressen","weil es zu viel regnet"],"Blätter vertragen keinen Frost."),
  mc("Warum behalten Nadelbäume ihre Nadeln das ganze Jahr?","weil sie tiefe Temperaturen vertragen",["weil sie nie wachsen","weil es im Norden warm ist","weil sie keine Wurzeln haben"],"Nadeln vertragen tiefe Temperaturen."),
  mc("Wie verändert sich die Anzahl der Nadelbäume nach Norden hin?","sie nimmt ab",["sie nimmt zu","sie bleibt gleich"],"Je weiter nördlich, desto weniger Nadelbäume."),
  mc("Wie überstehen manche Pflanzen in der warmen Zone die Trockenheit?","Sie speichern Wasser im Stamm oder in den Wurzeln.",["Sie werfen im Sommer alle Blätter ab und sterben.","Sie wachsen nur im Schnee.","Sie trinken Meerwasser."],"Wasser im Stamm oder in den Wurzeln speichern – oder Blätter mit Wachsschicht."),
  karte("Stell dir vor, du fährst mit dem Auto von Murmansk nach Rom. Wie ändern sich Klima und Vegetation?","Von der <b>kalten Zone</b> (Tundra, Taiga) durch die <b>gemäßigte Zone</b> (Laub- und Mischwald) bis in die <b>warme Zone</b> (Hartlaubgehölze am Mittelmeer). Es wird immer wärmer, die Winter milder, die Sommer heißer und trockener."));})();

function streifenSVG(liste){ // liste: [[z,n],...] – Bruchstreifen wie im Heft
  const w=300,h=34;return `<svg viewBox="0 0 ${w} ${liste.length*(h+6)}" width="${w}" height="${liste.length*(h+6)}" role="img" aria-label="Bruchstreifen">${liste.map(([z,n],r)=>Array.from({length:n},(_,i)=>`<rect x="${2+i*(w-4)/n}" y="${r*(h+6)+2}" width="${(w-4)/n}" height="${h}" fill="${i<z?"var(--fach)":"var(--surface)"}" stroke="var(--fg)" stroke-width="1.5"/>`).join("")+`<text x="${w/2}" y="${r*(h+6)+h/2+8}" text-anchor="middle" font-size="16" font-weight="800" fill="var(--fg)" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${z}/${n}</text>`).join("")}</svg>`}

{id:"m-brucharten",fach:"mathe",titel:"Die Brucharten",quelle:"Hefteintrag",probe:null,
 merke:`<h2>Die Brucharten</h2>
 <p>${F(2,7)} &nbsp; Der <b>Zähler</b> zählt die Teile. Der <b>Bruchstrich</b> trennt. Der <b>Nenner</b> nennt, wie viele Teile man für ein Ganzes braucht.</p>
 <h3>Echte Brüche</h3><p>Zähler <b>kleiner</b> als Nenner → Wert <b>kleiner als ein Ganzes</b>: ${F(1,2)} ${F(2,3)} ${F(3,10)}</p>
 <h3>Unechte Brüche</h3><p>Zähler <b>größer</b> als Nenner → Wert <b>größer als ein Ganzes</b>: ${F(3,2)} ${F(8,3)} ${F(13,10)}</p>
 <h3>Gemischte Zahlen</h3><p><b>Größer als ein Ganzes</b>. Sie bestehen aus mindestens einem <b>Ganzen</b> und einem <b>echten Bruch</b>: 1${F(1,2)} („ein Ganzes, ein Halbes“) · 2${F(2,3)} · 1${F(3,10)}</p>`,
 karten:[
  karte("Was zählt der Zähler, was nennt der Nenner?","Der <b>Zähler</b> zählt die Teile.<br>Der <b>Nenner</b> nennt, wie viele Teile man für ein Ganzes braucht."),
  ...[[1,2],[2,3],[3,10],[5,8],[7,12]].map(([z,n])=>mc(`Welche Bruchart ist ${F(z,n)}?`,"echter Bruch",["unechter Bruch","gemischte Zahl"],"Zähler kleiner als Nenner → echter Bruch (kleiner als 1)")),
  ...[[3,2],[8,3],[13,10],[9,4],[11,6]].map(([z,n])=>mc(`Welche Bruchart ist ${F(z,n)}?`,"unechter Bruch",["echter Bruch","gemischte Zahl"],"Zähler größer als Nenner → unechter Bruch (größer als 1)")),
  ...[[1,1,2],[2,2,3],[1,3,10],[3,1,4]].map(([g,z,n])=>mc(`Welche Bruchart ist ${g}${F(z,n)}?`,"gemischte Zahl",["echter Bruch","unechter Bruch"],"Ganze + echter Bruch → gemischte Zahl")),
  mc("Ein echter Bruch ist immer …","kleiner als ein Ganzes",["größer als ein Ganzes","genau ein Ganzes"],"Zähler < Nenner → kleiner als 1"),
  mc("Ein unechter Bruch ist immer …","größer als ein Ganzes",["kleiner als ein Ganzes","kleiner als ein Halbes"],"Zähler > Nenner → größer als 1"),
  mc("Wie spricht man 1½ aus?","ein Ganzes, ein Halbes",["eins durch zwei","ein Zweitel","einhalb Ganze"],"„ein Ganzes, ein Halbes“"),
  paare("Ordne zu",[["Zähler","zählt die Teile"],["Nenner","Teile für ein Ganzes"],["echter Bruch","kleiner als 1"],["unechter Bruch","größer als 1, z. B. 8/3"],["gemischte Zahl","Ganze + echter Bruch"]]),
 ]},
{id:"m-erweitern",fach:"mathe",titel:"Vergröbern & Verfeinern",quelle:"Hefteintrag",probe:null,
 merke:`<h2>Bruchteile vergröbern und verfeinern</h2>
 <div class="merk">Wenn man den <b>Zähler</b> und den <b>Nenner</b> mit der <b>gleichen Zahl</b> multipliziert oder dividiert, bleibt der Bruch <b>gleich groß</b>.</div>
 <p><b>Verfeinern</b> (mal): ${F(2,3)} = ${F(6,9)} (·3) · ${F(3,7)} = ${F(6,14)} (·2) · ${F(2,10)} = ${F(6,30)} (·3)</p>
 <p><b>Vergröbern</b> (geteilt): ${F(3,15)} = ${F(1,5)} (:3) · ${F(4,8)} = ${F(2,4)} (:2) · ${F(7,14)} = ${F(1,2)} (:7)</p>

const norm=s=>String(s).toLowerCase().trim().replace(/[’`´]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"")

  if(q.typ==="zahl")return Z(String(q.loesung).replace(".",","))+(q.einheit?" "+q.einheit:"");

/* ---------- Rechenweg ---------- */
const weg=(frage,schritte,erkl)=>({typ:"weg",frage,schritte,erkl});

  if(m.art==="von"||m.art==="groesse"){const s=[[`① : Nenner → ${m.x} : ${m.n} =`,m.x/m.n],[`② · Zähler → (Ergebnis ①) · ${m.z} =`,m.x/m.n*m.z]];
    return m.art==="groesse"?[[`⓪ Umrechnen: 1 ${m.g} = ? ${m.k}`,m.x],...s]:s}
  if(m.art==="ganzes")return [[`① Ein Teil → ${m.teil} : ${m.z} =`,m.teil/m.z],[`② Das Ganze → (Ergebnis ①) · ${m.n} =`,m.teil/m.z*m.n]];

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;

  if(q.typ==="text"){const roh=String(w).trim().replace(/\s+/g," ").replace(/[.!?]+$/,""),cs=s=>s.replace(/^(the|a|an) /i,"");
    if(q.loesung.some(l=>cs(roh)===cs(l)))return {p:1,max:1};

  if(q.typ==="paare")return {p:w===0?1:w===1?.5:0,max:1,hinweis:w===1?"ein Fehlversuch (½ Punkt)":""};

function teilSVG(x,n,z){const k=x/n,proReihe=n<=6?n:Math.ceil(n/2),bw=Math.min(64,Math.floor(300/proReihe)),bh=k<=12?Math.ceil(k/4)*13+22:40,rows=Math.ceil(n/proReihe);let t="";

    if(k<=12&&Number.isInteger(k))for(let j=0;j<k;j++)t+=`<circle cx="${cx+10+(j%4)*((bw-26)/3)}" cy="${cy+11+Math.floor(j/4)*13}" r="4.5" fill="${an?"var(--fach)":"var(--muted)"}"/>`;

  if(q.typ==="text"){const alt=[...new Set((t.karten||[]).filter(x=>x.typ==="text").map(x=>x.loesung[0]).filter(x=>norm(x)!==norm(q.loesung[0])))];

function helfer(q,w){

    if(Number.isInteger(x/n)&&n<=12)bild=teilSVG(x,n,z)}

    text=a[0]===b[0]?`Beide haben den gleichen Zähler (${a[0]}). Dann gilt: <b>Je größer der Nenner, desto kleiner die Stücke!</b> Stell dir eine Pizza vor: In ${a[1]} Stücke oder in ${b[1]} Stücke geschnitten – wo ist ein Stück größer? 🍕`
     :a[1]===b[1]?`Gleicher Nenner: Die Stücke sind gleich groß. Wer <b>mehr Stücke</b> (größerer Zähler) hat, hat mehr.`:`Schau auf die Bilder: Welche Pizza ist mehr gefärbt?`;

  else{if(fastRichtig(q,w)){titel="Ganz knapp!";text=`Nur <b>ein Buchstabe</b> ist anders. Richtig geschrieben: <b>${esc(q.loesung[0])}</b>. Schreib es dir einmal auf!`}

const isoTag=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function montagVon(versatz=0){const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+versatz*7);return d}
function termineAm(iso){
  const d=new Date(iso+"T12:00"),wd=d.getDay(),liste=[];
  const plan=STUNDENPLAN[wd];
  if(plan){let letzte=-1;plan.forEach((f,i)=>{if(f)letzte=i});
    liste.push({von:"8:00",bis:SCHULENDE[letzte],titel:"Schule",icon:"🏫",typ:"schule",faecher:plan.filter(Boolean)})}
  WOCHENTERMINE.filter(t=>t.tag===wd).forEach(t=>liste.push(Object.assign({},t)));
  PROBEN.filter(p=>p.datum===iso).forEach(p=>liste.push({von:"",titel:p.titel,icon:"📝",typ:"probe",info:p.stunde,fach:p.fach}));
  TERMINE.filter(t=>t.datum===iso).forEach(t=>liste.push({von:"",titel:t.text,icon:"📅",typ:"termin"}));
  AUFGABEN.filter(a=>a.tage.includes(wd)).forEach(a=>liste.push({von:"",titel:a.text,icon:a.icon,typ:"notiz"}));
  ERINNERUNGEN.filter(e=>e.datum===iso).forEach(e=>liste.push({von:"",titel:e.text,icon:"🔔",typ:"notiz"}));
  S.notizen.filter(n=>n.datum===iso&&!n.erledigt).forEach(n=>liste.push({von:"",titel:n.text,icon:"📌",typ:"notiz"}));
  const zahl=s=>s?+s.replace(":",".")||0:-1;
  return liste.sort((a,b)=>zahl(a.von)-zahl(b.von))}

function wocheHTML(versatz,kurz){
  const mo=montagVon(versatz);

  ellaIdx=(i+ms.length)%ms.length;ms.forEach((m,k)=>m.classList.toggle("an",k===ellaIdx));ps.forEach((p,k)=>p.classList.toggle("an",k===ellaIdx));
  const f=document.querySelector(".ella-figur");if(f){f.classList.remove("hopp");void f.offsetWidth;f.classList.add("hopp")}}
setInterval(()=>{if(!Q&&V.seite==="start"&&document.visibilityState==="visible")ellaZeige(ellaIdx+1)},8000);

  const dran=heuteDran().length,m=tagesMenge(),alle=alleKarten(),gel=alle.filter(sitzt).length;
  return `<section class="kachel hero"><div class="hero-text"><p class="eyebrow">${WTAG_LANG[new Date().getDay()]}, ${datumDE(tag()).replace(/\d\d$/,"")}</p>
   ${ellaHTML()}
   <div class="row">${dran?`<button class="btn" data-act="heute">Los geht's – ${Math.min(dran,m)} Fragen</button>`:`<span class="muted">Für heute ist alles wiederholt – super!</span>`}</div></div>
   <div class="hero-stats"><div><b>${S.heute.anzahl}</b><span>heute gelöst</span></div><div><b>${S.serie.letzter>=tag(-1)?S.serie.tage:0}</b><span>Tage in Folge</span></div><div><b>${gel}</b><span>von ${alle.length} sitzen</span></div></div></section>`}
function kachelCountdown(){
  const p=kommendeProben().find(p=>p.themen.length);if(!p)return "";const f=fach(p.fach),d=tageBis(p.datum);
  return `<section class="kachel countdown" style="--fach:${f.farbe}"><p class="eyebrow">Nächste Probe</p><div class="cd-zahl">${d}</div><p class="cd-einheit">${d===1?"Tag":"Tage"}</p>
   <p><b>${f.name}</b> · ${datumKurz(p.datum)}</p><button class="btn small" data-act="vorb" data-probe="${PROBEN.indexOf(p)}">Jetzt üben</button></section>`}

function aufgabenHeute(){const iso=tag(),wd=new Date(iso+"T12:00").getDay();
  const liste=AUFGABEN.filter(a=>!a.tage.length||a.tage.includes(wd)).map(a=>({id:a.id,text:a.text,icon:a.icon,lernen:a.lernen,taschengeld:a.taschengeld}));
  ERINNERUNGEN.forEach((e,i)=>{if(e.datum===iso)liste.push({id:"e"+i,text:e.text,icon:"🔔",punkte:e.punkte})});
  TODOS.filter(t=>!S.todo[t.id]).forEach(t=>liste.push({id:"todo-"+t.id,text:t.text,icon:t.icon,todo:true}));
  return liste}
const lernMinuten=()=>Math.floor((S.lernzeit[tag()]||0)/60);
function lernTipp(){const p=kommendeProben().find(p=>p.themen.length&&tageBis(p.datum)>=1);return "dieses Wochenende: Mathe, Englisch-Vokabeln und Musik"}
function aufgabenblockHTML(){const iso=tag(),fertig=S.erledigt[iso]||{},ls=aufgabenHeute(),n=ls.filter(a=>fertig[a.id]).length;
  ls.forEach(a=>{if(a.lernen&&lernMinuten()>=30)fertig[a.id]=true});

     <span><span class="a-icon">${a.icon}</span> ${a.text}${a.lernen?`<span class="lernbalken"><i style="width:${Math.min(100,lernMinuten()/30*100)}%"></i></span><small class="a-info">${lernMinuten()} von 30 Minuten in der App · ${lernTipp()}${fertig[a.id]?"":` <button class="back" style="display:inline;padding:0" data-act="heute">Jetzt lernen →</button>`}</small>`:""}${a.todo?`<small class="a-info">To-do – bleibt stehen, bis es erledigt ist</small>`:""}${a.punkte&&!fertig[a.id]?`<ul class="punkte-liste">${a.punkte.map(q=>`<li>☐ ${q}</li>`).join("")}</ul>`:""}</span></li>`).join("")}</ul>
   ${n2===ls.length&&ls.length?`<p class="block-fertig">Alles erledigt! 🎉 Super gemacht, Maja!</p>`:""}</section>`}
/* ---------- Fortschritt je Fach ---------- */
function fachProzent(fid){const ks=themenVon(fid).filter(t=>t.quelle!=="Beispiel").flatMap(kartenVon);if(!ks.length)return null;
  return Math.round(100*ks.reduce((s,k)=>{const st=stand(k.id);return s+(st?Math.min(st.box,3)/3:0)},0)/ks.length)}
const FORTSCHRITT_FAECHER=()=>FAECHER.filter(f=>themenVon(f.id).some(t=>t.quelle!=="Beispiel"));
function verlaufMerken(){const v={};FORTSCHRITT_FAECHER().forEach(f=>v[f.id]=fachProzent(f.id));S.verlauf[tag()]=v;
  for(const k of Object.keys(S.verlauf))if(tageBis(k)<-60)delete S.verlauf[k]}
function vergleich(fid){const tage=Object.keys(S.verlauf).filter(k=>tageBis(k)<0).sort();const alt=tage.filter(k=>tageBis(k)<=-7).pop()||tage[0];
  if(!alt||S.verlauf[alt][fid]==null)return null;return {diff:fachProzent(fid)-S.verlauf[alt][fid],seit:tageBis(alt)<=-7?"seit letzter Woche":"seit "+wtag(alt)}}
function ringSVG(p){const r=34,u=2*Math.PI*r,farbe=p>=70?"var(--ok)":p>=40?"#e6a700":"var(--bad)";
  return `<svg viewBox="0 0 84 84" width="84" height="84" role="img" aria-label="${p} Prozent"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
   ${p>0?"":"<!--"}<circle cx="42" cy="42" r="${r}" fill="none" stroke="${farbe}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${u*p/100} ${u}" transform="rotate(-90 42 42)"/>${p>0?"":"-->"}
   <text x="42" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="var(--fg)" font-family="var(--f-display)">${p}%</text></svg>`}
function lobText(){
  const heute=S.tagStat[tag()]||{},fs=Object.entries(heute).filter(([,x])=>x.n>=3),gesamt=Object.values(heute).reduce((a,x)=>({r:a.r+x.r,n:a.n+x.n}),{r:0,n:0});
  const saetze=[];
  if(!gesamt.n)saetze.push(`Heute hast du noch nicht geübt. Starte mit <b>„Los geht's“</b> – ${lernTipp()}. Du schaffst das! 💪`);
  else{const q=gesamt.r/gesamt.n;saetze.push(q>=.8?`Wow, Maja! Heute schon <b>${gesamt.r} von ${gesamt.n}</b> richtig – das lief richtig gut! 🌟`:q>=.6?`Gut gemacht! Heute <b>${gesamt.r} von ${gesamt.n}</b> richtig. Bleib dran! 👍`:`Du hast heute schon <b>${gesamt.n} Aufgaben</b> geübt – Fehler gehören zum Lernen dazu. Morgen klappt es schon besser! 🌱`);
    const best=fs.sort((a,b)=>b[1].r/b[1].n-a[1].r/a[1].n)[0];if(best&&best[1].r/best[1].n>=.7)saetze.push(`Besonders stark warst du heute in <b>${fach(best[0]).name}</b> (${best[1].r} von ${best[1].n}).`)}
  const besser=FORTSCHRITT_FAECHER().map(f=>[f,vergleich(f.id)]).filter(([,v])=>v&&v.diff>0).sort((a,b)=>b[1].diff-a[1].diff)[0];
  if(besser)saetze.push(`In <b>${besser[0].name}</b> bist du ${besser[1].seit} um <b>+${besser[1].diff} %</b> besser geworden! 🚀`);
  const sw=schwachstellen()[0];const schwach=sw?sw.t.titel:(()=>{const f=FORTSCHRITT_FAECHER().filter(f=>IMMER_WIEDERHOLEN.includes(f.id)).sort((a,b)=>fachProzent(a.id)-fachProzent(b.id))[0];return f?f.name:""})();
  if(schwach)saetze.push(`Eine Kleinigkeit lernen wir noch dazu: <b>${schwach}</b>.`);
  return saetze.join(" ")}
function kachelFortschritt(){
  return `<section class="kachel breit"><div class="k-kopf"><h3>🌈 Dein Fortschritt</h3><span class="muted">wie gut die Aufgaben schon sitzen</span></div>
   <div class="ringe">${FORTSCHRITT_FAECHER().map(f=>{const p=fachProzent(f.id),v=vergleich(f.id),zu=FAECHER.length&&!IMMER_WIEDERHOLEN.includes(f.id);
     return `<button class="ring" data-go="fach" data-fach="${f.id}" style="--fach:${f.farbe}">${ringSVG(p)}<b>${f.name}</b>
      ${v&&v.diff?`<span class="ring-diff ${v.diff>0?"plus":"minus"}">${v.diff>0?"▲ +":"▼ "}${v.diff} %</span>`:`<span class="ring-diff">${p>=70?"läuft super":p>=40?"wird besser":"noch üben"}</span>`}</button>`}).join("")}</div>
   <p class="tipp">🟢 ab 70 % sitzt es gut · 🟡 ab 40 % wird es besser · 🔴 darunter noch üben. NT, GPG und Musik werden nach ihrer Probe nicht mehr abgefragt – Mathe, Deutsch und Englisch kommen immer wieder dran, damit sie für die großen Proben sitzen.</p></section>`}
/* ================================================================
   SPARBUCH (Taschengeld 5 € jeden Freitag + eigene Einträge)
   ================================================================ */
const TASCHENGELD=5, TG_WOCHENTAG=5; // 5 € jeden Freitag
const SPARARTEN=[["taschengeld","💶","Taschengeld"],["geburtstag","🎂","Geburtstag"],["weihnachten","🎄","Weihnachten"],["ostern","🐣","Ostern"],
 ["verdient","💪","Selbst verdient"],["geschenk","🎁","Geschenk"],["start","🐷","Startguthaben"],["ausgabe","🛍️","Ausgabe"]];
const sparArt=k=>SPARARTEN.find(a=>a[0]===k)||SPARARTEN[5];
const euro=x=>(Math.round(x*100)/100).toFixed(2).replace(".",",")+" €";
const sparStand=()=>S.spar.buchungen.reduce((a,b)=>a+b.betrag,0);
function freitageZwischen(vonIso,bisIso){let n=0;const d=new Date(vonIso+"T12:00"),e=new Date(bisIso+"T12:00");while(d<=e){if(d.getDay()===TG_WOCHENTAG)n++;d.setDate(d.getDate()+1)}return n}
function offeneFreitage(bisIso){const heute=tag();let n=freitageZwischen(heute,bisIso);
  if(new Date(heute+"T12:00").getDay()===TG_WOCHENTAG&&S.spar.buchungen.some(b=>b.id==="tg-"+heute))n--;return n}
function sparPrognose(){const jetzt=sparStand(),j=+tag().slice(0,4);
  const bisJahr=offeneFreitage(`${j}-12-31`),naechstes=freitageZwischen(`${j+1}-01-01`,`${j+1}-12-31`);
  return {jetzt,jahr:j,bisJahr,endeJahr:jetzt+bisJahr*TASCHENGELD,naechstes,endeNaechstes:jetzt+(bisJahr+naechstes)*TASCHENGELD}}
function zielInfo(){const z=S.spar.ziel;if(!z||!z.betrag)return null;const st=sparStand(),fehlt=Math.max(0,z.betrag-st);
  const wochen=Math.ceil(fehlt/TASCHENGELD);let datum=null;if(fehlt>0){const d=new Date();let n=0;while(n<wochen){d.setDate(d.getDate()+1);if(d.getDay()===TG_WOCHENTAG)n++}datum=isoTag(d)}
  return {name:z.name,betrag:z.betrag,fehlt,prozent:Math.min(100,Math.round(100*st/z.betrag)),wochen,datum}}
function taschengeldBuchen(an){const id="tg-"+tag();S.spar.buchungen=S.spar.buchungen.filter(b=>b.id!==id);
  if(an)S.spar.buchungen.push({id,datum:tag(),betrag:TASCHENGELD,art:"taschengeld",text:"Taschengeld"})}
function schweinSVG(gr=110){return `<svg viewBox="0 0 120 100" width="${gr}" height="${Math.round(gr*100/120)}" class="schwein" role="img" aria-label="Sparschwein">
 <ellipse cx="60" cy="58" rx="42" ry="32" fill="#ffa6c9"/><circle cx="96" cy="54" r="13" fill="#ff8fbb"/><ellipse cx="99" cy="54" rx="6" ry="5" fill="#ff6fa5"/>
 <circle cx="97" cy="53" r="1.5" fill="#8a2f55"/><circle cx="101" cy="53" r="1.5" fill="#8a2f55"/><circle cx="82" cy="44" r="3" fill="#3a2a45"/>
 <path d="M72 28 l6 -12 l6 14 z" fill="#ff8fbb"/><rect x="46" y="26" width="22" height="5" rx="2.5" fill="#c2417f"/>
 <rect x="30" y="80" width="10" height="14" rx="4" fill="#ff8fbb"/><rect x="74" y="80" width="10" height="14" rx="4" fill="#ff8fbb"/>
 <path d="M18 56 q-10 -4 -6 -12 q4 6 8 2" fill="none" stroke="#ff8fbb" stroke-width="4" stroke-linecap="round"/>
 <g class="muenze"><circle cx="57" cy="12" r="9" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/><text x="57" y="16" text-anchor="middle" font-size="11" font-weight="800" fill="#9a7600">€</text></g></svg>`}
function vSparbuch(){
  const st=sparStand(),pr=sparPrognose(),z=zielInfo(),bs=S.spar.buchungen.slice().sort((a,b)=>a.datum<b.datum?1:-1);
  const heuteFr=new Date(tag()+"T12:00").getDay()===TG_WOCHENTAG,tgHeute=S.spar.buchungen.some(b=>b.id==="tg-"+tag());
  return `<div class="spar-seite">
   <section class="kachel spar-hero"><div>${schweinSVG(130)}</div><div class="spar-stand"><p class="eyebrow">Mein Sparbuch 🐷</p><div class="spar-betrag ${st<0?"minus":""}">${euro(st)}</div>
    <p class="muted">Taschengeld: <b>${euro(TASCHENGELD)}</b> jeden Freitag</p>
    ${heuteFr?`<button class="btn ${tgHeute?"ghost":""}" data-act="tgheute">${tgHeute?"✓ Heutiges Taschengeld ist gebucht":"💶 Heutiges Taschengeld (5 €) eintragen"}</button>`:""}</div></section>
   <div class="spar-grid">
    <section class="kachel"><h3>🔮 So viel hast du, wenn du alles sparst</h3>
     <div class="prognose"><div><span>Ende ${pr.jahr}</span><b>${euro(pr.endeJahr)}</b><small>+ ${pr.bisJahr} Freitage × ${euro(TASCHENGELD)}</small></div>
     <div><span>Ende ${pr.jahr+1}</span><b>${euro(pr.endeNaechstes)}</b><small>+ ${pr.naechstes} Freitage im ganzen Jahr ${pr.jahr+1}</small></div></div>
     <p class="tipp">Geschenke zu Geburtstag, Weihnachten oder Ostern kommen noch obendrauf!</p></section>
    <section class="kachel"><h3>🎯 Mein Sparziel</h3>
     ${z?`<p><b>${esc(z.name)}</b> · ${euro(z.betrag)}</p><div class="balken spar-balken"><i style="width:${z.prozent}%"></i></div>
      <p>${z.fehlt>0?`Noch <b>${euro(z.fehlt)}</b> – das sind etwa <b>${z.wochen} Wochen</b> Taschengeld. Geschafft am <b>${wtag(z.datum)}, ${datumDE(z.datum)}</b>! 🚀`:`<b>Ziel erreicht! 🎉</b> Du hast genug gespart.`}</p>`:`<p class="muted">Wofür sparst du? Trag dein Ziel ein!</p>`}
     <form id="zform" class="nform" autocomplete="off"><input id="zname" placeholder="z. B. Neue Kopfhörer" value="${z?esc(z.name):""}" aria-label="Sparziel"><input id="zbetrag" inputmode="decimal" placeholder="Betrag €" value="${z?String(z.betrag).replace(".",","):""}" aria-label="Betrag in Euro" style="width:110px"><button class="btn small" type="submit">${z?"Ändern":"Ziel setzen"}</button></form></section>
   </div>
   <section class="kachel"><h3>✍️ Geld eintragen</h3>
    <form id="sform" class="sform" autocomplete="off">
     <div class="sp-arten">${SPARARTEN.map(([k,ic,n],i)=>`<label class="chip"><input type="radio" name="sart" value="${k}" ${i===1?"checked":""}> ${ic} ${n}</label>`).join("")}</div>
     <div class="nform"><input id="sbetrag" inputmode="decimal" placeholder="Betrag, z. B. 20" aria-label="Betrag in Euro" style="width:150px"><input id="stext" placeholder="Notiz, z. B. von Oma" aria-label="Notiz"><input id="sdatum" type="date" value="${tag()}" aria-label="Datum"><button class="btn" type="submit">Eintragen</button></div>
     <p class="tipp">Bei „Ausgabe“ wird der Betrag abgezogen. Mit „Startguthaben“ trägst du ein, was schon in deiner Spardose ist.</p></form></section>
   <section class="kachel"><h3>📒 Meine Einträge</h3>
    ${bs.length?`<ul class="spar-liste">${bs.map(b=>{const [,ic,n]=sparArt(b.art);return `<li><span class="sl-ic">${ic}</span><span class="sl-text"><b>${esc(b.text||n)}</b><small>${wtag(b.datum)}, ${datumDE(b.datum)} · ${n}</small></span><span class="sl-betrag ${b.betrag<0?"minus":""}">${b.betrag>0?"+":""}${euro(b.betrag)}</span><button class="nweg" data-act="sloeschen" data-s="${b.id}" aria-label="Eintrag löschen">✕</button></li>`}).join("")}</ul>`
     :`<p class="muted">Noch keine Einträge. Fang mit deinem Startguthaben an – wie viel ist schon in deiner Spardose?</p>`}</section>
   <p class="fuss">Das Sparbuch wird auf diesem Gerät gespeichert.</p></div>`}
function kachelSparbuch(){const st=sparStand(),z=zielInfo();

function vNoten(){

    if(!ns.length)return `<section class="notenfach" style="--fach:${f.farbe}"><div class="nf-kopf"><h3>${f.name}</h3><span class="muted">Noch keine Note</span></div>
      ${p?`<p class="muted">Nächste Probe: ${datumKurz(p.datum)} · ${lerntageText(p)}</p>`:""}</section>`;
    return `<section class="notenfach" style="--fach:${f.farbe}">
     <div class="nf-kopf"><h3>${f.name}</h3><div class="nf-schnitt"><span class="gross">${komma(x)}</span><span>steht auf <b>${stehtAuf(x)}</b></span></div></div>
     <div class="notenliste">${ns.map(n=>`<div class="notenzeile"><span class="nz-note">${esc(n.note)}</span><span class="nz-text"><b>${esc(n.art||"Note")}</b>${n.thema?` · ${esc(n.thema)}`:""}${(n.gewicht||1)!==1?` · zählt ${String(n.gewicht).replace(".",",")}-fach`:""}</span><span class="muted nz-datum">${n.datum?datumDE(n.datum):""}</span></div>`).join("")}</div>
     <div class="wenn"><p><b>Was wäre, wenn${p?` du in der Probe am ${datumKurz(p.datum)}`:" du in der nächsten Probe"} eine … schreibst?</b></p>
      <div class="wenn-grid">${[1,2,3,4,5,6].map(g=>{const y=schnitt(f.id,g),d=y-x;return `<div class="wenn-zelle"><span class="wz-note">${g}</span><span>Ø ${komma(y)}</span><span class="muted">steht auf ${stehtAuf(y)}</span><span class="wz-pfeil ${d<-0.005?"besser":d>0.005?"schlechter":""}">${d<-0.005?"▲ besser":d>0.005?"▼ schlechter":"= gleich"}</span></div>`}).join("")}</div></div>
    </section>`};
  return `<div class="weltraum kalender-raum noten-raum"><div class="sterne-bg" aria-hidden="true"></div>
   <div class="planeten" aria-hidden="true">${sonnensystemSVG()}${erdeSVG()}${saturnSVG()}${marsSVG()}<span class="rk r1">🚀</span><span class="rk r2">🚀</span><span class="rk r5">🚀</span><span class="komet">☄️</span><span class="stern-gross">⭐</span><span class="astro2">${astronautSVG()}</span><span class="astro3">🧑‍🚀</span></div>
   <button class="back wr-back" data-go="start">← Startseite</button>
   <div class="wr-kopf-zeile"><div class="kopf" style="flex:1"><div><p class="eyebrow">🌟 Deine Noten im Weltall</p><h1>Noten</h1><p class="muted">Alle eingetragenen Noten, der Durchschnitt pro Fach und was eine neue Note verändern würde.</p></div>
    ${gesamt!==null?`<div class="stat"><b>${komma(gesamt)}</b><span>Ø aller Fächer</span></div>`:""}</div>${astronautSVG()}</div>
   ${NOTEN.length?"":`<section class="leerhinweis"><h3>Noch keine Noten eingetragen.</h3><p class="muted">Sobald Noten da sind, siehst du hier den Durchschnitt in jedem Fach, auf welcher Note du stehst und was die nächste Probe verändern kann.</p></section>`}
   ${mitNoten.map(fachKarte).join("")}${FAECHER.filter(f=>!notenVon(f.id).length&&(!f.neben||naechsteProbe(f.id))).map(fachKarte).join("")}
   <section class="probe" style="--fach:var(--deutsch)"><h2>Wo du üben solltest</h2>
    ${schw.length?`<p>In diesen Themen waren zuletzt viele Antworten falsch:</p>${schw.map(x=>`<div class="thema" style="--fach:${fach(x.t.fach).farbe}"><div class="t"><h3>${x.t.titel}</h3><span class="muted" style="font-size:.85rem">${fach(x.t.fach).name} · ${x.falsch} von ${x.ges} geübten Fragen zuletzt falsch</span></div><button class="btn small" data-act="ueben" data-thema="${x.t.id}">Jetzt üben</button></div>`).join("")}`
     :`<p class="muted">Gerade gibt es keine auffälligen Schwachstellen. Sobald du öfter übst, zeigt die App hier Themen, in denen noch viel falsch ist.</p>`}

function vQuiz(){
  if(Q.fertig)return vErgebnis();
  const q=Q.fragen[Q.i],t=thema(q.themaId),f=fach(t.fach),fertig=Q.beantwortet,letzte=Q.antworten[Q.antworten.length-1];
  let feld="";
  if(q.typ==="karte"){
    feld=Q.aufgedeckt?`<div class="antwortkarte pop">${q.antwort}</div><p class="tipp">Sei ehrlich: Hast du das gewusst?</p>
      <div class="row"><button class="btn ok" data-act="gewusst">Gewusst</button><button class="btn bad" data-act="nichtgewusst">Nicht gewusst</button></div>`
     :`<p class="tipp">Überleg dir die Antwort oder sag sie laut. Dann dreh die Karte um.</p><div><button class="btn" data-act="aufdecken" id="aufdeckbtn">Antwort zeigen</button></div>`}
  else if(q.typ==="weg"){const w=Q.auswahl||[];
    feld=`<form class="weg" id="wform" autocomplete="off">${q.schritte.map(([l],i)=>`<label class="wegzeile"><span>${l}</span><input id="weg-${i}" inputmode="decimal" ${fertig?`disabled value="${esc(w[i]??"")}" class="${wegOk(q.schritte[i],w[i])?"ok":"no"}"`:""} aria-label="Schritt ${i+1}"></label>`).join("")}
      ${fertig?"":`<div><button class="btn" type="submit">Prüfen</button></div>`}</form>`}
  else if(q.typ==="paare"){const fp=Q.fertigPaare,fe=Q.fehlPaar||[];
    const knopf=(seite,i,txt)=>{let c="pk";if(fp.includes(i))c+=" done";else if(seite==="l"&&Q.sel===i)c+=" sel";else if((seite==="l"&&fe[0]===i)||(seite==="r"&&fe[1]===i))c+=" err";
      return `<button class="${c}" data-p${seite}="${i}" ${fp.includes(i)||fertig?"disabled":""}>${txt}</button>`};
    feld=`<p class="tipp">Tippe links etwas an und dann rechts das, was dazu passt.</p><div class="paare"><div class="spalte">${q.links.map(i=>knopf("l",i,q.paare[i][0])).join("")}</div>
      <div class="spalte">${q.rechts.map(i=>knopf("r",i,q.paare[i][1])).join("")}</div></div>`}
  else if(q.typ==="satz"){
    feld=`<div class="bau">${Q.bau.map((w,k)=>`<button class="wchip" data-bau="${k}" ${fertig?"disabled":""}>${esc(q.woerter[w])}</button>`).join("")}</div>
      ${fertig?"":`<div class="woerter">${q.reihe.filter(i=>!Q.bau.includes(i)).map(i=>`<button class="wchip" data-w="${i}">${esc(q.woerter[i])}</button>`).join("")}</div>
      <div class="row"><button class="btn" data-act="satzpruefen" ${Q.bau.length===q.woerter.length?"":"disabled"}>Prüfen</button>${Q.bau.length?`<button class="btn ghost small" data-act="satzleeren">Von vorn</button>`:""}</div>`}`}
  else if(q.typ==="mc"){feld=`<div class="optionen">${q.optionen.map((o,i)=>{let c="opt";if(fertig){if(o===q.loesung)c+=" richtig";else if(o===Q.auswahl)c+=" falsch"}
     return `<button class="${c}" data-opt="${i}" ${fertig?"disabled":""}>${o}</button>`}).join("")}</div>`}
  else{const tipp=q.typ==="bruch"?(q.modus==="gemischt"?"Gemischte Zahl mit Leerzeichen eingeben, z. B. 2 3/4":"Bruch so eingeben: 3/4"):q.typ==="zahl"?"Nur die Zahl eingeben":q.tipp||"";
    feld=`<form class="eingabe" id="eform" autocomplete="off"><input id="antwort" autocapitalize="off" autocorrect="off" spellcheck="false" ${fertig?"disabled":""} value="${fertig?esc(Q.auswahl):""}" aria-label="Antwort">
     ${q.einheit?`<span class="einheit">${q.einheit}</span>`:""}${fertig?"":`<button class="btn" type="submit">Prüfen</button>`}</form>${tipp&&!fertig?`<p class="tipp">${tipp}</p>`:""}`}
  const lob=letzte&&letzte.ok?pick(LOB)+(Q.serie>=3?` 🔥 ${Q.serie} richtig hintereinander!`:""):"";
  const rueck=fertig&&q.typ!=="karte"&&!Q.helfer?`<div class="rueck ${letzte.ok?"ok":"no"} pop"><strong>${letzte.ok?lob:q.typ==="paare"?`${Q.pf} Fehlversuche – das üben wir nochmal.`:"Leider falsch."}</strong>
     ${letzte.ok?"":`<span>Richtig ist: <b>${loesungText(q)}</b></span>`}${q.erkl?`<span>${q.erkl}</span>`:""}</div>
     <div class="row"><button class="btn" data-act="weiter" id="weiterbtn">${Q.i+1<Q.fragen.length?"Weiter":"Auswertung"}</button>${!letzte.ok&&!KEINE_HILFE.includes(q.typ)?`<button class="btn ghost small" data-act="hilfeauf">🦉 Hilfe</button>`:""}</div>`:"";
  const titel=Q.modus==="probe"?"Probe":Q.modus==="heute"?"Heute dran":Q.modus==="vorb"?"Probe vorbereiten":Q.modus==="plan"?"Wochenend-Plan":Q.modus==="fehler"?"Fehler üben":t.titel;

   ${Q.helfer?tutorHTML(Q.helfer):""}</div>`}

const KOMMENTAR={1:"Hervorragend! So kannst du in die Probe gehen.",2:"Sehr ordentlich! Mit ein bisschen Wiederholung wird es eine Eins.",3:"Solide Arbeit. Einige Dinge sitzen noch nicht ganz – schau sie dir nochmal an.",4:"Da fehlt noch einiges. Übe die markierten Themen nochmal Schritt für Schritt.",5:"Hier musst du noch viel üben. Fang mit den Hefteinträgen an und mach dann die leichteren Übungen.",6:"Nicht aufgeben! Wir gehen alles nochmal in Ruhe durch."};
function vErgebnis(){
  const e=ergebnis(),zaehlt=Q.antworten.filter(a=>!a.q.leicht&&!a.q.wieder),falsch=zaehlt.filter(a=>!a.ok),probe=Q.modus==="probe";
  const farbe=Q.modus==="heute"?"var(--mathe)":fach(thema(Q.fragen[0].themaId).fach).farbe;
  const proThema={};zaehlt.forEach(a=>{(proThema[a.q.themaId]??=[]).push(a.ok)});
  const kann=Object.entries(proThema).filter(([,a])=>a.every(Boolean)).map(([id])=>thema(id).titel),noch=Object.entries(proThema).filter(([,a])=>!a.every(Boolean)).map(([id])=>id);
  const wieder=Q.antworten.filter(a=>a.q.wieder),wr=wieder.filter(a=>a.ok).length;
  let kopf;
  if(probe){const rw=zaehlt.some(a=>a.q.typ==="weg"&&!a.ok),rs=zaehlt.some(a=>/Rechtschreib|Großschreibung/.test(a.hinweis||""));
    kopf=`<p class="eyebrow">Probe · ${datumKurz(tag())}</p><div class="row" style="gap:18px;align-items:center">${noteHTML(e.note)}<p><b>${String(e.p).replace(".",",")} von ${e.max} Punkten</b><br>(${e.prozent} %)</p></div>${schluesselHTML(e.max,e.p,e.note)}
     <div class="lehrer"><b>Kommentar der Lehrkraft:</b> ${KOMMENTAR[e.note]}${rw?" Achte auf einen vollständigen <b>Rechenweg</b> – jeder Schritt zählt.":""}${rs?" Achte auf die <b>Rechtschreibung</b>.":""}</div>`}
  else kopf=`<h2>${Q.modus==="heute"?"Geschafft für heute!":Q.modus==="plan"?"Aufgabe aus dem Plan geschafft! ✅":Q.modus==="vorb"?`${PROBEN[Q.probeIdx].titel}: Runde geschafft!`:Q.modus==="fehler"?"Fehler-Runde geschafft!":thema(Q.themaId).titel}</h2>
     <div class="row" style="gap:18px;align-items:center">${noteHTML(e.note)}<p><b>${e.p} von ${e.max}</b> beim ersten Versuch richtig (${e.prozent} %)<br>${NOTENTEXT[e.note]}</p></div>
     ${wieder.length?`<p>🔁 Beim zweiten Versuch: <b>${wr} von ${wieder.length}</b> richtig.${wr===wieder.length?" Super, du hast aus deinen Fehlern gelernt!":""}</p>`:""}
     ${Q.wiederholung?`<p>⭐ Du konntest in diesem Thema schon alles – das war eine Wiederholung zur Sicherheit.</p>`:""}`;
  const fazit=`${kann.length?`<p>✅ <b>Das kannst du schon:</b> ${kann.join(", ")}</p>`:""}${noch.length?`<p>📌 <b>Das üben wir nochmal:</b> ${noch.map(id=>thema(id).titel).join(", ")}</p>`:""}`;
  const liste=(probe?zaehlt:falsch).map(a=>`<div class="eintrag ${a.ok?"ok":""}">${probe?`<div class="punkte">${String(a.p).replace(".",",")} / ${a.max} P.</div>`:""}<div>${a.q.frage}</div>
    <div>${a.ok?"✓ richtig":`${["karte","paare"].includes(a.q.typ)||a.wert===""?"":`✗ Deine Antwort: ${esc(Array.isArray(a.wert)?a.wert.join(" | "):a.wert)} · `}Richtig: <b>${a.q.typ==="weg"?a.q.schritte.map(s=>Z(String(s[1]).replace(".",","))).join(" → "):loesungText(a.q)}</b>`}</div>
    ${a.hinweis?`<div class="muted">${a.hinweis}</div>`:""}${!a.ok&&a.q.erkl?`<div class="muted">${a.q.erkl}</div>`:""}</div>`).join("");
  const zurueck=["heute","plan","fehler"].includes(Q.modus)?"":`<button class="btn ghost" data-go="fach" data-fach="${thema(Q.fragen[0].themaId).fach}">Zurück zum Fach</button>`;
  Q.falschKids=[...new Set(falsch.map(a=>a.q.kid).filter(Boolean))];
  const nochmal=Q.modus==="heute"?(heuteDran().length?`<button class="btn" data-act="heute">Weitere Fragen</button>`:""):Q.modus==="plan"?"":`<button class="btn" data-act="nochmal">Nochmal</button>`;
  return `<div style="--fach:${farbe};display:flex;flex-direction:column;gap:16px">
   <section class="ergebnis">${kopf}${fazit}<div class="row">${Q.falschKids.length?`<button class="btn" data-act="fehlerueben">Meine Fehler üben (${Q.falschKids.length})</button>`:""}${nochmal}${zurueck}<button class="btn ghost" data-go="start">Startseite</button></div></section>
   ${liste?`<section class="liste"><h3>${probe?"Deine korrigierte Probe":"Das schaust du dir nochmal an"}</h3>${liste}</section>`:""}</div>`}

/* ---------- Wochenend-Plan ---------- */
function wochenplanHTML(){
  const tage=WOCHENPLAN.filter(d=>d.datum>=tag());if(!tage.length)return "";
  const alle=WOCHENPLAN.flatMap(d=>d.aufgaben),fertig=alle.filter(a=>S.plan[a.id]).length;
  return `<section class="wplan"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">Dein Wochenend-Plan</p><h2>${WOCHENPLAN_TITEL}</h2></div><span class="notenpill">${fertig} von ${alle.length} erledigt</span></div>
   <div class="balken" style="--fach:var(--ok)"><i style="width:${Math.round(100*fertig/alle.length)}%"></i></div>
   ${tage.map(d=>`<div class="wtag ${d.datum===tag()?"heute-tag":""}"><h3>${d.titel}${d.datum===tag()?` <span class="badge heft-q">heute</span>`:""}</h3>
     ${d.aufgaben.map(a=>{const ok=S.plan[a.id],f=fach(thema(a.themen[0]).fach);return `<div class="waufg ${ok?"erledigt":""}" style="--fach:${f.farbe}"><span class="haken" aria-hidden="true">${ok?"✓":""}</span>
       <div class="t"><b>${a.text}</b><span class="muted">${f.name} · ${a.probe?"Probe mit Note":`${a.n} Aufgaben`}${a.info?` · ${a.info}`:""}</span></div>
       <button class="btn small ${ok?"ghost":""}" data-act="plan" data-plan="${a.id}">${ok?"Nochmal":"Start"}</button></div>`}).join("")}</div>`).join("")}
  </section>`}

function render(){
  let h;if(Q)h=vQuiz();else if(V.seite==="fach")h=vFach();else if(V.seite==="merke")h=vMerke();else if(V.seite==="noten")h=vNoten();else if(V.seite==="stundenplan")h=vStundenplan();else if(V.seite==="kalender")h=vKalender();else if(V.seite==="sparbuch")h=vSparbuch();else h=vDashboard();
  const weit=!Q&&(V.seite==="start"||V.seite==="kalender");
  app.innerHTML=Q?`<div class="inhalt">${h}</div>`:`<div class="layout">${seitenleisteHTML()}<main class="inhalt ${weit?"weit":""}">${h}</main></div>`;
  const sf=document.getElementById("sform");if(sf)sf.addEventListener("submit",e=>{e.preventDefault();const v=parseZahl(document.getElementById("sbetrag").value);const fld=document.getElementById("sbetrag");
    if(v===null||v<=0){fld.focus();fld.classList.add("fehler");return}const art=(sf.querySelector("input[name=sart]:checked")||{}).value||"geschenk";
    S.spar.buchungen.push({id:"s"+Date.now().toString(36),datum:document.getElementById("sdatum").value||tag(),betrag:art==="ausgabe"?-v:v,art,text:document.getElementById("stext").value.trim()});speichern();render()});
  const zf=document.getElementById("zform");if(zf)zf.addEventListener("submit",e=>{e.preventDefault();const n=document.getElementById("zname").value.trim(),v=parseZahl(document.getElementById("zbetrag").value);
    S.spar.ziel=n&&v>0?{name:n,betrag:v}:null;speichern();render()});
  const nf=document.getElementById("nform");if(nf)nf.addEventListener("submit",e=>{e.preventDefault();const t=document.getElementById("ntext").value.trim();if(!t)return;
    S.notizen.push({id:Date.now().toString(36),text:t,datum:document.getElementById("ndatum").value||"",erledigt:false});speichern();render();const n2=document.getElementById("ntext");if(n2)n2.focus()});
  const inp=document.getElementById("antwort");if(inp&&!inp.disabled)inp.focus({preventScroll:true});
  if(!Q||!Q.helfer)for(const id of["weiterbtn","aufdeckbtn"]){const b=document.getElementById(id);if(b)b.focus({preventScroll:true})}
  const form=document.getElementById("eform");if(form)form.addEventListener("submit",e=>{e.preventDefault();if(inp.value.trim())antworten(inp.value)});
  const wf=document.getElementById("wform");if(wf){const ins=[...wf.querySelectorAll("input")];if(ins[0]&&!ins[0].disabled&&!Q.helfer)ins[0].focus({preventScroll:true});
    wf.addEventListener("submit",e=>{e.preventDefault();const w=ins.map(i=>i.value.trim());const leer=ins.find(i=>!i.value.trim());if(leer){leer.focus();return}antworten(w)})}
  const lb=document.getElementById("leichtbtn");if(lb)lb.focus({preventScroll:true})}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.go){go(d.go,{fach:d.fach,thema:d.thema});return}
  if(d.opt!==undefined&&Q){antworten(Q.fragen[Q.i].optionen[+d.opt]);return}
  if(d.pl!==undefined&&Q){Q.sel=+d.pl;Q.fehlPaar=null;render();return}
  if(d.pr!==undefined&&Q){if(Q.sel===null)return;const r=+d.pr;
    if(r===Q.sel){Q.fertigPaare.push(r);Q.sel=null;Q.fehlPaar=null;if(Q.fertigPaare.length===Q.fragen[Q.i].paare.length){antworten(Q.pf);return}}
    else{Q.pf++;Q.fehlPaar=[Q.sel,r];Q.sel=null}render();return}
  if(d.w!==undefined&&Q){Q.bau.push(+d.w);render();return}
  if(d.bau!==undefined&&Q){Q.bau.splice(+d.bau,1);render();return}
  switch(d.act){
   case"heute":starte("heute");break;
   case"woche":V.woche=+d.w;render();break;
   case"tgheute":{const an=!S.spar.buchungen.some(b=>b.id==="tg-"+tag());taschengeldBuchen(an);const f=S.erledigt[tag()]||(S.erledigt[tag()]={});f.taschengeld=an;speichern();render();break}
   case"sloeschen":{S.spar.buchungen=S.spar.buchungen.filter(b=>b.id!==d.s);const m=String(d.s).match(/^tg-(.+)$/);if(m&&S.erledigt[m[1]])S.erledigt[m[1]].taschengeld=false;speichern();render();break}
   case"sprich":if(!sprich(d.t,d.langsam))b.title="Vorlesen geht auf diesem Gerät leider nicht";break;
   case"ellaweiter":ellaZeige(ellaIdx+1);break;
   case"aufgabe":{if(d.a.startsWith("todo-")){const id=d.a.slice(5);S.todo[id]=!S.todo[id];speichern();render();break}
     const iso=tag();const f=S.erledigt[iso]||(S.erledigt[iso]={});f[d.a]=!f[d.a];if(d.a==="taschengeld")taschengeldBuchen(f[d.a]);
     for(const k of Object.keys(S.erledigt))if(tageBis(k)<-14)delete S.erledigt[k];speichern();render();break}
   case"nerledigt":{const n=S.notizen.find(x=>x.id===d.n);if(n){n.erledigt=!n.erledigt;speichern();render()}break}
   case"nloeschen":S.notizen=S.notizen.filter(x=>x.id!==d.n);speichern();render();break;
   case"vorb":starte("vorb",{probeIdx:+d.probe});break;
   case"plan":{const a=WOCHENPLAN.flatMap(x=>x.aufgaben).find(x=>x.id===d.plan);if(a.probe)starte("probe",{themaIds:a.themen,fachId:a.fach,planId:a.id});else starte("plan",{themaIds:a.themen,n:a.n,planId:a.id});break}
   case"leichter":{const h=Q.helfer,q=Q.fragen[Q.i];const l=leichtMark(Object.assign({},h.leicht,{themaId:q.themaId},q.sprichVorher&&!h.leicht.meta?{sprich:q.sprich,sprichVorher:true}:{}));Q.fragen.splice(Q.i+1,0,l);Q.helfer=null;weiter();break}
   case"tutorzu":Q.helfer=null;render();break;
   case"hilfeauf":{const a=Q.antworten[Q.antworten.length-1];Q.helfer=helfer(a.q,a.wert);render();break}
   case"fehlerueben":{const kids=Q.falschKids;starte("fehler",{kids});break}
   case"ueben":starte("ueben",{themaId:d.thema});break;
   case"probe":{const ids=[...document.querySelectorAll(".chips input:checked")].map(i=>i.value);if(ids.length)starte("probe",{themaIds:ids,fachId:d.fach});break}
   case"satzpruefen":{const q=Q.fragen[Q.i];antworten(Q.bau.map(i=>q.woerter[i]).join(" "));break}
   case"satzleeren":Q.bau=[];render();break;
   case"aufdecken":Q.aufgedeckt=true;render();break;
   case"gewusst":antworten(true);break;
   case"nichtgewusst":antworten(false);break;
   case"weiter":weiter();break;
   case"abbrechen":{const t=thema(Q.fragen[Q.i].themaId);const m=Q.modus;Q=null;if(["heute","vorb","plan","fehler"].includes(m))go("start");else go("fach",{fach:t.fach});break}
   case"nochmal":{const {modus,themaId,themaIds,fachId,probeIdx,kids,n}=Q;starte(modus,{themaId,themaIds,fachId,probeIdx,kids,n});break}
  }});
// Lernzeit messen: zählt, solange eine Übung offen ist und Maja in den letzten 2 Minuten etwas getan hat
let aktivZuletzt=Date.now();["click","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{aktivZuletzt=Date.now()},true));
setInterval(()=>{if(Q&&!Q.fertig&&document.visibilityState==="visible"&&Date.now()-aktivZuletzt<120000){S.lernzeit[tag()]=(S.lernzeit[tag()]||0)+15;
  for(const k of Object.keys(S.lernzeit))if(tageBis(k)<-30)delete S.lernzeit[k];speichern()}},15000);
render();
</script>
