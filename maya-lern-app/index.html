<style>
/* Layout: Schulheft-Stapel. Jedes Fach hat seine Heftfarbe, Mathe auf Karopapier, sonst Linien. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --fg:#1d2433; --muted:#5d6678; --line:#dfe3ec;
  --paper:#fffef9; --paper-line:#cfdcef; --paper-margin:#f1a8a8;
  --ok:#1f8a4c; --ok-bg:#e3f5ea; --bad:#c23b3b; --bad-bg:#fbe7e7;
  --mathe:#2f6fd6; --deutsch:#d64545; --englisch:#b88700; --nt:#2e9e5b; --gpg:#e07a1f;
  --star:#f2b705; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141824; --surface:#1d2231; --fg:#e8ebf3; --muted:#a2a9ba; --line:#2f364a;
  --paper:#1f2434; --paper-line:#2f3a55; --paper-margin:#6e3a44;
  --ok:#5fd394; --ok-bg:#173527; --bad:#ff8a8a; --bad-bg:#3b1d22;
  --mathe:#6c9ef0; --deutsch:#f07777; --englisch:#f0c445; --nt:#5cc98a; --gpg:#f3a25c;
  --star:#f7c948; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1d2231; --fg:#e8ebf3; --muted:#a2a9ba; --line:#2f364a;
  --paper:#1f2434; --paper-line:#2f3a55; --paper-margin:#6e3a44;
  --ok:#5fd394; --ok-bg:#173527; --bad:#ff8a8a; --bad-bg:#3b1d22;
  --mathe:#6c9ef0; --deutsch:#f07777; --englisch:#f0c445; --nt:#5cc98a; --gpg:#f3a25c;
  --star:#f7c948; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.55rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--fach,var(--mathe));outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--fach,var(--mathe));color:#fff;font-size:1rem;min-height:48px}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.small{padding:8px 14px;min-height:40px;font-size:.95rem}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;align-self:flex-start}
/* Kopf */
.kopf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:96px}
.stat b{font-family:var(--f-display);font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* Heute dran */
.heute{--fach:var(--mathe);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:3px solid var(--fach)}
.heute .zahl{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--fach);font-variant-numeric:tabular-nums}
.heute .t{display:flex;gap:16px;align-items:center;min-width:0;flex:1 1 260px}
.proben{display:flex;flex-direction:column;gap:8px}
.probe-zeile{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);border-left:6px solid var(--fach)}
.probe-zeile .tage{font-family:var(--f-display);font-weight:800;font-size:1.2rem;min-width:5.5em;font-variant-numeric:tabular-nums}
/* Hefte */
.hefte{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.heft{position:relative;text-align:left;border:0;background:var(--surface);border-radius:6px 14px 14px 6px;padding:18px 16px 16px 30px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:140px;overflow:hidden}
.heft::before{content:"";position:absolute;inset:0 auto 0 0;width:16px;background:var(--fach)}
.heft .kurz{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--fach);line-height:1}
.heft .name{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.heft .info{font-size:.9rem;color:var(--muted);margin-top:auto}
.heft.leer{opacity:.75}
.balken{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.balken i{display:block;height:100%;background:var(--fach,var(--mathe));border-radius:99px;transition:width .3s}
/* Fachseite */
.fachkopf{border-left:10px solid var(--fach);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.themen{display:flex;flex-direction:column;gap:10px}
.thema{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.thema .t{min-width:0;flex:1 1 220px;display:flex;flex-direction:column;gap:4px}
.badge{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted)}
.badge.heft-q{border-color:var(--fach);color:var(--fach)}
.leerhinweis{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow);border:2px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.probe{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border:2px dashed var(--fach)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:700;cursor:pointer;user-select:none}
.chip:has(input:checked){border-color:var(--fach);background:color-mix(in srgb,var(--fach) 12%,transparent)}
.chip input{accent-color:var(--fach);margin:0}
/* Hefteintrag */
.papier{background:var(--paper);border-radius:4px;box-shadow:var(--shadow);padding:22px 20px 26px 44px;position:relative;line-height:32px;
  background-image:linear-gradient(var(--paper-line) 1px,transparent 1px);background-size:100% 32px;background-position:0 21px}
.papier::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--paper-margin)}
.papier.karo{background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);background-size:16px 16px;background-position:0 0}
.papier h2{color:var(--fach);line-height:32px}
.papier h3{line-height:32px;margin-top:8px}
.papier ul{margin:0;padding-left:22px}
.papier .merk{border:2px solid var(--fach);border-radius:8px;padding:0 12px;background:color-mix(in srgb,var(--paper) 85%,var(--fach));margin:8px 0;line-height:32px}
.papier table{border-collapse:collapse;margin:6px 0;font-size:.95rem;line-height:1.4}
.papier td,.papier th{border:1px solid var(--paper-line);padding:4px 8px;text-align:left;background:var(--paper)}
.tabwrap{overflow-x:auto}
/* Bruch */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 3px;font-variant-numeric:tabular-nums;font-weight:800}
.frac>span:first-child{border-bottom:2px solid currentColor}
.frac>span{padding:0 3px}
/* Quiz */
.quizkopf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.karte{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:18px;border-top:8px solid var(--fach)}
.karte .fachzeile{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--fach)}
.frage{font-size:1.3rem;font-weight:700;line-height:1.55}
.frage .lueck{display:inline-block;min-width:60px;border-bottom:3px solid var(--fach)}
.optionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;font-size:1.05rem;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--fach)}
.opt.richtig{border-color:var(--ok);background:var(--ok-bg)}
.opt.falsch{border-color:var(--bad);background:var(--bad-bg)}
.eingabe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eingabe input{font:inherit;font-size:1.3rem;font-weight:800;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);flex:1 1 180px;min-width:0}
.eingabe .einheit{font-weight:800;font-size:1.2rem}
.tipp{font-size:.88rem;color:var(--muted)}
.antwortkarte{background:var(--bg);border-radius:12px;padding:14px;border-left:6px solid var(--fach);font-weight:600}
.rueck{border-radius:12px;padding:12px 14px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.rueck.ok{background:var(--ok-bg);border-left:6px solid var(--ok)}
.rueck.no{background:var(--bad-bg);border-left:6px solid var(--bad)}
.rueck strong{font-family:var(--f-display);font-size:1.15rem}
/* Ergebnis */
.ergebnis{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;border-top:8px solid var(--fach)}
.note{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--fach)}
.liste{display:flex;flex-direction:column;gap:10px;width:100%}
.liste .eintrag{border-left:5px solid var(--bad);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.liste .eintrag.ok{border-left-color:var(--ok)}
.fuss{font-size:.85rem;color:var(--muted);text-align:center}
@media (max-width:480px){h1{font-size:1.75rem}.frage{font-size:1.15rem}.papier{padding-left:38px}.papier::before{left:24px}.heute .zahl{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
</style>

<div id="app"></div>

<script>
/* ================================================================
   HILFSFUNKTIONEN
   ================================================================ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ggT=(a,b)=>b?ggT(b,a%b):Math.abs(a);
const kgV=(a,b)=>a*b/ggT(a,b);
const F=(z,n)=>`<span class="frac"><span>${z}</span><span>${n}</span></span>`;
const Z=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const L=`<span class="lueck">&nbsp;</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Aufgabentypen
   mc(frage, richtig, [falsche], erklärung)        → Auswahl
   text(frage, [richtige Antworten], erkl, tipp)   → eintippen (Groß/klein egal)
   zahl(frage, wert, erkl, einheit)                → Zahl eintippen
   bruch(frage, z, n, modus, erkl)                 → Bruch eintippen (gleich | gekuerzt | genau)
   karte(frage, antwort)                           → Karteikarte: umdrehen, selbst bewerten */
const mc=(frage,richtig,falsche,erkl)=>({typ:"mc",frage,loesung:richtig,optionen:[richtig,...falsche],erkl});
const text=(frage,loesungen,erkl,tipp)=>({typ:"text",frage,loesung:[].concat(loesungen),erkl,tipp});
const zahl=(frage,wert,erkl,einheit)=>({typ:"zahl",frage,loesung:wert,erkl,einheit});
const bruch=(frage,z,n,modus,erkl)=>({typ:"bruch",frage,loesung:[z,n],modus,erkl});
const karte=(frage,antwort)=>({typ:"karte",frage,antwort});
/* Vokabelliste → Karten: Deutsch→Englisch eintippen, Englisch→Deutsch auswählen */
function vokabeln(liste,richtung="beide"){
  const k=[];liste.forEach(([de,en],i)=>{const ens=[].concat(en);
    k.push(text(`Wie schreibt man <b>„${de}“</b> auf Englisch?`,ens,`${de} = <b>${ens.join(" / ")}</b>`,"Achte auf die Schreibweise!"));
    if(richtung==="beide"){const falsche=[1,2,3].map(d=>liste[(i+d*3)%liste.length][0]).filter(x=>x!==de);
      k.push(mc(`Was heißt <b>„${ens[0]}“</b> auf Deutsch?`,de,[...new Set(falsche)],`${ens[0]} = ${de}`))}});
  return k}

/* ================================================================
   FÄCHER
   ================================================================ */
const FAECHER=[
 {id:"mathe",name:"Mathe",kurz:"M",farbe:"var(--mathe)",papier:"karo"},
 {id:"deutsch",name:"Deutsch",kurz:"D",farbe:"var(--deutsch)",papier:"linien"},
 {id:"englisch",name:"Englisch",kurz:"E",farbe:"var(--englisch)",papier:"linien"},
 {id:"nt",name:"Natur & Technik",kurz:"NT",farbe:"var(--nt)",papier:"linien"},
 {id:"gpg",name:"GPG",kurz:"GPG",farbe:"var(--gpg)",papier:"linien"},
];

/* ================================================================
   THEMEN – kommen aus Majas Heften, Büchern und Arbeitsblättern.
   quelle: woher der Stoff kommt ("Beispiel" = noch nicht aus Majas Unterlagen)
   probe:  Datum der Probe "JJJJ-MM-TT" (optional, dann erscheint ein Countdown)
   Neue Karten immer HINTEN anhängen, damit der Lernstand erhalten bleibt.
   ================================================================ */
const THEMEN=[
/* ---------------------------------------------------------------- DEUTSCH */
{id:"d-praesens",fach:"deutsch",titel:"Das Präsens",quelle:"Beispiel",probe:null,
 merke:`<h2>Das Präsens (Gegenwart)</h2>
 <h3>Wann verwendet man das Präsens?</h3>
 <ul><li>Was <b>gerade jetzt</b> passiert: <i>Maja liest gerade ein Buch.</i></li>
 <li>Was <b>regelmäßig</b> passiert: <i>Ich gehe jeden Tag zur Schule.</i></li>
 <li>Was <b>immer gilt</b>: <i>Die Erde dreht sich um die Sonne.</i></li>
 <li>Mit Zeitangabe auch für die <b>Zukunft</b>: <i>Morgen schreiben wir eine Probe.</i></li></ul>
 <h3>Wie bildet man das Präsens?</h3>
 <div class="merk"><b>Wortstamm + Personalendung</b></div>
 <div class="tabwrap"><table><tr><th>Person</th><th>spielen</th><th>Endung</th></tr>
 <tr><td>ich</td><td>spiel<b>e</b></td><td>-e</td></tr><tr><td>du</td><td>spiel<b>st</b></td><td>-st</td></tr>
 <tr><td>er / sie / es</td><td>spiel<b>t</b></td><td>-t</td></tr><tr><td>wir</td><td>spiel<b>en</b></td><td>-en</td></tr>
 <tr><td>ihr</td><td>spiel<b>t</b></td><td>-t</td></tr><tr><td>sie</td><td>spiel<b>en</b></td><td>-en</td></tr></table></div>
 <p>Achtung: Manche Verben ändern bei <b>du</b> und <b>er/sie/es</b> den Selbstlaut: laufen → du l<b>ä</b>ufst, lesen → er l<b>ie</b>st, essen → du <b>i</b>sst, fahren → du f<b>ä</b>hrst</p>`,
 karten:[
  karte("Was ist das Präsens?","Das Präsens ist die <b>Gegenwartsform</b> eines Verbs. Es zeigt, was jetzt passiert, was regelmäßig passiert oder was immer gilt."),
  mc("Wofür verwendet man das Präsens?","für das, was jetzt passiert oder immer gilt",["nur für Dinge, die gestern passiert sind","nur für Befehle","nur in Gedichten"],"Das Präsens ist die Gegenwart: jetzt, regelmäßig, immer."),
  karte("Nenne die vier Situationen, in denen man das Präsens verwendet.","1. was gerade passiert<br>2. was regelmäßig passiert<br>3. was immer gilt<br>4. mit Zeitangabe für die Zukunft (<i>Morgen fahren wir …</i>)"),
  mc("In welchem Satz steht das Präsens?","Maja liest ein Buch.",["Maja las ein Buch.","Maja hat ein Buch gelesen.","Maja wird ein Buch lesen."],"„liest“ ist Gegenwart. Die anderen: Präteritum, Perfekt, Futur."),
  mc("„Die Erde dreht sich um die Sonne.“ Warum steht dieser Satz im Präsens?","weil es immer gilt",["weil es gestern passiert ist","weil es ein Befehl ist","weil es nur einmal passiert"],"Allgemeine Wahrheiten stehen im Präsens."),
  mc("„Morgen schreiben wir eine Probe.“ Wann passiert das?","in der Zukunft",["jetzt gerade","in der Vergangenheit","jeden Tag"],"Das Verb steht im Präsens, aber „morgen“ zeigt: Es geht um die Zukunft."),
  karte("Wie bildet man das Präsens?","<b>Wortstamm + Personalendung</b><br>ich spiel-e, du spiel-st, er spiel-t, wir spiel-en, ihr spiel-t, sie spiel-en"),
  text(`Setze ins Präsens: du ${L} (laufen)`,["du läufst","läufst"],"laufen → du l<b>ä</b>ufst (a wird zu ä)"),
  text(`Setze ins Präsens: er ${L} (lesen)`,["er liest","liest"],"lesen → er l<b>ie</b>st"),
  text(`Setze ins Präsens: ihr ${L} (spielen)`,["ihr spielt","spielt"],"ihr → Endung -t: ihr spielt"),
  text(`Setze ins Präsens: sie (eine Person) ${L} (essen)`,["sie isst","isst"],"essen → sie <b>i</b>sst (mit ss)"),
  text(`Setze ins Präsens: du ${L} (fahren)`,["du fährst","fährst"],"fahren → du f<b>ä</b>hrst"),
  text(`Setze ins Präsens: es ${L} (geben)`,["es gibt","gibt"],"geben → es g<b>i</b>bt"),
  mc("Setze ins Präsens: „Wir gingen nach Hause.“","Wir gehen nach Hause.",["Wir sind nach Hause gegangen.","Wir werden nach Hause gehen.","Wir gangen nach Hause."],"gingen (Präteritum) → gehen (Präsens)"),
  mc("Welche Endung hat das Verb bei „du“ im Präsens?","-st",["-t","-e","-en"],"du spiel<b>st</b>, du mach<b>st</b>"),
  mc("Welches deutsche Wort passt zu „Präsens“?","Gegenwart",["Vergangenheit","Zukunft","Befehlsform"],"Präsens = Gegenwart"),
 ]},

/* ---------------------------------------------------------------- ENGLISCH */
{id:"e-home",fach:"englisch",titel:"Vocabulary: At home",quelle:"Beispiel",probe:null,
 merke:`<h2>At home</h2>
 <div class="tabwrap"><table>
 <tr><td>washing machine</td><td>Waschmaschine</td></tr><tr><td>fridge</td><td>Kühlschrank</td></tr>

 <div class="merk">Schwierige Wörter: cu<b>p</b>board (das p hört man nicht!), w<b>a</b>rdrobe, sh<b>e</b>lf</div>`,
 karten:vokabeln([["die Waschmaschine","washing machine"],["der Kühlschrank",["fridge","refrigerator"]],["die Spülmaschine","dishwasher"],["der Herd",["cooker","stove"]],
  ["der Staubsauger",["vacuum cleaner","hoover"]],["der (Küchen-)Schrank","cupboard"],["der Kleiderschrank","wardrobe"],["das Regal","shelf"],["die Treppe","stairs"],
  ["die Küche","kitchen"],["das Badezimmer","bathroom"],["das Wohnzimmer","living room"],["das Schlafzimmer","bedroom"],["aufräumen","to tidy up"],
  ["abspülen",["to do the washing-up","to wash up","to do the dishes"]],["den Tisch decken",["to lay the table","to set the table"]]])},

/* ---------------------------------------------------------------- MATHE */
{id:"m-brueche",fach:"mathe",titel:"Brüche addieren & subtrahieren",quelle:"Beispiel",probe:null,
 merke:`<h2>Brüche addieren und subtrahieren</h2>
 <h3>Gleicher Nenner (gleichnamig)</h3>
 <div class="merk">Nenner bleibt gleich, nur die <b>Zähler</b> rechnen.</div>
 <p>${F(1,4)} + ${F(1,4)} = ${F(2,4)} = ${F(1,2)} &nbsp;&nbsp; ${F(1,3)} + ${F(1,3)} = ${F(2,3)}</p>
 <h3>Verschiedene Nenner (ungleichnamig)</h3>
 <div class="merk">1. <b>Hauptnenner</b> suchen (kleinste Zahl, in der beide Nenner stecken)<br>2. Beide Brüche darauf <b>erweitern</b><br>3. Zähler rechnen, am Ende <b>kürzen</b></div>
 <p>${F(1,3)} + ${F(1,4)}: Hauptnenner 12 → ${F(4,12)} + ${F(3,12)} = ${F(7,12)}</p>`,
 slots:8,
 gen(){const art=R(0,3);
  const kurz=(z,n)=>{if(z%n===0)return ` = ${z/n}`;const g=ggT(z,n);return g>1?` = ${F(z/g,n/g)} (gekürzt)`:""};
  if(art===0){const n=R(2,12),a=R(1,n-1),b=R(1,n-1);return bruch(`${F(a,n)} + ${F(b,n)} = ?`,a+b,n,"gleich",`Gleicher Nenner: ${a} + ${b} = ${a+b} → ${F(a+b,n)}${kurz(a+b,n)}`)}
  if(art===1){const n=R(3,12),a=R(2,n),b=R(1,a-1);return bruch(`${F(a,n)} − ${F(b,n)} = ?`,a-b,n,"gleich",`Gleicher Nenner: ${a} − ${b} = ${a-b} → ${F(a-b,n)}${kurz(a-b,n)}`)}
  let n1,n2,a,b,H;do{n1=R(2,8);n2=R(2,8);a=R(1,n1-1);b=R(1,n2-1);H=kgV(n1,n2)}while(n1===n2||H>24||(art===3&&a*n2<=b*n1));
  const x=a*H/n1,y=b*H/n2,plus=art===2,erg=plus?x+y:x-y;
  return bruch(`${F(a,n1)} ${plus?"+":"−"} ${F(b,n2)} = ?`,erg,H,"gleich",`Hauptnenner ${H}: ${F(a,n1)} = ${F(x,H)}, ${F(b,n2)} = ${F(y,H)}. Dann ${x} ${plus?"+":"−"} ${y} = ${erg} → ${F(erg,H)}${kurz(erg,H)}`)}},
];

/* ================================================================
   SPEICHER (nur in diesem Browser) + Wiederholsystem (Lernkartei)
   Box 1–5: richtig → eine Box weiter (später wieder dran), falsch → zurück in Box 1.
   ================================================================ */
const KEY="maja-lernheft-v2";
let S={karten:{},heute:{datum:"",anzahl:0},serie:{letzter:"",tage:0}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const speichern=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const tag=(plus=0)=>{const d=new Date();d.setDate(d.getDate()+plus);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
if(S.heute.datum!==tag())S.heute={datum:tag(),anzahl:0};
const ABSTAND=[0,1,2,4,7,14]; // Tage bis zur nächsten Abfrage je Box

const fach=id=>FAECHER.find(f=>f.id===id);
const thema=id=>THEMEN.find(t=>t.id===id);
const themenVon=fid=>THEMEN.filter(t=>t.fach===fid);
function kartenVon(t){
  if(t.gen)return Array.from({length:t.slots||6},(_,k)=>({id:`${t.id}~${k}`,t,make:()=>t.gen()}));
  return t.karten.map((q,i)=>({id:`${t.id}#${i}`,t,make:()=>q}))}
const alleKarten=()=>THEMEN.flatMap(kartenVon);
const stand=id=>S.karten[id];
const istFaellig=k=>{const s=stand(k.id);return !s||s.faellig<=tag()};
const sitzt=k=>{const s=stand(k.id);return s&&s.box>=3};
const tageBis=d=>Math.round((new Date(d+"T12:00")-new Date(tag()+"T12:00"))/864e5);
function bewerte(kid,ok){
  const s=S.karten[kid]||{box:0};s.box=ok?Math.min(5,s.box+1):1;s.faellig=tag(ok?ABSTAND[s.box]:1);S.karten[kid]=s;
  S.heute.anzahl++;if(S.serie.letzter!==tag()){S.serie.tage=S.serie.letzter===tag(-1)?S.serie.tage+1:1;S.serie.letzter=tag()}
  speichern()}
function heuteDran(){
  // zuerst Themen mit naher Probe, dann schon gelernte (niedrige Box zuerst), dann neue
  const prio=k=>{const p=k.t.probe?tageBis(k.t.probe):99;const s=stand(k.id);return (p>=0&&p<=14?0:100)+(s?s.box:10)+Math.random()};
  return alleKarten().filter(istFaellig).sort((a,b)=>prio(a)-prio(b))}

/* ================================================================
   PRÜFEN
   ================================================================ */
const norm=s=>String(s).toLowerCase().trim().replace(/[’`´]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"")
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
const ohneArtikel=s=>s.replace(/^(the|a|an) /,"");
function parseZahl(s){s=String(s).trim().replace(/\s| |\./g,"").replace(",",".");if(!/^-?\d+(\.\d+)?$/.test(s))return null;return parseFloat(s)}
function parseBruch(s){s=String(s).trim().replace(/\s/g,"");let m=s.match(/^(\d+)\/(\d+)$/);if(m&&+m[2]>0)return[+m[1],+m[2]];m=s.match(/^(\d+)$/);if(m)return[+m[1],1];return null}
function pruefe(q,antwort){
  if(q.typ==="karte")return antwort===true;
  if(q.typ==="mc")return antwort===q.loesung;
  if(q.typ==="zahl"){const v=parseZahl(antwort);return v!==null&&Math.abs(v-q.loesung)<1e-9}
  if(q.typ==="bruch"){const b=parseBruch(antwort);if(!b)return false;const [z,n]=q.loesung;
    if(q.modus==="genau")return b[0]===z&&b[1]===n;const gleich=b[0]*n===z*b[1];return q.modus==="gekuerzt"?gleich&&ggT(b[0],b[1])===1:gleich}
  const a=norm(antwort);return q.loesung.some(l=>{const x=norm(l);return a===x||ohneArtikel(a)===ohneArtikel(x)})}
function loesungText(q){
  if(q.typ==="karte")return q.antwort;
  if(q.typ==="bruch"){const [z,n]=q.loesung;if(z%n===0)return String(z/n);const g=ggT(z,n);return g>1&&q.modus==="gleich"?`${F(z,n)} = ${F(z/g,n/g)}`:F(z,n)}
  if(q.typ==="zahl")return Z(String(q.loesung).replace(".",","))+(q.einheit?" "+q.einheit:"");
  if(q.typ==="text")return esc(q.loesung[0]);return q.loesung}

/* ================================================================
   ABFRAGE
   modus: heute (Wiederholen) | ueben (ein Thema) | probe (ohne Hilfe, mit Note)
   ================================================================ */
let Q=null;
function frageAus(k){const q=Object.assign({},k.make(),{kid:k.id,themaId:k.t.id});if(q.typ==="mc")q.optionen=shuffle(q.optionen);return q}
function starte(modus,opt={}){
  let karten;
  if(modus==="heute")karten=heuteDran().slice(0,15);
  else if(modus==="ueben")karten=shuffle(kartenVon(thema(opt.themaId))).slice(0,12);
  else karten=shuffle(opt.themaIds.flatMap(id=>kartenVon(thema(id)))).slice(0,20);
  if(!karten.length)return;
  Q=Object.assign({modus,fragen:karten.map(frageAus),i:0,antworten:[],beantwortet:false,aufgedeckt:false,auswahl:null},opt);render();window.scrollTo({top:0})}
function antworten(wert){
  if(!Q||Q.beantwortet)return;const q=Q.fragen[Q.i],ok=pruefe(q,wert);
  Q.antworten.push({q,wert,ok});Q.beantwortet=true;Q.auswahl=wert;bewerte(q.kid,ok);
  if(Q.modus==="probe"&&q.typ!=="karte"){weiter();return}
  if(q.typ==="karte"){weiter();return}
  render()}
function weiter(){Q.i++;Q.beantwortet=false;Q.aufgedeckt=false;Q.auswahl=null;if(Q.i>=Q.fragen.length)Q.fertig=true;render()}
const note=p=>p>=92?1:p>=81?2:p>=67?3:p>=50?4:p>=30?5:6;
const NOTENTEXT={1:"Sehr gut! Du bist bestens vorbereitet.",2:"Gut! Nur noch ein paar Kleinigkeiten.",3:"Befriedigend. Schau dir die Fehler nochmal an.",4:"Ausreichend. Lies den Hefteintrag nochmal und übe weiter.",5:"Da geht noch was! Übe die Themen einzeln.",6:"Nicht aufgeben! Fang mit dem Hefteintrag an und übe Schritt für Schritt."};

/* ================================================================
   ANSICHTEN
   ================================================================ */
let V={seite:"start"};
const app=document.getElementById("app");
function go(seite,daten={}){V=Object.assign({seite},daten);Q=null;render();window.scrollTo({top:0})}
const quelleBadge=t=>t.quelle==="Beispiel"?`<span class="badge">Beispiel</span>`:`<span class="badge heft-q">${esc(t.quelle)}</span>`;
const probeText=t=>{const d=tageBis(t.probe);return d===0?"heute":d===1?"morgen":`in ${d} Tagen`};

function vStart(){
  const dran=heuteDran().length,alle=alleKarten(),gelernt=alle.filter(sitzt).length;
  const proben=THEMEN.filter(t=>t.probe&&tageBis(t.probe)>=0).sort((a,b)=>a.probe<b.probe?-1:1);
  return `<header class="kopf"><div><p class="muted">Lernheft</p><h1>Hallo Maja!</h1></div>
   <div class="stats"><div class="stat"><b>${S.heute.anzahl}</b><span>heute gelöst</span></div>
   <div class="stat"><b>${S.serie.letzter>=tag(-1)?S.serie.tage:0}</b><span>Tage in Folge</span></div>
   <div class="stat"><b>${gelernt}<small class="muted">/${alle.length}</small></b><span>sitzt schon</span></div></div></header>
   <section class="heute">${dran?`<div class="t"><span class="zahl">${Math.min(dran,15)}</span><div><h2>Heute dran</h2><p class="muted">Fragen aus allen Fächern, die du heute wiederholen solltest.${dran>15?` Danach warten noch ${dran-15}.`:""}</p></div></div>
     <button class="btn" data-act="heute">Los geht's</button>`
    :`<div class="t"><span class="zahl">✓</span><div><h2>Alles erledigt für heute!</h2><p class="muted">Morgen kommen wieder Fragen dran. Du kannst unten trotzdem jedes Thema üben.</p></div></div>`}</section>
   ${proben.length?`<section class="proben"><h3>Nächste Proben</h3>${proben.map(t=>`<div class="probe-zeile" style="--fach:${fach(t.fach).farbe}"><span class="tage">${probeText(t)}</span><span><b>${fach(t.fach).name}:</b> ${t.titel}</span></div>`).join("")}</section>`:""}
   <section class="hefte">${FAECHER.map(f=>{const ts=themenVon(f.id),ks=ts.flatMap(kartenVon),s=ks.filter(sitzt).length;
     return `<button class="heft ${ts.length?"":"leer"}" style="--fach:${f.farbe}" data-go="fach" data-fach="${f.id}"><span class="kurz">${f.kurz}</span><span class="name">${f.name}</span>
      <span class="info">${ts.length?`${ts.length} Thema${ts.length===1?"":"en"} · ${s}/${ks.length} sitzt`:"Noch kein Thema"}</span><span class="balken"><i style="width:${ks.length?Math.round(100*s/ks.length):0}%"></i></span></button>`}).join("")}</section>
   <p class="fuss">Fragen, die du richtig hast, kommen nach ein paar Tagen wieder. Falsche kommen schon morgen wieder dran.<br>Dein Fortschritt wird nur auf diesem Gerät gespeichert.</p>`}

function vFach(){
  const f=fach(V.fach),ts=themenVon(f.id);
  return `<div style="--fach:${f.farbe};display:flex;flex-direction:column;gap:18px">
   <button class="back" data-go="start">← Startseite</button>
   <div class="fachkopf"><h1>${f.name}</h1><p class="muted">Lies zuerst den Hefteintrag, dann übe.</p></div>
   ${ts.length?`<section class="themen">${ts.map(t=>{const ks=kartenVon(t),s=ks.filter(sitzt).length;return `<div class="thema"><div class="t"><h3>${t.titel}</h3>
     <div class="row">${quelleBadge(t)}${t.probe&&tageBis(t.probe)>=0?`<span class="badge heft-q">Probe ${probeText(t)}</span>`:""}<span class="muted" style="font-size:.85rem">${s} von ${ks.length} sitzen</span></div>
     <div class="balken"><i style="width:${Math.round(100*s/ks.length)}%"></i></div></div>
     <div class="row"><button class="btn ghost small" data-go="merke" data-thema="${t.id}">Hefteintrag</button><button class="btn small" data-act="ueben" data-thema="${t.id}">Üben</button></div></div>`}).join("")}</section>
   <section class="probe"><h2>Probe-Training</h2><p>Wähle die Themen, die in der Probe drankommen. Du bekommst gemischte Aufgaben ohne Hilfe und am Ende eine Note.</p>
    <div class="chips">${ts.map(t=>`<label class="chip"><input type="checkbox" id="pt-${t.id}" value="${t.id}" checked> ${t.titel}</label>`).join("")}</div>
    <div><button class="btn" data-act="probe" data-fach="${f.id}">Probe starten</button></div></section>`
   :`<section class="leerhinweis"><h3>Hier ist noch nichts eingetragen.</h3><p class="muted">Sobald es Hefteinträge oder Arbeitsblätter aus ${f.name} gibt, kommen hier die passenden Fragen dazu.</p></section>`}</div>`}

function vMerke(){
  const t=thema(V.thema),f=fach(t.fach);
  return `<div style="--fach:${f.farbe};display:flex;flex-direction:column;gap:18px">
   <button class="back" data-go="fach" data-fach="${f.id}">← ${f.name}</button>
   <article class="papier ${f.papier==="karo"?"karo":""}">${t.merke}</article>
   <div class="row"><button class="btn" data-act="ueben" data-thema="${t.id}">Jetzt üben</button></div></div>`}

function vQuiz(){
  if(Q.fertig)return vErgebnis();
  const q=Q.fragen[Q.i],t=thema(q.themaId),f=fach(t.fach),fertig=Q.beantwortet,letzte=Q.antworten[Q.antworten.length-1];
  let feld="";
  if(q.typ==="karte"){
    feld=Q.aufgedeckt?`<div class="antwortkarte pop">${q.antwort}</div><p class="tipp">Sei ehrlich: Hast du das gewusst?</p>
      <div class="row"><button class="btn ok" data-act="gewusst">Gewusst</button><button class="btn bad" data-act="nichtgewusst">Nicht gewusst</button></div>`
     :`<p class="tipp">Überleg dir die Antwort oder sag sie laut. Dann dreh die Karte um.</p><div><button class="btn" data-act="aufdecken" id="aufdeckbtn">Antwort zeigen</button></div>`}
  else if(q.typ==="mc"){feld=`<div class="optionen">${q.optionen.map((o,i)=>{let c="opt";if(fertig){if(o===q.loesung)c+=" richtig";else if(o===Q.auswahl)c+=" falsch"}
     return `<button class="${c}" data-opt="${i}" ${fertig?"disabled":""}>${o}</button>`}).join("")}</div>`}
  else{const tipp=q.typ==="bruch"?"Bruch so eingeben: 3/4":q.typ==="zahl"?"Nur die Zahl eingeben":q.tipp||"";
    feld=`<form class="eingabe" id="eform" autocomplete="off"><input id="antwort" autocapitalize="off" autocorrect="off" spellcheck="false" ${fertig?"disabled":""} value="${fertig?esc(Q.auswahl):""}" aria-label="Antwort">
     ${q.einheit?`<span class="einheit">${q.einheit}</span>`:""}${fertig?"":`<button class="btn" type="submit">Prüfen</button>`}</form>${tipp&&!fertig?`<p class="tipp">${tipp}</p>`:""}`}
  const rueck=fertig&&q.typ!=="karte"?`<div class="rueck ${letzte.ok?"ok":"no"} pop"><strong>${letzte.ok?pick(["Richtig!","Super!","Klasse!","Genau!","Stark!"]):"Leider falsch."}</strong>
     ${letzte.ok?"":`<span>Richtig ist: <b>${loesungText(q)}</b></span>`}${q.erkl?`<span>${q.erkl}</span>`:""}</div>
     <div class="row"><button class="btn" data-act="weiter" id="weiterbtn">${Q.i+1<Q.fragen.length?"Weiter":"Auswertung"}</button></div>`:"";
  const titel=Q.modus==="probe"?"Probe-Training":Q.modus==="heute"?"Heute dran":t.titel;
  return `<div style="--fach:${f.farbe};display:flex;flex-direction:column;gap:16px">
   <div class="quizkopf"><button class="back" data-act="abbrechen">✕ Beenden</button><span class="muted" style="font-weight:700">${titel} · ${Q.i+1} / ${Q.fragen.length}</span></div>
   <div class="balken"><i style="width:${Math.round(100*Q.i/Q.fragen.length)}%"></i></div>
   <section class="karte"><span class="fachzeile">${f.name} · ${t.titel}</span><div class="frage">${q.frage}</div>${feld}${rueck}</section></div>`}

function vErgebnis(){
  const r=Q.antworten.filter(a=>a.ok).length,n=Q.antworten.length,p=Math.round(100*r/n),falsch=Q.antworten.filter(a=>!a.ok);
  const farbe=Q.modus==="heute"?"var(--mathe)":fach(thema(Q.fragen[0].themaId).fach).farbe;
  let kopf;
  if(Q.modus==="probe")kopf=`<p class="muted">Deine Note im Probe-Training</p><div class="note">${note(p)}</div><p><b>${r} von ${n}</b> richtig (${p} %). ${NOTENTEXT[note(p)]}</p>`;
  else kopf=`<h2>${Q.modus==="heute"?"Geschafft für heute!":thema(Q.themaId).titel}</h2><p><b>${r} von ${n}</b> richtig (${p} %). ${falsch.length?"Was falsch war, kommt morgen wieder dran.":"Alles richtig, super!"}</p>`;
  const liste=(Q.modus==="probe"?Q.antworten:falsch).map(a=>`<div class="eintrag ${a.ok?"ok":""}"><div>${a.q.frage}</div><div>${a.ok?"✓ richtig":`${a.q.typ==="karte"||a.wert===""?"":`✗ Deine Antwort: ${esc(a.wert)} · `}Richtig: <b>${loesungText(a.q)}</b>`}</div>${!a.ok&&a.q.erkl?`<div class="muted">${a.q.erkl}</div>`:""}</div>`).join("");
  const zurueck=Q.modus==="heute"?"":`<button class="btn ghost" data-go="fach" data-fach="${thema(Q.fragen[0].themaId).fach}">Zurück zum Fach</button>`;
  const nochmal=Q.modus==="heute"?(heuteDran().length?`<button class="btn" data-act="heute">Weitere Fragen</button>`:""):`<button class="btn" data-act="nochmal">Nochmal</button>`;
  return `<div style="--fach:${farbe};display:flex;flex-direction:column;gap:16px">
   <section class="ergebnis">${kopf}<div class="row">${nochmal}${zurueck}<button class="btn ghost" data-go="start">Startseite</button></div></section>
   ${liste?`<section class="liste"><h3>${Q.modus==="probe"?"Alle Aufgaben":"Das schaust du dir nochmal an"}</h3>${liste}</section>`:""}</div>`}

function render(){
  let h;if(Q)h=vQuiz();else if(V.seite==="fach")h=vFach();else if(V.seite==="merke")h=vMerke();else h=vStart();
  app.innerHTML=h;
  const inp=document.getElementById("antwort");if(inp&&!inp.disabled)inp.focus({preventScroll:true});
  for(const id of["weiterbtn","aufdeckbtn"]){const b=document.getElementById(id);if(b)b.focus({preventScroll:true})}
  const form=document.getElementById("eform");if(form)form.addEventListener("submit",e=>{e.preventDefault();if(inp.value.trim())antworten(inp.value)})}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.go){go(d.go,{fach:d.fach,thema:d.thema});return}
  if(d.opt!==undefined&&Q){antworten(Q.fragen[Q.i].optionen[+d.opt]);return}
  switch(d.act){
   case"heute":starte("heute");break;
   case"ueben":starte("ueben",{themaId:d.thema});break;
   case"probe":{const ids=[...document.querySelectorAll(".chips input:checked")].map(i=>i.value);if(ids.length)starte("probe",{themaIds:ids,fachId:d.fach});break}
   case"aufdecken":Q.aufgedeckt=true;render();break;
   case"gewusst":antworten(true);break;
   case"nichtgewusst":antworten(false);break;
   case"weiter":weiter();break;
   case"abbrechen":{const t=thema(Q.fragen[Q.i].themaId);const m=Q.modus;Q=null;if(m==="heute")go("start");else go("fach",{fach:t.fach});break}
   case"nochmal":{const {modus,themaId,themaIds,fachId}=Q;starte(modus,{themaId,themaIds,fachId});break}
  }});
render();
</script>
