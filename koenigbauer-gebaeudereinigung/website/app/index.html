<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Königbauer Team-App</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E141D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Archivo";src:url(../fonts/archivo-latin-900-normal.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Manrope";src:url(../fonts/manrope-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Manrope";src:url(../fonts/manrope-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Manrope";src:url(../fonts/manrope-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--dark:#0E141D;--bg:#F4F6F8;--card:#fff;--ink:#0C0D10;--muted:#5B6573;--line:#E2E6EB;--blau:#008DD2;--blau-t:#0077B3;--eis:#E6F4FB;--rot:#C62828;--rot-l:#FDECEC;--gruen:#1E8E5A;--gruen-l:#E5F5EC;--orange:#B5640C;--orange-l:#FDF1E3;
--display:"Archivo","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--dark);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
header .badge{width:40px;height:40px;border-radius:10px;flex:none}
header .t b{display:block;font:900 18px/1 var(--display)}
header .t span{display:block;font-size:10px;letter-spacing:.28em;color:#3BB4F0;margin-top:4px;font-weight:800}
header .wer{margin-left:auto;text-align:right;font-size:14px;color:#fff;line-height:1.2}
header .wer small{display:block;color:#A9B4C4;font-size:12px}
main{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
h1{font:900 27px/1.1 var(--display);margin:4px 0 14px;letter-spacing:-.02em}
h2{font:900 19px/1.2 var(--display);margin:22px 0 10px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:900 24px/1 var(--display);color:var(--blau-t);font-variant-numeric:tabular-nums;margin-bottom:4px}
.stat span{font-size:13px;color:var(--muted)}
.monat{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monat b{font:900 21px var(--display)}
.rund{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.tage{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tag{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;color:inherit}
.tag:first-child{border-top:0}
.tag.we{background:#F8FAFC}
.tag .d{width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;text-align:center;font:900 17px/1 var(--display);flex:none}
.tag .d small{display:block;font:700 10px var(--body);color:var(--muted)}
.tag.voll .d{background:var(--blau);color:#fff}.tag.voll .d small{color:#D5EEFA}
.tag.heute .d{outline:2px solid var(--blau);outline-offset:2px}
.tag .info{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .h{font-weight:800;color:var(--blau-t);font-variant-numeric:tabular-nums}
.tag .plus{font-size:22px;color:var(--muted)}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blau);background:#fff}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:999px;background:var(--blau);color:#fff;font:800 16px var(--body);cursor:pointer;text-decoration:none;margin-top:12px}
.btn.zweit{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.rot{background:var(--rot-l);color:var(--rot)}
.btn.wa{background:#1FA855}
.btn.klein{width:auto;padding:9px 14px;font-size:14px;margin:0}
.reihe{display:flex;gap:10px;flex-wrap:wrap}.reihe .btn{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--eis);color:var(--blau-t)}
.pill.ok{background:var(--gruen-l);color:var(--gruen)}.pill.rot{background:var(--rot-l);color:var(--rot)}.pill.or{background:var(--orange-l);color:var(--orange)}
.artikel{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.artikel:first-child{border-top:0}
.artikel span{flex:1;min-width:0}
.menge{display:flex;align-items:center;gap:8px;flex:none}
.menge button{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:20px;cursor:pointer;color:var(--ink)}
.menge button.p{background:var(--blau);color:#fff}
.menge b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.frei{display:grid;grid-template-columns:1fr 90px 48px;gap:8px;align-items:center}
.frei button{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:22px;cursor:pointer}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wahl label{margin:0;cursor:pointer}
.wahl input{position:absolute;opacity:0;pointer-events:none}
.wahl .k{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:800}
.wahl .k i{font-style:normal;font-size:24px}
.wahl input:checked+.k{border-color:var(--blau);background:var(--eis);color:var(--blau-t)}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.foto-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:700;cursor:pointer}
.sig{width:100%;height:190px;border:2px dashed var(--blau);border-radius:12px;background:#fff;touch-action:none;display:block}
.hinweis{background:var(--eis);border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
.filter{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;white-space:nowrap;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:700 14px var(--body);cursor:pointer}
.filter button.an{background:var(--blau);border-color:var(--blau);color:#fff}
.eintrag-kopf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.eintrag-kopf .zeit{margin-left:auto;font-size:13px;color:var(--muted)}
.eintrag ul{margin:6px 0;padding-left:20px}
.archiv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.archiv:first-child{border-top:0}
nav{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font:700 11.5px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav button i{font-style:normal;font-size:22px}
nav button.an{color:var(--blau-t)}
nav button.an::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--blau)}
.modal{position:fixed;inset:0;background:rgba(14,20,29,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.start{background:var(--dark);color:#fff;border-radius:20px;padding:28px 18px;text-align:center;margin-bottom:14px}
.start img{width:96px;height:96px;border-radius:22px;margin:0 auto 12px;display:block}
.start b{display:block;font:900 26px var(--display)}.start span{display:block;font-size:12px;letter-spacing:.3em;color:#3BB4F0;font-weight:800;margin-top:6px}
a.link{color:var(--blau-t);font-weight:700}
</style>
</head>
<body>
<header><img class="badge" src="../img/rk-badge.png" alt=""><div class="t"><b>Königbauer</b><span>GEBÄUDEREINIGUNG</span></div><div class="wer" id="wer"></div></header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-s="stunden"><i>🕒</i>Stunden</button>
  <button data-s="bestellen"><i>🛒</i>Bestellen</button>
  <button data-s="melden"><i>📷</i>Kaputt/Melden</button>
  <button data-s="verlauf"><i>📋</i>Verlauf</button>
  <button data-s="konto"><i>👤</i>Konto</button>
</nav>
<div class="modal" id="modal" hidden><div class="modal-box" id="mbox"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="jspdf.min.js"></script>
<script>
/* ============================================================
   Königbauer Team-App – läuft komplett auf dem Handy.
   Alle Einträge bleiben auf diesem Gerät (localStorage).
   Versand an den Chef per Teilen (WhatsApp/Mail) oder Download.
   ============================================================ */
var CHEF = { name: 'Robert Königbauer', mail: 'info@koenigbauer-gebaeudereinigung.de', wa: '491721083808', firma: 'Königbauer Gebäudereinigung' };
var ARTIKEL = ['Müllbeutel 120 L','Müllbeutel 35 L','Bio-Müllbeutel 10 L (kompostierbar)','Glasreiniger','Sanitärreiniger','Urinsteinentferner','Allzweck-/Unterhaltsreiniger','Mikrofasertücher','Einweghandschuhe Nitril','Swiffer Staubtücher (Nachfüll)','Staubsaugerbeutel','Wischmopp-Bezüge','Schwämme / Pads'];
var KEY = 'koenigbauer-team-app-v1';
var WT = ['So','Mo','Di','Mi','Do','Fr','Sa'], WTL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

var D = laden();
D.eintraege = D.eintraege || {}; D.signaturen = D.signaturen || {}; D.objekte = D.objekte || []; D.verlauf = D.verlauf || []; D.gesendet = D.gesendet || {};
var S = { seite: 'stunden', monat: heuteMonat(), best: {}, frei: [], fotos: [], filter: 'alle' };
function laden(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {} }catch(e){ return {} } }
function speichern(){ try{ localStorage.setItem(KEY, JSON.stringify(D)) }catch(e){ toast('Speichern nicht möglich – Speicher voll oder privater Modus?') } }

var $ = function(s){ return document.querySelector(s) }, $$ = function(s){ return [].slice.call(document.querySelectorAll(s)) };
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }
function z2(n){ return String(n).padStart(2,'0') }
function heuteMonat(){ var d=new Date(); return d.getFullYear()+'-'+z2(d.getMonth()+1) }
function heuteIso(){ var d=new Date(); return heuteMonat()+'-'+z2(d.getDate()) }
function jetzt(){ return new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) }
function monatName(m){ var p=m.split('-'); return MON[+p[1]-1]+' '+p[0] }
function monatPlus(m,n){ var p=m.split('-'), d=new Date(+p[0],+p[1]-1+n,1); return d.getFullYear()+'-'+z2(d.getMonth()+1) }
function minuten(e){ if(!e||!e.von||!e.bis)return 0; var a=e.von.split(':'),b=e.bis.split(':'); var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]); if(m<0)m+=1440; return Math.max(0,m-(+e.pause||0)) }
function std(m){ return (m/60).toFixed(2).replace('.',',') }
function tageImMonat(m){ var p=m.split('-'); var n=new Date(+p[0],+p[1],0).getDate(), out=[]; for(var i=1;i<=n;i++) out.push(m+'-'+z2(i)); return out }
function wd(iso){ return new Date(iso+'T12:00').getDay() }
function datumDe(iso){ var p=iso.split('-'); return WT[wd(iso)]+', '+p[2]+'.'+p[1]+'.'+p[0] }
function monatSumme(m){ var s=0,t=0; tageImMonat(m).forEach(function(d){ var x=minuten(D.eintraege[d]); if(x){s+=x;t++} }); return {min:s,tage:t} }
function toast(t){ var el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){el.hidden=true},2800) }
function modal(html){ $('#mbox').innerHTML=html; $('#modal').hidden=false }
function zu(){ $('#modal').hidden=true }
$('#modal').addEventListener('click',function(e){ if(e.target.id==='modal')zu() });

/* ---------- Versand ---------- */
function teilenDateien(files, titel, text){
  if (navigator.canShare && navigator.canShare({ files: files })) return navigator.share({ files: files, title: titel, text: text }).then(function(){ return true }).catch(function(e){ return e.name==='AbortError'?false:'fehler' });
  return Promise.resolve('fehler');
}
function herunterladen(blob, name){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500) }
function whatsapp(text){ location.href='https://wa.me/'+CHEF.wa+'?text='+encodeURIComponent(text) }
function mail(betreff,text){ location.href='mailto:'+CHEF.mail+'?subject='+encodeURIComponent(betreff)+'&body='+encodeURIComponent(text) }
function verlaufAdd(e){ e.id=Date.now(); e.zeit=jetzt(); D.verlauf.unshift(e); D.verlauf=D.verlauf.slice(0,100); speichern() }

/* ---------- Rahmen ---------- */
function render(){
  $('#wer').innerHTML = D.name ? esc(D.name)+'<small>Mitarbeiter/in</small>' : '';
  $('#nav').hidden = !D.name;
  $$('nav button').forEach(function(b){ b.classList.toggle('an', b.dataset.s===S.seite) });
  if(!D.name) return startseite();
  ({stunden:stunden, bestellen:bestellen, melden:melden, verlauf:verlauf, konto:konto})[S.seite]();
}
function gehe(s){ S.seite=s; render(); scrollTo(0,0) }
$$('nav button').forEach(function(b){ b.onclick=function(){ gehe(b.dataset.s) } });

function startseite(){
  $('#main').innerHTML='<div class="start"><img src="../img/rk-badge.png" alt=""><b>Königbauer</b><span>GEBÄUDEREINIGUNG</span></div>'+
    '<div class="card"><h2 style="margin-top:0">Willkommen!</h2><label for="n">Dein Vor- und Nachname</label><input id="n" autocomplete="name" placeholder="z. B. Anna Beispiel">'+
    '<div class="hinweis">Deine Stunden werden <b>nur auf diesem Handy</b> gespeichert – niemand sonst sieht sie. Am Monatsende schickst du den Stundenzettel an Robert.<br><br>Tipp: Über „Teilen“ → <b>„Zum Startbildschirm“</b> wird die Seite zur App.</div>'+
    '<button class="btn" id="los">Los geht\'s</button></div><p class="muted" style="text-align:center"><a class="link" href="../impressum.html">Impressum</a> · <a class="link" href="../datenschutz.html#team-app">Datenschutz</a></p>';
  $('#los').onclick=function(){ var n=$('#n').value.trim(); if(n.length<3)return toast('Bitte deinen Namen eintragen.'); D.name=n; speichern(); render() };
}

/* ---------- Stunden ---------- */
function stunden(){
  var m=S.monat, s=monatSumme(m), sig=D.signaturen[m], heute=heuteIso(), gesendet=D.gesendet[m];
  var status = gesendet?'📤 gesendet':(sig?'✅ unterschrieben':'✏️ offen');
  var h='<h1>Mein Stundenzettel</h1>'+
    '<div class="monat"><button class="rund" id="zur" aria-label="Vormonat">‹</button><b>'+monatName(m)+'</b><button class="rund" id="vor" aria-label="Nächster Monat">›</button></div>'+
    '<div class="stats"><div class="stat"><b>'+std(s.min)+'</b><span>Stunden</span></div><div class="stat"><b>'+s.tage+'</b><span>Arbeitstage</span></div><div class="stat" style="grid-column:span 2"><b style="font-size:18px">'+status+'</b><span>Status'+(gesendet?' – am '+esc(gesendet):'')+'</span></div></div>';
  if(sig){
    h+='<div class="card"><span class="pill ok">Unterschrieben am '+esc(sig.am)+'</span>'+
       '<button class="btn" id="senden">📤 An Chef senden</button><button class="btn zweit" id="pdf">🖨️ Ansehen / Drucken</button><button class="btn rot" id="oeffnen">Unterschrift zurücknehmen</button></div>';
  } else {
    if(s.tage) h+='<button class="btn" id="unter" style="margin:0 0 14px">✍️ Monat unterschreiben</button>';
    h+='<p class="muted">Tippe auf einen Tag und trage ein, von wann bis wann du gearbeitet hast – am besten gleich am selben Tag.</p>';
  }
  h+='<div class="tage">';
  tageImMonat(m).forEach(function(t){
    var e=D.eintraege[t], mm=minuten(e), w=wd(t);
    var info = mm ? e.von+'–'+e.bis+(e.pause?' ('+e.pause+' min Pause)':'')+(e.objekt?' · '+e.objekt:'') : '–';
    h+='<button class="tag'+(mm?' voll':'')+((w===0||w===6)?' we':'')+(t===heute?' heute':'')+'" data-t="'+t+'">'+
       '<span class="d">'+(+t.slice(8))+'<small>'+WT[w]+'</small></span><span class="info">'+esc(info)+'</span>'+
       (mm?'<span class="h">'+std(mm)+' h</span>':(sig?'':'<span class="plus">＋</span>'))+'</button>';
  });
  h+='</div>';
  // Archiv
  var monate=Object.keys(D.eintraege).map(function(t){return t.slice(0,7)}).filter(function(x,i,a){return a.indexOf(x)===i&&x!==m}).sort().reverse();
  if(monate.length){
    h+='<h2>📁 Meine früheren Stundenzettel</h2><div class="card">';
    monate.forEach(function(x){ var su=monatSumme(x); h+='<div class="archiv"><div><b>'+monatName(x)+'</b><div class="muted">'+std(su.min)+' h · '+su.tage+' Tage · '+(D.gesendet[x]?'gesendet':(D.signaturen[x]?'unterschrieben':'offen'))+'</div></div><button class="btn zweit klein" data-m="'+x+'">Öffnen</button></div>' });
    h+='</div>';
  }
  $('#main').innerHTML=h;
  $('#zur').onclick=function(){ S.monat=monatPlus(m,-1); render() };
  $('#vor').onclick=function(){ S.monat=monatPlus(m,1); render() };
  $$('.tag').forEach(function(b){ b.onclick=function(){ if(sig) return toast('Monat ist unterschrieben – zum Ändern erst Unterschrift zurücknehmen.'); tagBearbeiten(b.dataset.t) } });
  $$('.archiv button').forEach(function(b){ b.onclick=function(){ S.monat=b.dataset.m; render(); scrollTo(0,0) } });
  if($('#unter')) $('#unter').onclick=function(){ unterschreiben(m) };
  if($('#senden')) $('#senden').onclick=function(){ senden(m) };
  if($('#pdf')) $('#pdf').onclick=function(){ pdfErstellen(m).then(function(blob){ var w=window.open(URL.createObjectURL(blob),'_blank'); if(!w)herunterladen(blob,pdfName(m)) }) };
  if($('#oeffnen')) $('#oeffnen').onclick=function(){ frage('Unterschrift zurücknehmen?','Danach kannst du den Monat wieder bearbeiten und musst neu unterschreiben.','Zurücknehmen',function(){ delete D.signaturen[m]; delete D.gesendet[m]; speichern(); render() }) };
}
function pdfName(m){ return 'Stundenzettel_'+D.name.replace(/\s+/g,'_')+'_'+m+'.pdf' }
function senden(m){
  pdfErstellen(m).then(function(blob){
    var file=new File([blob],pdfName(m),{type:'application/pdf'});
    return teilenDateien([file],'Stundenzettel '+monatName(m),'Stundenzettel '+monatName(m)+' – '+D.name).then(function(r){
      if(r===true){ D.gesendet[m]=jetzt(); verlaufAdd({typ:'stunden',titel:'Stundenzettel '+monatName(m),text:std(monatSumme(m).min)+' Stunden'}); render(); toast('Gesendet ✓') }
      else if(r==='fehler'){
        herunterladen(blob,pdfName(m));
        modal('<h2>PDF gespeichert</h2><p class="muted">Dein Gerät kann die Datei nicht direkt teilen. Das PDF wurde heruntergeladen – bitte per WhatsApp oder E-Mail an Robert schicken.</p><a class="btn wa" href="https://wa.me/'+CHEF.wa+'">WhatsApp öffnen</a><button class="btn zweit" id="mok">Erledigt – als gesendet markieren</button>');
        $('#mok').onclick=function(){ D.gesendet[m]=jetzt(); verlaufAdd({typ:'stunden',titel:'Stundenzettel '+monatName(m),text:std(monatSumme(m).min)+' Stunden'}); zu(); render() };
      }
    });
  });
}
function letzterEintrag(){ var ks=Object.keys(D.eintraege).sort(); return ks.length?D.eintraege[ks[ks.length-1]]:null }
function tagBearbeiten(t){
  var alt=D.eintraege[t], e=alt||letzterEintrag()||{von:'',bis:'',pause:15,objekt:'',bem:''};
  var p=t.split('-');
  modal('<h2>'+WTL[wd(t)]+', '+(+p[2])+'. '+MON[+p[1]-1]+'</h2>'+(!alt&&letzterEintrag()?'<p class="muted">Vorschlag vom letzten Eintrag – bitte prüfen.</p>':'')+
    '<div class="zwei"><div><label for="von">Von</label><input id="von" type="time" value="'+esc(e.von)+'"></div><div><label for="bis">Bis</label><input id="bis" type="time" value="'+esc(e.bis)+'"></div></div>'+
    '<label for="pause">Pause (Minuten)</label><select id="pause">'+[0,15,30,45,60].map(function(x){return '<option'+(+e.pause===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'+
    '<label for="obj">Objekt / Kunde (optional)</label><input id="obj" list="objliste" value="'+esc(e.objekt)+'" placeholder="z. B. Praxis Dr. Huber"><datalist id="objliste">'+D.objekte.map(function(o){return '<option value="'+esc(o)+'">'}).join('')+'</datalist>'+
    '<label for="bem">Bemerkung (optional)</label><input id="bem" value="'+esc(alt?alt.bem:'')+'">'+
    '<button class="btn" id="ok">Speichern</button>'+(alt?'<button class="btn rot" id="del">Tag löschen</button>':'')+'<button class="btn zweit" id="abb">Abbrechen</button>');
  $('#abb').onclick=zu;
  if($('#del')) $('#del').onclick=function(){ delete D.eintraege[t]; speichern(); zu(); render() };
  $('#ok').onclick=function(){
    var n={von:$('#von').value,bis:$('#bis').value,pause:+$('#pause').value,objekt:$('#obj').value.trim(),bem:$('#bem').value.trim()};
    if(!n.von||!n.bis) return toast('Bitte Von und Bis eintragen.');
    if(!minuten(n)) return toast('Die Zeiten passen nicht zusammen.');
    D.eintraege[t]=n; if(n.objekt){ D.objekte=D.objekte.filter(function(o){return o!==n.objekt}); D.objekte.push(n.objekt); D.objekte=D.objekte.slice(-30) }
    speichern(); zu(); render(); toast('Gespeichert ✓');
  };
}
function frage(titel,text,knopf,ja){
  modal('<h2>'+titel+'</h2><p class="muted">'+text+'</p><div class="reihe"><button class="btn zweit" id="nein">Abbrechen</button><button class="btn rot" id="ja">'+knopf+'</button></div>');
  $('#nein').onclick=zu; $('#ja').onclick=function(){ zu(); ja() };
}
function unterschreiben(m){
  modal('<h2>Monat unterschreiben</h2><p class="muted">'+monatName(m)+' – mit dem Finger unterschreiben. Damit bestätigst du die Richtigkeit deiner Angaben.</p><canvas class="sig" id="sig"></canvas>'+
    '<div class="reihe"><button class="btn zweit" id="leer">Löschen</button><button class="btn" id="fertig">Unterschreiben</button></div><button class="btn zweit" id="abb">Abbrechen</button>');
  var c=$('#sig'), r=c.getBoundingClientRect(), x=c.getContext('2d'), dpr=window.devicePixelRatio||1, mal=false, leer=true;
  c.width=r.width*dpr; c.height=r.height*dpr; x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#0b2a6b';
  function pos(e){ var b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top] }
  c.onpointerdown=function(e){ mal=true; leer=false; c.setPointerCapture(e.pointerId); var p=pos(e); x.beginPath(); x.moveTo(p[0],p[1]) };
  c.onpointermove=function(e){ if(!mal)return; var p=pos(e); x.lineTo(p[0],p[1]); x.stroke() };
  c.onpointerup=c.onpointercancel=function(){ mal=false };
  $('#leer').onclick=function(){ x.clearRect(0,0,c.width,c.height); leer=true };
  $('#abb').onclick=zu;
  $('#fertig').onclick=function(){ if(leer)return toast('Bitte unterschreiben.'); D.signaturen[m]={bild:c.toDataURL('image/png'),am:jetzt()}; speichern(); zu(); render(); toast('Unterschrieben ✓ – jetzt an den Chef senden.') };
}

/* ---------- PDF ---------- */
var logoDaten=null;
function logoLaden(){ if(logoDaten)return Promise.resolve(logoDaten); return fetch('../img/rk-badge.png').then(function(r){return r.blob()}).then(function(b){return new Promise(function(ok){var fr=new FileReader();fr.onload=function(){logoDaten=fr.result;ok(logoDaten)};fr.readAsDataURL(b)})}).catch(function(){return null}) }
function pdfErstellen(m){
  return logoLaden().then(function(logo){
    var doc=new jspdf.jsPDF({unit:'mm',format:'a4'}), L=15, W=180, y=14, blau=[0,141,210];
    if(logo) doc.addImage(logo,'PNG',L,y,18,18);
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(12,13,16); doc.text(CHEF.firma,L+23,y+7);
    doc.setFontSize(12); doc.text('Stundenzettel',L+23,y+13.5); doc.setFont('helvetica','normal');
    y+=25; doc.setFontSize(10); doc.text('Mitarbeiter/in: '+D.name,L,y); doc.text('Erstellt: '+new Date().toLocaleString('de-DE'),L+W,y,{align:'right'});
    y+=5; doc.text('Monat: '+monatName(m),L,y); y+=3; doc.setFillColor.apply(doc,blau); doc.rect(L,y,W,1.2,'F'); y+=4;
    var sp=[['Datum',32],['Von',17],['Bis',17],['Pause',17],['Stunden',19],['Objekt / Bemerkung',78]];
    function kopf(){ doc.setFillColor.apply(doc,blau); doc.rect(L,y,W,7,'F'); doc.setTextColor(255); doc.setFont('helvetica','bold'); var xx=L; sp.forEach(function(s){doc.text(s[0],xx+2,y+4.8); xx+=s[1]}); doc.setTextColor(12,13,16); doc.setFont('helvetica','normal'); y+=7 }
    kopf(); var summe=0, tage=0, i=0;
    tageImMonat(m).forEach(function(t){
      var e=D.eintraege[t], mm=minuten(e); if(!mm)return;
      if(y>250){ doc.addPage(); y=15; kopf() }
      if(i++%2){ doc.setFillColor(238,246,251); doc.rect(L,y,W,6.5,'F') }
      var ob=[e.objekt,e.bem].filter(Boolean).join(' – ');
      var werte=[datumDe(t),e.von,e.bis,(e.pause||0)+' min',std(mm),doc.splitTextToSize(ob,76)[0]||''], xx=L;
      werte.forEach(function(v,k){ doc.text(String(v),xx+2,y+4.5); xx+=sp[k][1] }); y+=6.5; summe+=mm; tage++;
    });
    y+=3; doc.setDrawColor(150); doc.line(L,y,L+W,y); y+=6; doc.setFont('helvetica','bold');
    doc.text('Arbeitstage: '+tage,L,y); doc.text('Stunden gesamt: '+std(summe)+' h',L+W,y,{align:'right'}); doc.setFont('helvetica','normal');
    y=Math.max(y+30,250); doc.setFontSize(9); doc.text('Ich bestätige die Richtigkeit der Angaben.',L,y-28);
    var sig=D.signaturen[m]; if(sig&&sig.bild) doc.addImage(sig.bild,'PNG',L,y-22,60,20);
    doc.line(L,y,L+80,y); doc.line(L+100,y,L+W,y);
    doc.text('Datum, Unterschrift Mitarbeiter/in'+(sig?' ('+sig.am+')':''),L,y+4); doc.text('Datum, Unterschrift Arbeitgeber',L+100,y+4);
    return doc.output('blob');
  });
}

/* ---------- Bestellen ---------- */
function bestellen(){
  var h='<h1>Material bestellen</h1><p class="muted">Artikel antippen und mit ＋/− die Menge wählen.</p><div class="card">';
  ARTIKEL.forEach(function(a,i){ var n=S.best[a]||0; h+='<div class="artikel"><span>'+esc(a)+'</span><div class="menge"><button data-i="'+i+'" data-d="-1" aria-label="weniger">−</button><b>'+n+'</b><button class="p" data-i="'+i+'" data-d="1" aria-label="mehr">＋</button></div></div>' });
  h+='</div><div class="card"><h2 style="margin-top:0">Etwas anderes?</h2><div class="frei"><input id="fname" placeholder="z. B. Staubsaugerbeutel Typ XY"><input id="fmenge" placeholder="Menge" inputmode="numeric"><button id="fplus" aria-label="hinzufügen">＋</button></div>';
  if(S.frei.length) h+='<ul style="margin:12px 0 0;padding-left:20px">'+S.frei.map(function(f,i){return '<li>'+esc(f)+' <a href="#" class="link" data-x="'+i+'">entfernen</a></li>'}).join('')+'</ul>';
  h+='</div><div class="card"><label for="ort" style="margin-top:0">Für welches Objekt? (optional)</label><input id="ort" list="objliste2" value="'+esc(S.ort||'')+'"><datalist id="objliste2">'+D.objekte.map(function(o){return '<option value="'+esc(o)+'">'}).join('')+'</datalist>'+
     '<label style="display:flex;gap:10px;align-items:center;font-weight:600;margin-top:14px"><input type="checkbox" id="dring" style="width:auto"'+(S.dring?' checked':'')+'> ❗ Dringend – fehlt schon</label>'+
     '<button class="btn wa" id="wa">Bestellung per WhatsApp senden</button><button class="btn zweit" id="ml">Per E-Mail senden</button></div>';
  $('#main').innerHTML=h;
  function merk(){ S.ort=$('#ort').value; S.dring=$('#dring').checked }
  $$('.menge button').forEach(function(b){ b.onclick=function(){ merk(); var a=ARTIKEL[+b.dataset.i]; S.best[a]=Math.max(0,(S.best[a]||0)+ +b.dataset.d); var y=scrollY; bestellen(); scrollTo(0,y) } });
  $('#fplus').onclick=function(){ merk(); var n=$('#fname').value.trim(); if(!n)return toast('Bitte eintragen, was du brauchst.'); var mg=$('#fmenge').value.trim(); S.frei.push((mg?mg+' × ':'')+n); var y=scrollY; bestellen(); scrollTo(0,y) };
  $$('a[data-x]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); merk(); S.frei.splice(+a.dataset.x,1); var y=scrollY; bestellen(); scrollTo(0,y) } });
  function liste(){ merk(); var l=Object.keys(S.best).filter(function(a){return S.best[a]>0}).map(function(a){return S.best[a]+' × '+a}).concat(S.frei); if(!l.length)toast('Bitte mindestens einen Artikel wählen.'); return l }
  function text(l){ return (S.dring?'❗ DRINGEND – ':'')+'Bestellung von '+D.name+(S.ort?'\nObjekt: '+S.ort:'')+'\n'+l.map(function(x){return '• '+x}).join('\n') }
  function fertig(l){ verlaufAdd({typ:'bestellung',titel:'Bestellung',liste:l,ort:S.ort,dringend:S.dring}); S.best={}; S.frei=[]; S.dring=false }
  $('#wa').onclick=function(){ var l=liste(); if(!l.length)return; var t=text(l); fertig(l); whatsapp(t) };
  $('#ml').onclick=function(){ var l=liste(); if(!l.length)return; var t=text(l); fertig(l); mail('Bestellung von '+D.name,t) };
}

/* ---------- Kaputt / Melden ---------- */
function melden(){
  $('#main').innerHTML='<h1>Kaputt / Melden</h1><p class="muted">Etwas ist kaputt oder nicht in Ordnung? Mach am besten gleich ein Foto – alles wird mit Datum und Uhrzeit dokumentiert. Material brauchst du? → <a href="#" class="link" id="zubest">Bestellen</a></p>'+
    '<div class="card"><div class="wahl"><label><input type="radio" name="art" value="Etwas kaputt" checked><span class="k"><i>🔧</i>Etwas kaputt</span></label><label><input type="radio" name="art" value="Sonstiges"><span class="k"><i>💬</i>Sonstiges</span></label></div>'+
    '<label for="wo">Objekt / Ort</label><input id="wo" list="objliste3" placeholder="z. B. Treppenhaus Lindenstr. 4"><datalist id="objliste3">'+D.objekte.map(function(o){return '<option value="'+esc(o)+'">'}).join('')+'</datalist>'+
    '<label for="was">Beschreibung</label><textarea id="was" rows="3" placeholder="Was ist los?"></textarea>'+
    '<label>Fotos</label><label class="foto-btn" for="foto">📷 Foto aufnehmen oder auswählen</label><input id="foto" type="file" accept="image/*" multiple hidden><div class="fotos" id="fv"></div>'+
    '<button class="btn" id="send">Meldung senden</button></div>';
  S.fotos=[];
  $('#zubest').onclick=function(e){ e.preventDefault(); gehe('bestellen') };
  $('#foto').onchange=function(){ [].slice.call(this.files).forEach(function(f){ S.fotos.push(f) }); $('#fv').innerHTML=S.fotos.map(function(f){return '<img src="'+URL.createObjectURL(f)+'" alt="Foto">'}).join(''); this.value='' };
  $('#send').onclick=function(){
    var was=$('#was').value.trim(); if(!was)return toast('Bitte kurz beschreiben, was los ist.');
    var art=$('input[name=art]:checked').value, wo=$('#wo').value.trim();
    var t=(art==='Etwas kaputt'?'🔧 ':'💬 ')+art+' – gemeldet von '+D.name+' am '+jetzt()+(wo?'\nOrt: '+wo:'')+'\n'+was;
    var eintrag={typ:'meldung',titel:art,ort:wo,text:was,fotos:S.fotos.length};
    if(S.fotos.length){
      teilenDateien(S.fotos,'Meldung',t).then(function(r){
        if(r===true){ verlaufAdd(eintrag); toast('Gesendet ✓'); melden() }
        else if(r==='fehler'){ verlaufAdd(eintrag); toast('Fotos bitte in WhatsApp selbst anhängen.'); whatsapp(t) }
      });
    } else { verlaufAdd(eintrag); whatsapp(t) }
  };
}

/* ---------- Verlauf ---------- */
function verlauf(){
  var l=D.verlauf.filter(function(e){ return S.filter==='alle'||e.typ===S.filter });
  var h='<h1>Mein Verlauf</h1><p class="muted">Was du an Robert geschickt hast. Den Stand („bestellt“, „erledigt“) erfährst du direkt von Robert per WhatsApp.</p>'+
    '<div class="filter"><button data-f="alle">Alle ('+D.verlauf.length+')</button><button data-f="bestellung">Bestellungen</button><button data-f="meldung">Meldungen</button><button data-f="stunden">Stunden</button></div>';
  if(!l.length) h+='<div class="card muted">Noch nichts gesendet.</div>';
  l.forEach(function(e){
    var pill = e.typ==='bestellung'?'<span class="pill or">🛒 Bestellung</span>':e.typ==='meldung'?'<span class="pill rot">'+(e.titel==='Etwas kaputt'?'🔧 Kaputt':'💬 Sonstiges')+'</span>':'<span class="pill ok">🕒 Stundenzettel</span>';
    h+='<div class="card eintrag"><div class="eintrag-kopf">'+pill+(e.dringend?'<span class="pill rot">❗ dringend</span>':'')+'<span class="zeit">'+esc(e.zeit)+'</span></div>';
    if(e.liste) h+='<ul>'+e.liste.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    if(e.typ==='stunden') h+='<b>'+esc(e.titel)+'</b><div class="muted">'+esc(e.text)+'</div>';
    if(e.typ==='meldung') h+='<div>'+esc(e.text)+'</div>'+(e.fotos?'<div class="muted">📷 '+e.fotos+' Foto(s)</div>':'');
    if(e.ort) h+='<div class="muted">📍 '+esc(e.ort)+'</div>';
    h+='</div>';
  });
  $('#main').innerHTML=h;
  $$('.filter button').forEach(function(b){ b.classList.toggle('an',b.dataset.f===S.filter); b.onclick=function(){ S.filter=b.dataset.f; verlauf() } });
}

/* ---------- Konto ---------- */
function konto(){
  var anz=Object.keys(D.eintraege).length;
  $('#main').innerHTML='<h1>Konto</h1>'+
    '<div class="card"><label for="nm" style="margin-top:0">Dein Name</label><input id="nm" value="'+esc(D.name)+'"><button class="btn zweit" id="nmok">Namen speichern</button></div>'+
    '<div class="card"><h2 style="margin-top:0">Datensicherung</h2><p class="muted">Deine Einträge ('+anz+' Tage) liegen nur auf diesem Handy. Vor einem Handywechsel oder bevor du den Browser-Verlauf löschst: Sicherung speichern.</p>'+
    '<button class="btn zweit" id="exp">💾 Sicherung speichern</button><label class="btn zweit" style="cursor:pointer" for="imp">📂 Sicherung laden</label><input type="file" id="imp" accept=".json,application/json" hidden></div>'+
    '<div class="card"><h2 style="margin-top:0">Kontakt</h2><p class="muted">'+CHEF.name+'<br>0172 108 3808<br>'+CHEF.mail+'</p><a class="btn wa" href="https://wa.me/'+CHEF.wa+'">WhatsApp an Robert</a></div>'+
    '<div class="hinweis">🔒 Datenschutz: Deine Daten werden nur auf diesem Gerät gespeichert. Kolleginnen und Kollegen sehen nichts davon. Erst wenn du etwas sendest, geht es per WhatsApp oder E-Mail an Robert.</div>'+
    '<button class="btn rot" id="reset">Alle Daten auf diesem Handy löschen</button>'+
    '<p class="muted" style="text-align:center;margin-top:18px"><a class="link" href="../impressum.html">Impressum</a> · <a class="link" href="../datenschutz.html#team-app">Datenschutz</a></p>';
  $('#nmok').onclick=function(){ var n=$('#nm').value.trim(); if(n.length<3)return toast('Bitte Namen eintragen.'); D.name=n; speichern(); render(); toast('Gespeichert ✓') };
  $('#exp').onclick=function(){ var blob=new Blob([JSON.stringify(D)],{type:'application/json'}), name='Koenigbauer_Sicherung_'+D.name.replace(/\s+/g,'_')+'_'+heuteIso()+'.json';
    teilenDateien([new File([blob],name,{type:'application/json'})],'Sicherung','').then(function(r){ if(r==='fehler'){ herunterladen(blob,name); toast('Sicherung gespeichert ✓') } }) };
  $('#imp').onchange=function(){ var f=this.files[0]; if(!f)return; f.text().then(function(t){ var n=JSON.parse(t); if(!n||!n.eintraege)throw 0; D=n; D.signaturen=D.signaturen||{}; D.objekte=D.objekte||[]; D.verlauf=D.verlauf||[]; D.gesendet=D.gesendet||{}; speichern(); render(); toast('Sicherung geladen ✓') }).catch(function(){ toast('Diese Datei ist keine gültige Sicherung.') }) };
  $('#reset').onclick=function(){ frage('Wirklich alles löschen?','Alle Stunden, Unterschriften und der Verlauf auf diesem Handy werden gelöscht. Das kann nicht rückgängig gemacht werden.','Löschen',function(){ D={eintraege:{},signaturen:{},objekte:[],verlauf:[],gesendet:{}}; speichern(); render() }) };
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}) }
render();
</script>
